name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            tasks: ":ui:packageReleasePkg :ui:fatJar"
            asset_globs: "ui/build/compose/binaries/main-release/pkg/*.pkg ui/build/libs/*-all.jar"
          - platform: Windows
            os: windows-latest
            tasks: ":ui:packageReleaseMsi :ui:fatJar"
            asset_globs: "ui/build/compose/binaries/main-release/msi/*.msi ui/build/libs/*-all.jar"
          - platform: Linux
            os: ubuntu-latest
            tasks: ":ui:packageReleaseDeb :ui:packageReleaseRpm :ui:fatJar"
            asset_globs: "ui/build/compose/binaries/main-release/deb/*.deb ui/build/compose/binaries/main-release/rpm/*.rpm ui/build/libs/*-all.jar"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Build release assets
        shell: bash
        run: |
          set +e
          set +o pipefail
          ./gradlew ${{ matrix.tasks }} -Ppmcl.useAliyunMirror=false -Ppmcl.version="${RELEASE_TAG#v}" 2>&1 | tee gradle-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 tools/emit_gradle_failure.py gradle-release.log
            exit "$code"
          fi
          # deb/msi 不会留下 app 目录。热更新清单要扫 createReleaseDistributable 的产物。
          ./gradlew :ui:createReleaseDistributable -Ppmcl.useAliyunMirror=false -Ppmcl.version="${RELEASE_TAG#v}" 2>&1 | tee gradle-app-image.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 tools/emit_gradle_failure.py gradle-app-image.log
          fi
          exit "$code"

      - name: Sign update assets
        shell: bash
        env:
          PMCL_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.PMCL_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          case "${RUNNER_OS}" in
            macOS) os_token="macos" ;;
            Windows) os_token="windows" ;;
            Linux) os_token="linux" ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch_token="arm64" ;;
            x86_64|amd64) arch_token="x64" ;;
            *) arch_token="$(uname -m)" ;;
          esac
          found=0
          for asset in ${{ matrix.asset_globs }}; do
            [ -f "$asset" ] || continue
            found=1
            original_name="$(basename "$asset")"
            if [[ "$original_name" == *.tar.gz ]]; then
              name="pmcl-${version}-${os_token}-${arch_token}.tar.gz"
            else
              extension="${original_name##*.}"
              name="pmcl-${version}-${os_token}-${arch_token}.${extension}"
            fi
            cp "$asset" "dist/$name"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}"
            java tools/SignUpdateAsset.java "$version" "$url" "dist/$name"
          done
          [ "$found" -eq 1 ] || { echo "No release assets found"; exit 1; }
          # 更新说明：release-notes/<tag>.md 若存在则写进清单 notes 与 Release body，
          # 否则清单不带说明、Release 用 --generate-notes 兜底。
          notes_file=""
          for candidate in "release-notes/${RELEASE_TAG}.md" "release-notes/${version}.md"; do
            if [ -f "$candidate" ]; then notes_file="$candidate"; break; fi
          done
          if [ -n "$notes_file" ]; then
            echo "使用更新说明 $notes_file"
            echo "PMCL_UPDATE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          else
            echo "未找到更新说明，清单 notes 留空"
          fi
          # 强制更新开关：gradle.properties 里 pmcl.mandatory.update 必须等于本次版本才生效，
          # 免得忘了改回导致后续每个版本都被强制推送。
          mandatory_target=$(sed -n 's/^pmcl\.mandatory\.update=//p' gradle.properties | tr -d '[:space:]')
          if [ -n "$mandatory_target" ] && [ "$mandatory_target" = "$version" ]; then
            echo "本次为强制更新：客户端更新框不可跳过"
            echo "PMCL_UPDATE_MANDATORY=true" >> "$GITHUB_ENV"
          fi
          java tools/BuildHotUpdateManifest.java pack \
            "ui/build/compose/binaries" \
            "$version" "$os_token" "$arch_token" "$RELEASE_TAG" "$GITHUB_REPOSITORY" dist

      - uses: actions/upload-artifact@v4
        with:
          name: pmcl-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 取 release-notes/<tag>.md：2.7 及更早客户端的更新对话框只显示 Release body，
      # 这是唯一能触达存量用户的自有文案通道，不能交给 --generate-notes 自动生成。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: pmcl-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_file=""
          for candidate in "release-notes/${RELEASE_TAG}.md" "release-notes/${version}.md"; do
            if [ -f "$candidate" ]; then notes_file="$candidate"; break; fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -n "$notes_file" ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            fi
          elif [ -n "$notes_file" ]; then
            echo "使用更新说明 $notes_file"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PMCL ${version}" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PMCL ${version}" \
              --generate-notes
          fi
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files to upload"
            exit 1
          fi
          batch=15
          for ((i=0; i<${#files[@]}; i+=batch)); do
            gh release upload "$RELEASE_TAG" "${files[@]:i:batch}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            sleep 3
          done
