launch.loader_guide_more
zh=更老的版本还可能用到 LiteLoader 等，下一步列表里可以展开。
en=Older versions may need LiteLoader and others. Expand the full list on the next step.
ja=古いバージョンでは LiteLoader などが必要なことがあります。次の画面で一覧を開けます。

launch.loader_guide.fabric_scene
zh=偏原版
en=Close to vanilla
ja=バニラ寄り

launch.loader_guide.fabric_body
zh=使用 Fabric。想保持接近原版的手感，或只加优化和少量模组时选它。
en=Use Fabric. Choose it for a near-vanilla feel, or just optimizations and a few mods.
ja=Fabric を使います。バニラに近い感触、または最適化と少量のモッドだけ入れるときに。

launch.loader_guide.forge_scene
zh=模组和整合包
en=Mods and modpacks
ja=モッドとモッドパック

launch.loader_guide.forge_body
zh=使用 Forge。主要是玩模组和整合包时选它，现有内容最多。
en=Use Forge. Choose it when mods and modpacks are the main reason you play. It has the most existing content.
ja=Forge を使います。モッドやモッドパックが主目的ならこちら。既存のコンテンツが最も多いです。

launch.loader_guide.neoforge_scene
zh=新的模组方案
en=A newer mod stack
ja=新しいモッドの形

launch.loader_guide.neoforge_body
zh=使用 NeoForge。想试试从 Forge 分出来的新方案时选它，较新的版本更常见。
en=Use NeoForge. Choose it to try the newer stack that split off from Forge. It is more common on recent versions.
ja=NeoForge を使います。Forge から分かれた新しい形を試すときに。新しいバージョンでよく使われます。

launch.loader_guide.forbric_scene
zh=三种加载器一起用
en=Three loaders at once
ja=3つのローダーを同時に

launch.loader_guide.forbric_body
zh=使用 Forbric。同一个游戏里同时加载 Fabric、Forge 和 NeoForge 模组。目前只支持 Minecraft 26.2。
en=Use Forbric. It loads Fabric, Forge, and NeoForge mods in the same game. It currently supports only Minecraft 26.2.
ja=Forbric を使います。同じゲームで Fabric、Forge、NeoForge のモッドを同時に読み込みます。現在対応しているのは Minecraft 26.2 だけです。

launch.loader_guide.ecxp_forbric_scene
zh=增强版，26.2
en=Enhanced, 26.2
ja=強化版。26.2

launch.loader_guide.ecxp_forbric_body
zh=使用 ECXP-Forbric+。这是 PMCL 团队基于 Forbric 的增强版，同一个游戏里同时加载 Fabric、Forge 和 NeoForge 模组。目前只支持 Minecraft 26.2。
en=Use ECXP-Forbric+. It is the PMCL team's enhanced Forbric, and it loads Fabric, Forge, and NeoForge mods in the same game. It currently supports only Minecraft 26.2.
ja=ECXP-Forbric+ を使います。PMCL チームが Forbric を基に強化したもので、同じゲームで Fabric、Forge、NeoForge のモッドを同時に読み込みます。現在対応しているのは Minecraft 26.2 だけです。

launch.loader_guide.quilt_scene
zh=Fabric 系的另一条路
en=Another Fabric-family path
ja=Fabric 系の別の道

launch.loader_guide.quilt_body
zh=使用 Quilt。和 Fabric 接近。有的模组只认其中一种，装之前看模组说明。
en=Use Quilt. It is close to Fabric. Some mods support only one of them, so check the mod page first.
ja=Quilt を使います。Fabric に近いですが、片方だけ対応するモッドがあります。導入前に説明を確認してください。

launch.loader_guide.vanilla_scene
zh=只玩原版
en=Vanilla only
ja=バニラだけ

launch.loader_guide.vanilla_body
zh=不安装加载器。不玩模组时选这个。
en=Don't install a loader. Choose this when you are not adding mods.
ja=ローダーは入れません。モッドを入れないときに選びます。

