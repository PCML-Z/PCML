zh=第十章 风险揭示\n\n第四十九条（账号风险）您理解：异常的登录地点、频繁的令牌刷新、短时间内多设备登录或与启动器相关的操作，可能触发第三方的风控机制，导致账号被临时限制、要求额外验证或被封禁。\n\n第五十条（政策风险）地区政策、监管要求、行业规范或游戏权利方政策可能随时变化，可能导致本功能被调整、限制、暂停或终止，且可能不会提前通知。\n\n第五十一条（技术风险）本功能依赖网络环境、账户服务、本地系统与运行时，可能因网络波动、系统更新、安全软件拦截、磁盘空间不足等原因失败或表现异常。\n\n第五十二条（数据风险）尽管我们采取加密存储与最小必要原则，仍无法完全排除本地数据被未授权访问、设备丢失或系统故障导致数据损坏的可能。\n\n第五十三条（不可预期风险）您理解并同意：上述列举并非穷尽。使用本功能还可能产生其他无法预先识别的风险，该等风险同样由您自行承担。\n\n第五十四条（风险自评）在点击同意之前，您应结合自身情况评估上述风险是否可接受；如不能接受，请勿使用本功能。
en=Chapter 10 Risk Disclosure\n\nArticle 49 (Account risk) Unusual sign-in locations, frequent token refreshes, simultaneous sign-ins on multiple devices or launcher-related activity may trigger a third party's risk controls, leading to temporary restriction, additional verification or suspension.\n\nArticle 50 (Policy risk) Regional policy, regulatory requirements, industry rules or rights-holder policies may change at any time, and the Feature may be adjusted, restricted, suspended or terminated, possibly without prior notice.\n\nArticle 51 (Technical risk) The Feature depends on networks, account services, your system and runtime, and may fail or misbehave due to network fluctuation, system updates, security software, or insufficient disk space.\n\nArticle 52 (Data risk) Despite encrypted storage and data minimisation, we cannot fully exclude unauthorised access to local data, device loss or corruption caused by system failure.\n\nArticle 53 (Unforeseeable risk) The list above is not exhaustive. Other risks not identifiable in advance may arise and are likewise borne by you.\n\nArticle 54 (Self-assessment) Before agreeing, assess whether these risks are acceptable to you; if not, do not use the Feature.
ja=第10章 リスクの開示\n\n第49条（アカウントリスク）異常な接続元、頻繁なトークン更新、複数端末での同時サインイン、ランチャー関連の操作は、第三者のリスク管理を誘発し、一時的な制限・追加認証・停止につながる可能性があります。\n\n第50条（政策リスク）地域政策、規制要件、業界ルール、権利者方針はいつでも変更される可能性があり、本機能は調整・制限・停止・終了されることがあり、事前通知がない場合もあります。\n\n第51条（技術リスク）ネットワーク、アカウントサービス、ご利用の OS・ランタイムに依存し、通信変動、OS 更新、セキュリティソフト、空き容量不足などで失敗・誤動作することがあります。\n\n第52条（データリスク）暗号化保存と最小化を行っても、ローカルデータへの不正アクセス、端末の紛失、システム障害による破損を完全に排除できません。\n\n第53条（予見不能なリスク）上記は網羅的ではありません。事前に特定できない他のリスクも発生し得て、同様にご自身の負担となります。\n\n第54条（自己評価）同意前に、これらのリスクを受け入れられるかご判断ください。受け入れられない場合は本機能をご利用にならないでください。

