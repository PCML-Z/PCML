native.hint
zh=这些不是 Java 版。当前系统有对应的 GitHub 发行包时直接下载；没有时显示「您的系统没有对应版本」，并使用设置里的编译运行时从源码编译。需要 Minecraft 资源的客户端只用本机已经安装的对应版本。
en=These are not the Java edition. PMCL downloads a GitHub release when one matches this system. Otherwise it shows that no build is available and compiles from source with the toolchain chosen in Settings. Clients that need Minecraft assets use the matching version already installed on this computer.
ja=これは Java 版ではありません。このシステム向けの GitHub リリースがあるときはそれをダウンロードします。無いときは「対応するバージョンがありません」と表示し、設定で選んだコンパイラでソースからビルドします。Minecraft の資源が必要なクライアントは、この端末に入っている対応バージョンだけを使います。

