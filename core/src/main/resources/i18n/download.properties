consent.disclaimer.body.01
zh=第一章 总则\n\n第一条（协议目的）本协议由您与 PMCL 项目贡献者（以下称「我们」）就您在中国大陆地区通过 PMCL 验证正版账户、进而使用 Minecraft 游戏本体下载功能（以下称「本功能」）所产生的权利义务、风险分配与责任限制作出约定。本协议不构成对任何第三方权利的处分，亦不构成任何形式的授权代理。\n\n第二条（定义）除上下文另有所指，本协议中：「PMCL」指在本机运行的开源启动器软件及其更新版本；「正版账户」指经微软账户体系登录并完成验证、且具备可识别游戏所有权状态的 Minecraft 账户；「验证」指 PMCL 在本机获取并校验账户登录状态与游戏所有权状态的过程；「下载内容」指经由游戏权利方或其授权渠道提供的游戏文件、库文件与资源文件；「损失」包括直接损失、间接损失、附带损失、利润损失、数据丢失以及第三方索赔所生的费用。
en=Chapter 1 General Provisions\n\nArticle 1 (Purpose) This Agreement sets out the rights, obligations, risk allocation and liability limits between you and the PMCL contributors ("we") arising from verifying a premium account through PMCL in mainland China and using the Minecraft game download feature (the "Feature"). It transfers no third-party rights and creates no agency.\n\nArticle 2 (Definitions) "PMCL" means the open-source launcher running locally on your device. "Premium account" means a Minecraft account signed in through Microsoft with a recognizable ownership status. "Verification" means obtaining and checking the sign-in state and ownership status on your device. "Downloaded content" means game, library and asset files provided by the rights holder or its authorized channels. "Loss" includes direct, indirect and incidental loss, lost profits, data loss and costs of third-party claims.
ja=第1章 総則\n\n第1条（目的）本契約は、中国本土において PMCL を通じて正規アカウントを認証し、Minecraft ゲーム本体のダウンロード機能（以下「本機能」）を利用することに伴う権利義務、リスク配分および責任の制限を定めます。本契約は第三者の権利を処分するものではなく、代理関係も生じさせません。\n\n第2条（定義）「PMCL」とは端末上でローカルに動作するオープンソースのランチャーを指します。「正規アカウント」とは Microsoft アカウントでサインインし、所有権状態が確認できる Minecraft アカウントを指します。「認証」とは端末上でサインイン状態と所有権状態を取得・確認することを指します。「ダウンロード内容」とは権利者またはその正規チャネルが提供するゲーム・ライブラリ・アセットのファイルを指します。「損失」には直接・間接・付随的損害、利益の喪失、データの喪失、第三者からの請求への対応費用を含みます。

consent.disclaimer.body.02
zh=第三条（适用范围）本协议仅适用于本功能。您使用 PMCL 的其他功能，仍适用 PMCL 相应的用户协议、隐私说明与开源许可证；本协议不改变、也不替代该等文件的效力。\n\n第四条（与其他文件的关系）本协议与《自愿授权协议》共同构成您使用本功能的完整约定。两份协议内容冲突时：就授权范围、数据处理与撤回方式，以《自愿授权协议》为准；就风险揭示、免责与责任限制，以本协议为准。\n\n第五条（语言与解释）本协议以简体中文版本为准，其他语言译本仅为便于理解，与中文版本不一致的以中文版本为准。本协议中的「包括」均指「包括但不限于」；章节标题仅为便于阅读，不影响条款解释。
en=Article 3 (Scope) This Agreement applies only to the Feature. Other PMCL features remain governed by PMCL's own terms, privacy notes and open-source licenses.\n\nArticle 4 (Relationship with other documents) This Agreement and the Voluntary Authorization Agreement together form the complete terms for the Feature. Where they conflict, authorization and data processing follow the Authorization Agreement; risk, disclaimer and liability follow this Agreement.\n\nArticle 5 (Language and interpretation) The Simplified Chinese version prevails; other translations are for convenience only. "Including" means "including without limitation", and headings do not affect interpretation.
ja=第3条（適用範囲）本契約は本機能にのみ適用されます。PMCL の他の機能には、それぞれの利用規約・プライバシー説明・オープンソースライセンスが適用されます。\n\n第4条（他の文書との関係）本契約と「任意認証契約」が本機能に関する完全な合意を構成します。矛盾する場合は、認証とデータ処理については認証契約、リスク・免責・責任については本契約が優先します。\n\n第5条（言語と解釈）簡体字中国語版を正文とし、他の言語の翻訳は参考です。「含む」は「含むがこれに限らない」を意味し、見出しは解釈に影響しません。

consent.disclaimer.body.03
zh=第二章 协议的接受、变更与生效\n\n第六条（接受方式）您须在与本协议对应的页面完整滚动至末尾，勾选确认框并点击「同意并继续」，方视为您已完整阅读、理解并自愿接受本协议全部条款。未完成上述步骤的，本功能不予开放。\n\n第七条（不接受的处理）您不同意本协议任何内容的，请不要勾选确认框，也不要点击继续；您可以直接关闭弹窗，继续使用 PMCL 的其他功能，或改用游戏权利方提供的官方渠道。\n\n第八条（变更）我们可能因法律法规、监管要求、游戏权利方政策或功能调整而修订本协议。修订后的协议将在您下次使用本功能前重新征求您的同意；您不同意修订内容的，可以停止使用本功能，已完成的下载与安装不受影响。\n\n第九条（生效与溯及）本协议自您确认之时生效，并适用于您此后对本功能的每一次使用。您在此前版本下完成的下载，仍受当时版本协议的约束。\n\n第十条（可分割性）本协议任何条款被认定无效、非法或不可执行的，不影响其余条款的效力；双方应以最接近原条款商业目的与法律效果的有效条款替代之。
en=Chapter 2 Acceptance, Changes and Effectiveness\n\nArticle 6 (Acceptance) You must scroll to the end, tick the confirmation box and click "Agree and continue". Without these steps the Feature is not made available.\n\nArticle 7 (Refusal) If you disagree with any part, do not tick or continue. You may close the dialog and keep using other PMCL features or the rights holder's official channels.\n\nArticle 8 (Changes) We may revise this Agreement for legal, regulatory, rights-holder or functional reasons. Revised terms require your consent before your next use; already completed downloads and installations are unaffected.\n\nArticle 9 (Effectiveness) This Agreement takes effect when you confirm and applies to each later use. Earlier downloads remain governed by the version then in force.\n\nArticle 10 (Severability) If any provision is held invalid, the remaining provisions stay in force and shall be replaced by a valid provision closest to the original intent.
ja=第2章 契約の承諾・変更・発効\n\n第6条（承諾）本文を最後までスクロールし、確認欄にチェックして「同意して続行」を押す必要があります。未完了の場合、本機能は利用できません。\n\n第7条（拒否）内容に同意できない場合はチェックせず、ダイアログを閉じて他の機能または権利者の公式窓口をご利用ください。\n\n第8条（変更）法令・規制・権利者方針・機能変更に応じて本契約を改定することがあります。改定後は次回利用前に再同意を求めます。既に完了したダウンロードとインストールには影響しません。\n\n第9条（発効）同意時点で発効し、以後の各利用に適用されます。以前のダウンロードは当時の版に従います。\n\n第10条（可分性）いずれかの条項が無効とされた場合も他の条項は有効に存続し、最も近い趣旨の有効な条項で置き換えます。

consent.disclaimer.body.04
zh=第三章 服务说明\n\n第十一条（PMCL 的性质）PMCL 是在您设备上本地运行的开源启动器。我们不运营游戏服务器，不提供游戏账号，不托管、不分发、不镜像游戏文件，亦不参与游戏内容的制作、审核、定价与销售。\n\n第十二条（本功能的性质）本功能仅用于在您完成正版账户验证后，向您展示并获取游戏权利方公开提供的游戏文件。本功能不改变游戏文件的来源，不绕过任何付费、授权或验证环节，也不提供任何形式的破解、绕过或替代授权。\n\n第十三条（不构成代理或经销）我们与游戏权利方之间不存在代理、经销、授权、合伙、合资或关联关系。我们不以任何名义代表游戏权利方作出承诺，也无权代表其处理账号、退款、授权或投诉事宜。\n\n第十四条（非官方声明）PMCL 不是 Mojang Studios 或 Microsoft 的官方产品，未获得其背书、认证、赞助或推荐。Minecraft 及相关名称、商标、图像与其他标识归其各自权利人所有。\n\n第十五条（免费提供）本功能不向您收取任何费用。我们不因本功能向您主张任何形式的对价，亦不因此取得对您账号、设备或数据的任何所有权。
en=Chapter 3 Description of the Service\n\nArticle 11 (Nature of PMCL) PMCL is an open-source launcher running locally on your device. We do not operate game servers, provide accounts, host, distribute or mirror game files, or take part in producing, reviewing, pricing or selling game content.\n\nArticle 12 (Nature of the Feature) The Feature only displays and retrieves game files publicly provided by the rights holder after you verify a premium account. It does not change the source of those files, bypass any payment, licensing or verification step, or offer any cracking or authorization bypass.\n\nArticle 13 (No agency or distribution) There is no agency, distribution, licensing, partnership or affiliation between us and the rights holder. We make no commitments on their behalf and cannot handle accounts, refunds, licensing or complaints for them.\n\nArticle 14 (Not official) PMCL is not an official Mojang Studios or Microsoft product and is not endorsed, certified, sponsored or recommended by them. Minecraft and related marks belong to their respective owners.\n\nArticle 15 (Free of charge) The Feature is free. We charge no fee and acquire no ownership of your account, device or data.
ja=第3章 サービスの説明\n\n第11条（PMCL の性質）PMCL は端末上でローカルに動作するオープンソースのランチャーです。ゲームサーバーの運営、アカウントの提供、ゲームファイルの保管・配布・ミラー、ゲーム内容の制作・審査・価格設定・販売は行いません。\n\n第12条（本機能の性質）本機能は、正規アカウントの認証後に権利者が公開するゲームファイルを表示・取得するだけのものです。ファイルの出所を変えず、支払い・許諾・認証の回避も行わず、クラックや認証回避の手段を提供しません。\n\n第13条（代理・販売なし）権利者との間に代理・販売・許諾・提携・資本関係はありません。権利者を代表して約束せず、アカウント・返金・許諾・苦情の処理も行いません。\n\n第14条（非公式）PMCL は Mojang Studios または Microsoft の公式製品ではなく、推奨・認証・後援を受けていません。Minecraft および関連する名称・商標は各権利者に帰属します。\n\n第15条（無償）本機能は無償です。対価を請求せず、アカウント・端末・データの所有権も取得しません。

consent.disclaimer.body.05
zh=第四章 正版验证\n\n第十六条（验证方式）您需在 PMCL 内通过微软账户完成登录。PMCL 将在本机获取并保存登录令牌，读取该账户的 Minecraft 所有权状态，以判断是否向您开放本功能。验证过程不涉及您的密码，我们无法也不应获知您的账号密码。\n\n第十七条（验证结果的效力）验证通过仅表示在验证时点，该账户具备可识别的游戏所有权状态。我们不因此对您的账号权属、账号安全、游戏使用权或其在任何服务器的联机资格作出任何担保或确认。\n\n第十八条（验证失败）因网络波动、账户状态异常、第三方服务故障、令牌失效等原因导致验证失败的，本功能将不予开放。您可以稍后重试、重新登录，或改用游戏权利方提供的官方渠道。\n\n第十九条（地区政策的优先性）本功能系在地区限制基础上，为正版账户持有人提供的有限例外。若您所在地区的法律法规、监管要求或游戏权利方政策发生变化，我们有权随时调整、限制或停止本功能，且不因此承担违约责任。\n\n第二十条（验证不等于授权）验证通过仅用于判断本功能是否开放，不构成对您下载、复制或使用游戏文件的额外授权；您对游戏文件的使用仍受游戏权利方使用条款的约束。
en=Chapter 4 Premium Verification\n\nArticle 16 (How verification works) You sign in with a Microsoft account inside PMCL. PMCL obtains and stores a sign-in token on your device and reads the account's Minecraft ownership status to decide whether to enable the Feature. The process never involves your password.\n\nArticle 17 (Effect of verification) Passing verification only means that, at that moment, the account shows a recognizable ownership status. We make no warranty about account ownership, account security, game usage rights or eligibility on any server.\n\nArticle 18 (Failure) If verification fails due to network issues, abnormal account status, third-party outages or expired tokens, the Feature stays unavailable. You may retry, sign in again, or use the rights holder's official channels.\n\nArticle 19 (Regional policy prevails) The Feature is a limited exception for premium holders on top of regional restrictions. If laws, regulations or rights-holder policies change, we may adjust, restrict or stop the Feature without liability.\n\nArticle 20 (Verification is not a license) Passing verification does not grant any additional right to download, copy or use game files; your use remains subject to the rights holder's terms.
ja=第4章 正規認証\n\n第16条（認証方法）PMCL 内で Microsoft アカウントにサインインします。PMCL は端末上でトークンを取得・保存し、当該アカウントの所有権状態を読み取って本機能の可否を判断します。パスワードは扱いません。\n\n第17条（認証の効果）認証の通過は、その時点で所有権状態が確認できたことのみを意味します。アカウントの帰属、安全性、利用権、各サーバーでの参加資格を保証するものではありません。\n\n第18条（失敗時）ネットワーク・アカウント状態・第三者サービス・トークン失効などにより失敗した場合、本機能は利用できません。再試行、再サインイン、または公式窓口をご利用ください。\n\n第19条（地域政策の優先）本機能は地域制限に対する正規所有者向けの限定的な例外です。法令・規制・権利者方針が変わった場合、本機能を調整・制限・停止でき、責任を負いません。\n\n第20条（認証は許諾ではない）認証の通過は、ゲームファイルのダウンロード・複製・利用に関する追加の許諾を与えるものではなく、権利者の利用条件に従います。

consent.disclaimer.body.06
zh=第五章 用户资格与账号\n\n第二十一条（资格）您应具备与您所在地区法律规定相适应的民事行为能力。未成年人应在监护人知情并同意的情况下使用本功能，监护人对其使用行为承担相应责任。\n\n第二十二条（账号归属）您确认用于验证的账户为本人合法所有。您不得使用他人账户，不得以任何方式出租、出借、出售、赠与、共享验证结果，亦不得代他人完成验证。\n\n第二十三条（账号安全义务）您应自行保管账号凭据，妥善保护设备、本地数据与登录状态。因您保管不当、设备被他人使用、凭据泄露或未及时退出登录造成的损失，由您自行承担。\n\n第二十四条（异常验证）我们有权在发现异常验证行为时暂停向该设备开放本功能，异常行为包括但不限于：短时间批量验证、频繁切换账号、使用自动化工具、来源地异常、规避技术措施。\n\n第二十五条（账号争议）因账号权属、账号被盗、账号交易或共享产生的争议，由您与相关方自行解决。我们不介入该等争议，也不承担任何由此产生的责任。\n\n第二十六条（账号状态变化）您的账户在验证后被限制、封禁、注销或所有权状态发生变化的，本功能可能随之不可用，我们对此不承担责任。
en=Chapter 5 Eligibility and Accounts\n\nArticle 21 (Eligibility) You must have the legal capacity required in your region. Minors should use the Feature with a guardian's knowledge and consent, and the guardian bears responsibility for that use.\n\nArticle 22 (Account ownership) You confirm the account used for verification is lawfully yours. You may not use another person's account, rent, lend, sell, gift or share the verification result, or verify on behalf of others.\n\nArticle 23 (Account security) You are responsible for safeguarding credentials, your device, local data and sign-in state. Losses caused by poor custody, shared devices, leaked credentials or failure to sign out are yours.\n\nArticle 24 (Abnormal verification) We may suspend the Feature on a device upon detecting abnormal verification, including bulk verification, rapid account switching, automation, unusual origin or circumvention of technical measures.\n\nArticle 25 (Account disputes) Disputes over ownership, theft or trading of accounts are for you and the other parties to resolve. We do not intervene and accept no liability.\n\nArticle 26 (Status changes) If the account is restricted, suspended, closed or its ownership status changes after verification, the Feature may become unavailable without liability on our part.
ja=第5章 利用資格とアカウント\n\n第21条（資格）地域の法令に応じた行為能力を有する必要があります。未成年者は保護者の同意のもとで利用し、保護者が責任を負います。\n\n第22条（帰属）認証に用いるアカウントがご自身に帰属することを確認します。他人のアカウントの使用、認証結果の貸与・販売・譲渡・共有、代理認証はできません。\n\n第23条（安全義務）資格情報、端末、ローカルデータ、サインイン状態を自ら管理してください。管理不備、端末の共用、情報漏えい、サインアウト忘れによる損失はご自身の負担です。\n\n第24条（異常な認証）大量認証、頻繁なアカウント切替、自動化、異常な接続元、技術的措置の回避などを検知した場合、当該端末での提供を停止できます。\n\n第25条（アカウント紛争）帰属・盗難・売買に関する紛争は当事者間で解決するものとし、当方は関与せず責任を負いません。\n\n第26条（状態変更）認証後にアカウントが制限・停止・削除された場合や所有権状態が変わった場合、本機能は利用できなくなることがあり、当方は責任を負いません。

consent.disclaimer.body.07
zh=第六章 用户行为规范\n\n第二十七条（禁止规避）您不得通过修改客户端、注入代码、伪造请求、篡改本地数据、劫持网络请求或使用第三方补丁等方式，规避地区限制、验证流程或本协议设定的确认步骤。\n\n第二十八条（禁止自动化）您不得使用脚本、机器人、批量工具或任何自动化手段调用本功能，不得将本功能用于代验证、代下载或其他面向他人的服务，不得以任何方式使本功能成为规避授权的通道。\n\n第二十九条（禁止商业利用）您不得将本功能、验证结果或经本功能获取的内容用于出租、出售、转售、引流、推广、付费代下载或其他商业目的，也不得据此向他人收取任何费用。\n\n第三十条（禁止再分发修改版）您不得制作、传播、发布或协助制作以规避本协议为目的的修改版本，不得移除、隐藏、绕过或改写本协议及相应的确认流程与提示文案。\n\n第三十一条（禁止滥用反馈渠道）您不得以虚假信息、伪造材料或重复提交的方式，滥用我们的问题反馈、申诉或支持渠道。\n\n第三十二条（违约后果）您违反本章任何约定的，我们有权立即停止向您开放本功能、清除相关本地标记，并保留依据适用法律追究相应责任的权利。
en=Chapter 6 User Conduct\n\nArticle 27 (No circumvention) You may not modify the client, inject code, forge requests, tamper with local data, hijack network traffic or use third-party patches to evade regional restrictions, verification or the confirmation steps in this Agreement.\n\nArticle 28 (No automation) You may not call the Feature with scripts, bots or bulk tools, use it for verification or download services on behalf of others, or turn it into a channel for bypassing authorization.\n\nArticle 29 (No commercial use) You may not rent, sell, resell, advertise, promote, charge for or otherwise commercially exploit the Feature, its verification result or content obtained through it.\n\nArticle 30 (No modified redistribution) You may not create, distribute, publish or help create modified versions aimed at evading this Agreement, nor remove, hide, bypass or rewrite this Agreement and its confirmation flow.\n\nArticle 31 (No abuse of feedback) You may not abuse our issue, appeal or support channels with false information, forged materials or repeated submissions.\n\nArticle 32 (Consequences) If you breach this Chapter, we may immediately stop offering the Feature, clear related local markers, and pursue remedies available under applicable law.
ja=第6章 利用者の行為規範\n\n第27条（回避の禁止）クライアントの改変、コード注入、リクエスト偽造、ローカルデータ改ざん、通信の乗っ取り、第三者パッチなどにより、地域制限・認証・本契約の確認手順を回避してはなりません。\n\n第28条（自動化の禁止）スクリプト・ボット・一括ツールによる呼び出し、他人のための代理認証・代理ダウンロード、認証回避の経路としての利用を禁止します。\n\n第29条（商業利用の禁止）本機能、認証結果、本機能で取得した内容の貸与・販売・転売・宣伝・勧誘・有料提供など、あらゆる商業的利用を禁止します。\n\n第30条（改変版の配布禁止）本契約の回避を目的とする改変版の作成・配布・公開・支援、および本契約や確認手順の削除・隠蔽・回避・書き換えを禁止します。\n\n第31条（フィードバックの濫用禁止）虚偽情報、偽造資料、重複投稿により、問題報告・異議申立て・サポート窓口を濫用してはなりません。\n\n第32条（違反の結果）本章に違反した場合、本機能の提供を直ちに停止し、関連するローカル記録を削除し、適用法に基づく措置を取ることがあります。

consent.disclaimer.body.08
zh=第七章 下载内容\n\n第三十三条（内容来源）下载内容由游戏权利方或其授权渠道提供。PMCL 仅发起请求并保存文件，不修改文件内容，不改变文件来源，也不对下载地址的合法性作出超出其公开状态的判断。\n\n第三十四条（不保证完整与可用）我们不保证下载内容始终完整、可用、无错误、无中断或与您的设备、系统、Java 运行时完全兼容。下载中断、文件损坏、版本不匹配、校验失败等问题，您可通过重试、校验或重新安装处理。\n\n第三十五条（地区合法性自查）您应自行确认，在您所在地区获取并使用该下载内容是否符合当地法律法规、监管要求以及游戏权利方的使用条款。您不得以本功能的存在为由，主张该等获取行为当然合法。\n\n第三十六条（使用范围）下载内容仅供您个人在游戏权利方授权范围内使用。您不得复制、传播、公开传播、公开表演、反向工程、拆解、修改或将其用于任何商业用途。\n\n第三十七条（第三方责任）与下载内容相关的质量问题、授权争议、权利主张或侵权指控，由内容提供方承担；我们不承担连带责任，也不代为处理该等争议。\n\n第三十八条（下载记录）为判断本功能的使用资格，PMCL 会在本地记录哪些游戏版本系经本功能下载。该记录仅保存在您的设备上，用于启动时的账户校验。
en=Chapter 7 Downloaded Content\n\nArticle 33 (Source) Downloaded content is provided by the rights holder or its authorized channels. PMCL only sends requests and saves files; it does not alter content, change its source, or judge the legality of a URL beyond its public state.\n\nArticle 34 (No guarantee of integrity) We do not guarantee downloaded content is complete, usable, error-free, uninterrupted or compatible with your device, system or Java runtime. Retry, verify or reinstall to address interruptions, corruption, mismatches or checksum failures.\n\nArticle 35 (Check local legality) You must confirm that obtaining and using the content in your region complies with local law, regulatory requirements and the rights holder's terms. The existence of the Feature does not make such obtaining lawful.\n\nArticle 36 (Scope of use) Downloaded content is for your personal use within the rights holder's license. You may not copy, distribute, publicly communicate, publicly perform, reverse engineer, disassemble, modify or commercially exploit it.\n\nArticle 37 (Third-party responsibility) Quality issues, licensing disputes, rights claims or infringement allegations concerning downloaded content are the content provider's responsibility; we bear no joint liability and do not handle such disputes.\n\nArticle 38 (Local record) To determine eligibility, PMCL records locally which game versions were downloaded through the Feature. The record stays on your device and is used for account checks at launch.
ja=第7章 ダウンロード内容\n\n第33条（出所）ダウンロード内容は権利者またはその正規チャネルが提供します。PMCL は要求を送信しファイルを保存するのみで、内容の改変、出所の変更、URL の適法性の独自判断は行いません。\n\n第34条（完全性の不保証）完全性、可用性、無誤性、中断のなさ、端末・OS・Java との互換性を保証しません。中断・破損・不一致・検証失敗は再試行・検証・再インストールでご対応ください。\n\n第35条（地域の適法性の確認）お住まいの地域で当該内容を取得・利用することが法令・規制・権利者の条件に適合することをご自身で確認してください。本機能の存在は適法性を保証しません。\n\n第36条（利用範囲）権利者が許諾する範囲で個人的に利用できます。複製・配布・公衆送信・公開上演・リバースエンジニアリング・分解・改変・商業利用はできません。\n\n第37条（第三者の責任）内容の品質・許諾・権利主張・侵害申立ては提供者が負担し、当方は連帯責任を負わず、当該紛争も処理しません。\n\n第38条（ローカル記録）利用資格の判断のため、本機能でダウンロードしたバージョンを端末上に記録します。この記録は端末内にのみ保存され、起動時の確認に使用されます。

