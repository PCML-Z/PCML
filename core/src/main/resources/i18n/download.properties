zh=第十一章 免责\n\n第五十五条（现状提供）本功能按「现状」与「现有」基础提供。在法律允许的最大范围内，我们不作任何明示或默示的保证，包括但不限于适销性、特定用途适用性、不侵权、无错误、不中断以及与其他软件或服务的兼容性。\n\n第五十六条（可用性）我们不保证本功能在任何时间、任何网络环境、任何设备配置下均可访问，也不保证验证在本协议有效期内始终成功，更不保证下载内容在任何时点均可获取。\n\n第五十七条（用户原因）因您违反本协议、保管不当、设备故障、系统异常、网络环境限制、第三方软件干扰或第三方行为导致的任何损失，我们不予承担。\n\n第五十八条（决策自担）您基于本功能提供的信息所作出的任何决定，包括是否下载、是否更换账号、是否继续使用某一版本，均由您自行判断并承担后果。\n\n第五十九条（内容判断）我们不对下载内容的真实性、完整性、安全性或适用性作出判断，也不对您因使用该等内容产生的任何后果负责。
en=Chapter 11 Disclaimer\n\nArticle 55 (As-is) The Feature is provided "as is" and "as available". To the maximum extent permitted by law we make no express or implied warranty, including merchantability, fitness for a particular purpose, non-infringement, freedom from errors, uninterrupted operation, or compatibility with other software or services.\n\nArticle 56 (Availability) We do not warrant that the Feature is reachable at any time, network or configuration, that verification will always succeed while this Agreement is in force, or that content will be retrievable at any moment.\n\nArticle 57 (User-caused loss) We accept no liability for loss caused by your breach, poor custody, device failure, system anomalies, network restrictions, interference by third-party software or third-party conduct.\n\nArticle 58 (Your decisions) Any decision you make based on the Feature, including whether to download, switch accounts or keep using a version, is yours to judge and bear.\n\nArticle 59 (Content judgement) We make no judgement about the authenticity, integrity, safety or suitability of downloaded content and are not responsible for consequences of using it.
ja=第11章 免責\n\n第55条（現状提供）本機能は「現状のまま」「提供可能な範囲で」提供されます。法律で許される最大限の範囲で、商品性、特定目的への適合性、非侵害性、無誤性、中断のなさ、他のソフトとの互換性について、明示・黙示を問わず保証しません。\n\n第56条（可用性）いかなる時点・ネットワーク・構成でも利用可能であること、本契約の有効期間中に認証が常に成功すること、内容がいつでも取得可能であることは保証しません。\n\n第57条（利用者起因）本契約違反、管理不備、端末故障、システム異常、ネットワーク制限、第三者ソフトの干渉、第三者の行為による損失について、当方は責任を負いません。\n\n第58条（判断の自己責任）ダウンロードするか、アカウントを切り替えるか、あるバージョンを使い続けるかなど、本機能に基づく判断はご自身の責任です。\n\n第59条（内容の判断）ダウンロード内容の真実性・完全性・安全性・適合性を判断せず、その利用による結果について責任を負いません。

consent.disclaimer.body.13
zh=第十二章 责任限制\n\n第六十条（间接损失排除）在法律允许的最大范围内，我们不对任何间接损失、附带损失、特殊损失、惩罚性损失、利润损失、商誉损失、机会损失或数据丢失承担责任，即使我们已被告知该等损失的可能性。\n\n第六十一条（责任上限）就本协议项下产生的全部索赔，我们的累计责任总额不超过您为本功能实际支付的费用。鉴于本功能免费提供，该上限为零。\n\n第六十二条（法定例外）本章不排除或限制依法不能排除或限制的责任。在该等情形下，我们的责任以适用法律允许的最低限度为限，且仅在该等责任系因我们的故意或重大过失所致时方予承担。\n\n第六十三条（条款独立性）本章条款独立于本协议其他条款生效。即使本协议其他条款被认定无效、不可执行或被撤销，本章仍然有效并对双方具有约束力。\n\n第六十四条（风险分配的基础）您理解并同意：本章的责任分配是本功能得以免费提供的基础；若缺少该等限制，我们不会向您开放本功能。
en=Chapter 12 Limitation of Liability\n\nArticle 60 (Excluded losses) To the maximum extent permitted by law we are not liable for indirect, incidental, special or punitive loss, lost profits, loss of goodwill, lost opportunities or data loss, even if advised of that possibility.\n\nArticle 61 (Cap) Our aggregate liability for all claims under this Agreement shall not exceed the amount you actually paid for the Feature. As the Feature is free, that cap is zero.\n\nArticle 62 (Statutory exceptions) This Chapter does not exclude liability that cannot lawfully be excluded. In such cases our liability is limited to the minimum permitted by law and applies only where caused by our intent or gross negligence.\n\nArticle 63 (Independence) This Chapter survives independently of the other provisions. It remains binding even if other provisions are held invalid, unenforceable or revoked.\n\nArticle 64 (Basis of allocation) You understand and agree that this allocation of risk is the basis on which the Feature can be offered free of charge; without it, we would not make the Feature available.
ja=第12章 責任の制限\n\n第60条（間接損害の除外）法律で許される最大限の範囲で、間接損害・付随的損害・特別損害・懲罰的損害・利益の喪失・信用の毀損・機会の喪失・データの喪失について責任を負いません。その可能性を通知されていた場合も同様です。\n\n第61条（責任の上限）本契約に基づくすべての請求に対する当方の累計責任は、本機能に対して実際に支払われた金額を超えないものとします。本機能は無償のため、上限はゼロです。\n\n第62条（法定の例外）本条は法律上排除できない責任を排除しません。その場合の責任は法律が許す最小限にとどまり、当方の故意または重大な過失による場合に限ります。\n\n第63条（条項の独立性）本章は他の条項から独立して効力を有し、他の条項が無効・執行不能・取消となっても有効です。\n\n第64条（リスク配分の基礎）この責任配分が本機能を無償で提供できる前提であることに同意します。これがなければ本機能は提供されません。

consent.disclaimer.body.14
zh=第十三章 赔偿\n\n第六十五条（您的赔偿义务）因您违反本协议、侵害第三方权利、滥用本功能或以其他方式导致我们或第三方遭受索赔、处罚、诉讼或损失的，您应予以赔偿，并使我们免受损害。\n\n第六十六条（赔偿范围）赔偿范围包括合理的律师费、诉讼费、仲裁费、公证费、差旅费、和解金额以及为应对主张所支出的其他合理费用。\n\n第六十七条（协助义务）我们因前述主张被诉或受到调查时，有权自行选择抗辩方式与和解方案；您应在合理范围内提供必要的协助、资料与说明。\n\n第六十八条（抗辩保留）我们保留对您另行追偿的权利，且未行使该权利不构成对任何主张的放弃。
en=Chapter 13 Indemnity\n\nArticle 65 (Your indemnity) If your breach of this Agreement, infringement of third-party rights, misuse of the Feature or other conduct exposes us or a third party to claims, penalties, litigation or loss, you shall indemnify us and hold us harmless.\n\nArticle 66 (Scope) Indemnity covers reasonable lawyers' fees, litigation and arbitration fees, notarisation, travel, settlement amounts and other reasonable costs of responding to claims.\n\nArticle 67 (Assistance) If we are sued or investigated as a result, we may choose our defence and settlement strategy, and you shall provide reasonable assistance, materials and explanations.\n\nArticle 68 (Reservation) We reserve the right to seek recovery from you separately; not exercising it does not waive any claim.
ja=第13章 補償\n\n第65条（利用者の補償義務）本契約違反、第三者の権利侵害、本機能の濫用などにより、当方または第三者が請求・処分・訴訟・損失を受けた場合、これを補償し、当方を免責的に扱うものとします。\n\n第66条（補償範囲）合理的な弁護士費用、訴訟・仲裁費用、公证費用、旅費、和解金、その他対応に要した合理的費用を含みます。\n\n第67条（協力義務）当方が訴えられ、または調査を受けた場合、当方は防御・和解の方針を自ら選択でき、利用者は合理的な範囲で協力・資料・説明を提供するものとします。\n\n第68条（権利の留保）別途求償する権利を留保し、行使しないことは請求権の放棄ではありません。

consent.disclaimer.body.15
zh=第十四章 不可抗力与情势变更\n\n第六十九条（不可抗力）因自然灾害、公共卫生事件、战争、武装冲突、罢工、骚乱、电力中断、通信中断、网络攻击、政府行为或其他超出我们合理控制的事件，导致本功能无法履行或履行延迟的，我们不承担违约责任。\n\n第七十条（情势变更）因法律法规、监管政策、司法裁判或行业规则发生重大变化，致使本功能继续提供将产生合规风险或重大成本的，我们有权中止、调整或终止本功能。\n\n第七十一条（后果处理）上述情形发生后，我们将以合理方式告知您，并在可行范围内减少对您的影响。已经完成的下载与安装不受影响，您仍可依游戏权利方的条款使用已安装内容。\n\n第七十二条（通知义务的例外）在不可抗力持续期间，我们履行通知义务的期限相应顺延。
en=Chapter 14 Force Majeure and Changed Circumstances\n\nArticle 69 (Force majeure) We are not liable for failure or delay caused by natural disasters, public health events, war, armed conflict, strikes, riots, power or communication outages, network attacks, government action or other events beyond our reasonable control.\n\nArticle 70 (Changed circumstances) If material changes in laws, regulations, regulatory policy, judicial decisions or industry rules would create compliance risk or significant cost, we may suspend, adjust or terminate the Feature.\n\nArticle 71 (Consequences) After such events we will inform you in a reasonable manner and reduce the impact where feasible. Completed downloads and installations are unaffected and remain usable under the rights holder's terms.\n\nArticle 72 (Notice extension) During force majeure, deadlines for our notice obligations are extended accordingly.
ja=第14章 不可抗力と事情変更\n\n第69条（不可抗力）自然災害、公衆衛生事象、戦争、武力衝突、ストライキ、騒乱、停電、通信障害、サイバー攻撃、政府の行為その他合理的に制御できない事由により履行できない場合、債務不履行責任を負いません。\n\n第70条（事情変更）法令・規制・司法判断・業界ルールの重大な変更により、本機能の継続提供がコンプライアンス上のリスクや重大なコストを生じる場合、中止・調整・終了できます。\n\n第71条（結果の処理）その場合、合理的な方法でお知らせし、可能な範囲で影響を軽減します。完了したダウンロードとインストールには影響せず、権利者の条件の下で利用できます。\n\n第72条（通知期限の延長）不可抗力の期間中、通知義務の期限は相应的に延長されます。

consent.disclaimer.body.16
zh=第十五章 协议的终止\n\n第七十三条（您的终止）您可随时停止使用本功能并退出账号登录，本协议自您停止使用时终止。终止不影响您继续使用 PMCL 的其他功能。\n\n第七十四条（我们的中止或终止）出现下列情形之一的，我们有权中止或终止向您提供本功能：您违反本协议的；本功能因合规原因被要求停止的；我们发现异常验证或滥用行为的；继续提供将导致我们或第三方承担法律风险的。\n\n第七十五条（终止后的效力）本协议终止后，关于知识产权、免责、责任限制、赔偿、争议解决与语言版本的条款继续有效。\n\n第七十六条（记录的清除）本协议终止后，您可随时退出账号以清除本地保存的登录令牌；已记录的正版下载版本标记可能保留至您删除相应版本或清除本地数据为止。
en=Chapter 15 Termination\n\nArticle 73 (By you) You may stop using the Feature and sign out at any time; this Agreement terminates when you stop using it, without affecting other PMCL features.\n\nArticle 74 (By us) We may suspend or terminate the Feature if: you breach this Agreement; compliance requirements require it to stop; we detect abnormal verification or abuse; or continuing would expose us or a third party to legal risk.\n\nArticle 75 (Survival) After termination, the provisions on intellectual property, disclaimer, limitation of liability, indemnity, dispute resolution and language continue in force.\n\nArticle 76 (Clearing records) After termination you may sign out at any time to clear the stored token; premium-download markers may remain until you delete the version or clear local data.
ja=第15章 契約の終了\n\n第73条（利用者による終了）いつでも利用を中止しサインアウトできます。中止した時点で本契約は終了し、PMCL の他の機能には影響しません。\n\n第74条（当方による中止・終了）次の場合、提供を中止または終了できます：本契約違反、コンプライアンス上の停止要請、異常な認証や濫用の検知、継続により当方や第三者に法的リスクが生じる場合。\n\n第75条（終了後の効力）終了後も、知的財産、免責、責任の制限、補償、紛争解決、言語に関する条項は有効に存続します。\n\n第76条（記録の削除）終了後、いつでもサインアウトしてトークンを削除できます。正規ダウンロードのマーカーは、当該バージョンの削除またはローカルデータの消去まで残る場合があります。

consent.disclaimer.body.17
zh=第十六章 其他约定\n\n第七十七条（通知）我们可通过启动器内公告、项目页面、代码仓库或版本更新说明向您发出通知。该等通知自发布之日起视为送达，您应定期查阅。\n\n第七十八条（完整协议）本协议与《自愿授权协议》构成您与本功能相关的完整约定，取代此前的一切口头或书面说明、承诺与宣传。\n\n第七十九条（转让限制）未经我们书面同意，您不得转让本协议项下的任何权利或义务。我们可将本协议项下的权利义务整体转让给承接本项目的实体，转让后以合理方式通知您。\n\n第八十条（弃权）我们未行使或延迟行使本协议项下的任何权利，不构成对该项权利的放弃；单次或部分行使亦不排除此后继续行使。\n\n第八十一条（条款独立）本协议各条款相互独立。任何条款被认定无效或不可执行的，其余条款不因此失效，双方应以最接近原意且合法有效的条款替代之。\n\n第八十二条（标题与用语）各章标题仅为便于阅读，不影响条款解释。本协议中的「包括」指「包括但不限于」，「日」指自然日。\n\n第八十三条（适用法律）本协议的订立、效力、解释、履行与争议解决，均适用中华人民共和国大陆地区法律，不考虑其冲突规范。\n\n第八十四条（争议解决）因本协议产生的争议，双方应首先友好协商解决；协商不成的，任一方可提交我们主要运营地有管辖权的人民法院处理。\n\n第八十五条（存续条款）本协议终止后，依其性质应当继续有效的条款继续有效，包括但不限于知识产权、免责、责任限制、赔偿与争议解决条款。
en=Chapter 16 Miscellaneous\n\nArticle 77 (Notices) We may notify you through in-app announcements, the project page, the code repository or release notes. Notices are deemed delivered on publication; please review them periodically.\n\nArticle 78 (Entire agreement) This Agreement and the Voluntary Authorization Agreement form the entire agreement for the Feature and supersede prior oral or written statements, promises and marketing.\n\nArticle 79 (Assignment) You may not assign your rights or obligations without our written consent. We may assign them to an entity continuing the project, with reasonable notice.\n\nArticle 80 (Waiver) Failure or delay in exercising a right is not a waiver, and partial exercise does not preclude further exercise.\n\nArticle 81 (Severability) Provisions are independent; if one is invalid, the rest remain effective and shall be replaced by a lawful provision closest to the original intent.\n\nArticle 82 (Headings and terms) Headings aid reading only. "Including" means "including without limitation"; "day" means calendar day.\n\nArticle 83 (Governing law) This Agreement is governed by the laws of mainland China, without regard to conflict rules.\n\nArticle 84 (Disputes) Disputes shall first be resolved amicably; failing that, either party may bring the matter before a competent court at our principal place of operation.\n\nArticle 85 (Survival) Provisions that by nature should survive termination continue in force, including intellectual property, disclaimer, liability, indemnity and dispute resolution.
ja=第16章 その他の定め\n\n第77条（通知）アプリ内のお知らせ、プロジェクトページ、リポジトリ、リリースノートで通知します。公開時に到達したものとみなし、定期的にご確認ください。\n\n第78条（完全合意）本契約と「任意認証契約」が本機能に関する完全な合意を構成し、従前の口頭・書面の説明、約束、宣伝に代わります。\n\n第79条（譲渡の制限）当方の書面同意なく権利義務を譲渡できません。当方はプロジェクトを承継する主体に譲渡でき、合理的に通知します。\n\n第80条（権利の不行使）権利を行使しない、または遅延しても放棄とはならず、一部行使も以後の行使を妨げません。\n\n第81条（可分性）各条項は独立し、一つが無効でも他は有効に存続し、最も近い趣旨の適法な条項で置き換えます。\n\n第82条（見出しと用語）見出しは読みやすさのためで解釈に影響しません。「含む」は「含むがこれに限らない」、「日」は暦日を指します。\n\n第83条（準拠法）本契約は中華人民共和国本土の法律に準拠し、抵触法の適用を除きます。\n\n第84条（紛争解決）紛争はまず友好的に協議し、解決しない場合は当方の主たる事業所所在地の管轄裁判所に提訴できます。\n\n第85条（存続条項）性質上終了後も有効であるべき条項は存続します（知的財産、免責、責任、補償、紛争解決など）。

consent.disclaimer.body.18
zh=附录一 数据处理与风险清单\n\n为便于您理解本功能涉及的数据，特列明如下：\n\n（一）微软账户登录令牌：加密保存在本机 PMCL 数据目录，用于启动游戏与判断验证状态；不会上传至我们的服务器，不提供给任何第三方。\n\n（二）账户标识与用户名：保存在本地账户库，用于生成启动参数与界面显示。\n\n（三）游戏所有权状态：仅在验证时向第三方服务查询，用于判断是否开放本功能；我们不长期保存查询结果的完整副本。\n\n（四）正版下载版本标记：在本地记录哪些游戏版本系经本功能下载，仅用于启动时的账户类型校验。\n\n（五）下载任务与队列状态：仅保存在本地，用于展示进度与支持断点续传。\n\n（六）本地日志：用于排查启动与下载问题，保存在本机，不会自动上传；您在提交问题反馈时可自行决定是否附带。\n\n（七）我们不收集：您的账号密码、支付信息、通讯录、精确位置、剪贴板内容、生物识别信息，也不进行广告画像或行为追踪。
en=Appendix 1 Data and Risk Schedule\n\n(1) Microsoft sign-in token: stored encrypted in the local PMCL data directory, used to launch the game and determine verification state; never uploaded to our servers or shared with third parties.\n\n(2) Account identifier and username: stored in the local account store for launch arguments and interface display.\n\n(3) Ownership status: queried from third-party services only at verification time to decide whether to enable the Feature; we do not retain a full copy.\n\n(4) Premium-download version markers: recorded locally to identify versions downloaded through the Feature, used only for account-type checks at launch.\n\n(5) Download tasks and queue status: stored locally to show progress and support resumption.\n\n(6) Local logs: kept on your device for troubleshooting; never uploaded automatically, and you choose whether to attach them to a report.\n\n(7) We do not collect: passwords, payment information, contacts, precise location, clipboard content or biometric data, and we do not run advertising profiles or behavioural tracking.
ja=付録1 データとリスクの一覧\n\n(1) Microsoft サインイントークン：端末内の PMCL データディレクトリに暗号化保存。起動と認証状態の判定に使用し、当方のサーバーへの送信や第三者提供は行いません。\n\n(2) アカウント識別子とユーザー名：ローカルのアカウントストアに保存。起動引数と画面表示に使用します。\n\n(3) 所有権状態：認証時に第三者のサービスへ照会して本機能の可否を判断します。完全なコピーを長期保存しません。\n\n(4) 正規ダウンロードのバージョンマーカー：本機能で取得したバージョンをローカルに記録し、起動時のアカウント種別確認にのみ使用します。\n\n(5) ダウンロードタスクとキューの状態：ローカルに保存し、進捗表示と再開に使用します。\n\n(6) ローカルログ：不具合調査のため端末内に保存します。自動送信は行わず、添付するかはご自身で判断できます。\n\n(7) 収集しないもの：パスワード、支払い情報、連絡先、正確な位置、クリップボード、生体情報。広告プロファイリングや行動追跡も行いません。

consent.disclaimer.body.19
zh=附录二 用户确认声明\n\n在勾选确认框之前，请您确认以下事项均属实：\n\n（一）我已完整阅读《免责协议》与《自愿授权协议》的全部内容，理解其中的风险揭示、免责与责任限制条款，并有机会就疑问进行咨询。\n\n（二）我用于验证的微软账户为本人合法所有，不存在借用、租用、购买他人账号的情形。\n\n（三）我理解本功能仅向具备游戏所有权的账户开放，且经本功能下载的版本只能使用正版账户启动。\n\n（四）我理解验证结果依赖第三方服务，可能因政策、网络或账号状态变化而失效。\n\n（五）我理解并自愿承担使用本功能可能带来的账号安全、地区政策与技术风险。\n\n（六）我承诺不规避技术措施、不进行自动化批量验证、不将本功能用于任何商业目的或代他人验证。\n\n（七）我知悉可随时退出账号以撤回授权，并可在本地删除相关数据。
en=Appendix 2 User Confirmation Statement\n\nBefore ticking the box, please confirm:\n\n(1) I have read the Disclaimer and the Voluntary Authorization Agreement in full, understand the risk disclosure, disclaimer and liability limitation clauses, and had the opportunity to seek advice.\n\n(2) The Microsoft account used for verification is lawfully mine; it is not borrowed, rented or purchased.\n\n(3) I understand the Feature is only for accounts with game ownership, and versions downloaded through it can only be launched with a premium account.\n\n(4) I understand verification depends on third-party services and may become invalid due to policy, network or account changes.\n\n(5) I understand and voluntarily accept the account-security, policy and technical risks of using the Feature.\n\n(6) I undertake not to circumvent technical measures, run automated bulk verification, or use the Feature commercially or on behalf of others.\n\n(7) I understand I may sign out at any time to withdraw authorization and delete related local data.
ja=付録2 利用者確認声明\n\nチェックの前に以下をご確認ください。\n\n(1) 免責契約と任意認証契約の全文を読み、リスク開示・免責・責任制限の条項を理解し、助言を受ける機会があったこと。\n\n(2) 認証に用いる Microsoft アカウントが正当にご自身のものであり、借用・賃借・購入したものではないこと。\n\n(3) 本機能はゲーム所有権のあるアカウントに限られ、本機能で取得したバージョンは正規アカウントでのみ起動できること。\n\n(4) 認証は第三者サービスに依存し、政策・ネットワーク・アカウント状態により失効し得ること。\n\n(5) アカウントの安全性、政策、技術的リスクを理解し、自発的に受け入れること。\n\n(6) 技術的措置の回避、自動一括認証、商業利用、代理認証を行わないこと。\n\n(7) いつでもサインアウトして認証を撤回し、ローカルデータを削除できること。

consent.disclaimer.body.20
zh=附录三 常见问题\n\n问一：验证通过后，我是否就获得了游戏的使用授权？\n答：不是。验证仅用于判断本功能是否向您开放。您对游戏的使用仍受游戏权利方使用条款的约束。\n\n问二：为什么下载的版本只能用正版账户启动？\n答：本功能是在地区限制基础上为正版持有人提供的例外。为避免该例外被用于离线使用，经本功能下载的版本会在启动时校验账户类型。\n\n问三：验证失败会不会影响我的账号？\n答：验证本身只是常规的登录与状态查询。但异常的登录地点或高频操作可能触发第三方的风控，请避免频繁切换账号。\n\n问四：我更换设备后需要重新验证吗？\n答：需要。登录状态保存在本机，更换设备后需重新登录。\n\n问五：退出登录后，已下载的版本还能启动吗？\n答：可以启动，但需要重新登录正版账户；离线账户无法启动经本功能下载的版本。\n\n问六：本功能会收费吗？\n答：不会。本功能免费提供，我们也不代收任何游戏费用。\n\n问七：我可以把这个功能分享给朋友吗？\n答：可以分享 PMCL 本身，但不得代他人验证、不得共享验证结果，也不得用于任何商业用途。\n\n问八：政策变化后本功能会怎样？\n答：我们可能调整、限制或停止本功能。已完成的下载与安装不受影响。\n\n问九：我的数据会被上传吗？\n答：不会。登录令牌与版本标记均保存在本机，详见附录一。\n\n问十：我对协议有异议怎么办？\n答：您可以不使用本功能，继续使用 PMCL 的其他功能，或改用游戏权利方提供的官方渠道。
en=Appendix 3 Frequently Asked Questions\n\nQ1: Does passing verification grant a licence to the game? No. It only determines whether the Feature is available; your use remains governed by the rights holder's terms.\n\nQ2: Why must downloaded versions be launched with a premium account? The Feature is an exception for premium owners. To prevent that exception from enabling offline use, downloaded versions check the account type at launch.\n\nQ3: Can verification affect my account? Verification itself is a routine sign-in and status query, but unusual locations or high-frequency actions may trigger third-party risk controls. Avoid frequent account switching.\n\nQ4: Do I need to verify again on a new device? Yes. Sign-in state is stored locally.\n\nQ5: Can I still launch downloaded versions after signing out? Yes, but you must sign in with a premium account again; offline accounts cannot launch them.\n\nQ6: Is the Feature paid? No, it is free and we collect no game fees.\n\nQ7: May I share the Feature with friends? You may share PMCL itself, but may not verify for others, share results, or use it commercially.\n\nQ8: What happens if policy changes? We may adjust, restrict or stop the Feature; completed downloads and installations are unaffected.\n\nQ9: Is my data uploaded? No. Tokens and version markers stay on your device; see Appendix 1.\n\nQ10: What if I object to the Agreement? You may stop using the Feature, keep using other PMCL features, or use the rights holder's official channels.
ja=付録3 よくある質問\n\n問1：認証通過はゲームの利用許諾ですか。いいえ。本機能の可否を判断するだけで、利用は権利者の条件に従います。\n\n問2：なぜダウンロード版は正規アカウントでのみ起動できるのですか。本機能は正規所有者向けの例外であり、オフライン利用に転用されないよう起動時に確認します。\n\n問3：認証でアカウントに影響しますか。認証自体は通常のサインインと照会ですが、異常な接続元や高頻度操作は第三者のリスク管理を誘発し得ます。\n\n問4：新しい端末では再認証が必要ですか。はい。サインイン状態はローカル保存です。\n\n問5：サインアウト後もダウンロード版を起動できますか。再サインインが必要です。オフラインアカウントでは起動できません。\n\n問6：有料ですか。いいえ、無償です。\n\n問7：友人と共有できますか。PMCL 自体は共有できますが、代理認証・結果の共有・商業利用はできません。\n\n問8：政策変更時はどうなりますか。調整・制限・停止があり得ますが、既存のダウンロードとインストールには影響しません。\n\n問9：データは送信されますか。いいえ。付録1をご覧ください。\n\n問10：契約に異議がある場合は。本機能を利用せず、他の機能または公式窓口をご利用ください。

consent.authorization.body.01
zh=第一章 总则与定义\n\n第一条（协议目的）本协议由您（以下称「授权人」）与 PMCL 项目贡献者（以下称「被授权方」或「我们」）就您自愿授权 PMCL 在您的设备上完成正版账户验证与相关数据处理事宜作出约定。本协议是《免责协议》的组成部分，二者共同构成您使用本功能的完整约定。\n\n第二条（定义）本协议中：「授权」指您依本协议允许 PMCL 在您的设备上执行特定操作的意思表示；「登录令牌」指微软账户体系签发的访问令牌与刷新令牌；「所有权状态」指该账户对 Minecraft 所享有的可识别权益状态；「本地数据」指保存在您设备上 PMCL 数据目录内的数据；「撤回」指您依本协议终止授权并要求停止处理的行为。\n\n第三条（自愿性）本授权完全出于您的自愿。我们未以任何形式强迫、诱导或变相迫使您授权；您不授权的，仅本功能不可用，不影响 PMCL 其他功能的使用。\n\n第四条（与免责协议的关系）本协议侧重授权范围与数据处理；涉及风险揭示、免责与责任限制的事项，适用《免责协议》。两份协议冲突时，就授权与数据处理以本协议为准。
en=Chapter 1 General Provisions and Definitions\n\nArticle 1 (Purpose) This Agreement sets out the terms on which you (the "authorizer") voluntarily authorize PMCL to perform premium verification and related data processing on your device. It forms part of and works together with the Disclaimer.\n\nArticle 2 (Definitions) "Authorization" means your consent that PMCL perform specific operations on your device. "Sign-in token" means access and refresh tokens issued by the Microsoft account system. "Ownership status" means the recognizable entitlement to Minecraft held by the account. "Local data" means data stored in the PMCL data directory on your device. "Withdrawal" means ending this authorization and requesting that processing stop.\n\nArticle 3 (Voluntary) This authorization is entirely voluntary. We do not compel or induce it; refusing makes only the Feature unavailable and does not affect other PMCL features.\n\nArticle 4 (Relationship with the Disclaimer) This Agreement covers authorization scope and data processing; risk, disclaimer and liability are governed by the Disclaimer. Where they conflict, authorization and data processing follow this Agreement.
ja=第1章 総則と定義\n\n第1条（目的）本契約は、中国本土で PMCL を通じて正規アカウントを認証し、Minecraft ゲーム本体のダウンロード機能を利用するにあたり、PMCL の貢献者（以下「当方」）に対する認証と関連データ処理を任意に許可する条件を定めます。本契約は免責契約の一部を構成します。\n\n第2条（定義）「認証」とは端末上で特定の操作を行うことへの同意を指します。「サインイントークン」とは Microsoft が発行するアクセス・リフレッシュトークンを指します。「所有権状態」とは当該アカウントが有する Minecraft の権利状態を指します。「ローカルデータ」とは端末上の PMCL データディレクトリに保存されるデータを指します。「撤回」とは認証を終了し処理の停止を求める行為を指します。\n\n第3条（任意性）本認証は完全に任意です。拒否しても本機能が利用できないだけで、他の機能には影響しません。\n\n第4条（免責契約との関係）認証範囲とデータ処理は本契約、リスク・免責・責任は免責契約に従います。矛盾する場合はそれぞれの対象事項で優先します。

consent.authorization.body.02
zh=第二章 授权标的与范围\n\n第五条（授权内容）您授权 PMCL 在您的设备上执行下列操作：（一）发起并完成微软账户登录；（二）获取、保存并在必要时刷新登录令牌；（三）读取该账户的 Minecraft 所有权状态；（四）依据上述状态判断是否向您开放游戏本体下载；（五）在本地记录经本功能下载的版本标识，用于启动时的账户校验。\n\n第六条（授权范围的最小化）上述授权仅限于完成本功能所必需的范围内。我们不会超出该范围读取您的账户信息，不会访问与 Minecraft 无关的微软服务数据，也不会将令牌用于本功能以外的用途。\n\n第七条（地域范围）本授权在您所在地区适用。若您所在地区的法律法规或监管要求发生变化，我们可能调整授权范围或停止本功能。\n\n第八条（不涉及的行为）本授权不包含：代您注册账号、代您购买游戏、代您修改账号设置、代您处理退款或申诉、以及任何形式的账号托管。
en=Chapter 2 Subject Matter and Scope\n\nArticle 5 (Authorized operations) You authorize PMCL to: (a) initiate and complete Microsoft sign-in; (b) obtain, store and, when needed, refresh the sign-in token; (c) read the account's Minecraft ownership status; (d) decide whether to enable game downloads based on that status; and (e) record locally which versions were downloaded through the Feature for account checks at launch.\n\nArticle 6 (Minimal scope) Authorization is limited to what the Feature requires. We do not read account information beyond that scope, access Microsoft data unrelated to Minecraft, or use the token for other purposes.\n\nArticle 7 (Territory) This authorization applies in your region. If local law or regulatory requirements change, we may adjust the scope or stop the Feature.\n\nArticle 8 (Excluded acts) This authorization does not include registering accounts for you, purchasing the game, changing account settings, handling refunds or appeals, or any form of account custody.
ja=第2章 認証の対象と範囲\n\n第5条（認証内容）次の操作を許可します：(a) Microsoft サインインの開始と完了、(b) トークンの取得・保存・必要時の更新、(c) 当該アカウントの Minecraft 所有権状態の読み取り、(d) その状態に基づくダウンロード可否の判断、(e) 本機能で取得したバージョンのローカル記録（起動時の確認用）。\n\n第6条（最小限の範囲）認証は本機能に必要な範囲に限られます。それを超えるアカウント情報の読み取り、Minecraft と無関係な Microsoft データへのアクセス、本機能以外の目的でのトークン利用は行いません。\n\n第7条（地域）本認証はお住まいの地域に適用されます。法令や規制が変わった場合、範囲の調整や本機能の停止を行うことがあります。\n\n第8条（含まれない行為）アカウント登録の代行、ゲームの購入、設定変更、返金や異議申立ての処理、アカウントの保管は含まれません。

consent.authorization.body.03
zh=第三章 明确排除\n\n第九条（不取得账号控制权）本授权不使我们对您的账号取得任何控制权。我们无法以您的名义登录第三方网站、无法修改密码、无法变更绑定信息，也无法转移您的游戏所有权。\n\n第十条（不进行支付）本授权不涉及任何支付行为。我们不会代您下单、不会保存您的支付方式、不会发起扣款，也不会就本功能向您收取任何费用。\n\n第十一条（不代理对外行为）本授权不构成代理权。我们无权以您的名义向 Microsoft、Mojang 或任何第三方作出表示、承诺或主张。\n\n第十二条（不建立身份关联）本授权不使我们成为您的代理人、受托人、合伙人或雇员。双方之间不因本授权产生任何信赖义务或 fiduciary 关系。
en=Chapter 3 Express Exclusions\n\nArticle 9 (No control) This authorization gives us no control over your account. We cannot sign in to third-party sites in your name, change passwords, alter binding information or transfer your game ownership.\n\nArticle 10 (No payments) No payment is involved. We do not place orders, store payment methods, initiate charges or charge you for the Feature.\n\nArticle 11 (No agency) This authorization creates no agency. We may not make statements, promises or claims to Microsoft, Mojang or any third party in your name.\n\nArticle 12 (No fiduciary relationship) This authorization does not make us your agent, trustee, partner or employee, and creates no duty of trust or fiduciary relationship.
ja=第3章 明示的な除外\n\n第9条（支配権なし）本認証により当方がアカウントの支配権を得ることはありません。本人の名義で第三者サイトにログインしたり、パスワードを変更したり、紐付け情報を変更したり、所有権を移転することはできません。\n\n第10条（支払いなし）支払いは伴いません。注文、支払い方法の保存、請求の開始、本機能の利用料請求は行いません。\n\n第11条（代理権なし）代理権は生じません。Microsoft、Mojang その他の第三者に対し、本人の名義で表明・約束・主張をすることはできません。\n\n第12条（信認関係なし）本認証により、代理人・受託者・組合員・雇用関係は生じず、信認義務も発生しません。

consent.authorization.body.04
zh=第四章 数据处理原则\n\n第十三条（合法性）我们仅在取得您明示同意的前提下处理相关数据，处理目的限于本协议第五条所列事项。\n\n第十四条（最小必要）我们仅处理实现本功能所必需的数据，不收集与功能无关的信息，不进行超出必要范围的分析与关联。\n\n第十五条（本地优先）本功能所需的数据处理均在您的设备上完成。我们不建设用于存储用户账号数据的服务器，也不将令牌集中上传。\n\n第十六条（目的限制）我们不会将您的数据用于广告投放、用户画像、信用评估、风控建模或其他与本功能无关的目的。\n\n第十七条（透明性）我们通过本协议与《免责协议》附录一列明处理的数据项、用途与保存位置，并在功能变化时更新说明。
en=Chapter 4 Data Processing Principles\n\nArticle 13 (Lawfulness) We process relevant data only with your explicit consent and only for the purposes listed in Article 5.\n\nArticle 14 (Minimisation) We process only data necessary for the Feature, do not collect unrelated information and do not perform analysis or correlation beyond necessity.\n\nArticle 15 (Local first) Processing required by the Feature happens on your device. We do not operate servers storing user account data and do not centrally upload tokens.\n\nArticle 16 (Purpose limitation) We do not use your data for advertising, profiling, credit scoring, risk modelling or other unrelated purposes.\n\nArticle 17 (Transparency) This Agreement and Appendix 1 of the Disclaimer list the data items, purposes and storage locations, and are updated when the Feature changes.
ja=第4章 データ処理の原則\n\n第13条（適法性）明示的な同意がある場合に限り、第5条の目的の範囲で関連データを処理します。\n\n第14条（最小化）本機能に必要なデータのみを処理し、無関係な情報の収集や過度な分析・関連付けは行いません。\n\n第15条（ローカル優先）本機能に必要な処理は端末上で行います。アカウントデータを保存するサーバーは運用せず、トークンを集中アップロードしません。\n\n第16条（目的の制限）広告配信、プロファイリング、信用評価、リスクモデリングなど、本機能と無関係な目的にデータを使用しません。\n\n第17条（透明性）本契約と免責契約の付録1で、データ項目・目的・保存場所を明示し、機能変更時に更新します。

consent.authorization.body.05
zh=第五章 数据项与用途\n\n第十八条（登录令牌）用途：完成登录状态维持、启动游戏时向第三方服务验证会话有效性。保存位置：本机 PMCL 数据目录，加密存储。保存期限：至您退出登录或撤回授权时止。\n\n第十九条（账户标识与用户名）用途：生成启动参数、在界面中显示当前账号、区分本地账户库中的条目。保存位置：本机账户库。\n\n第二十条（所有权状态）用途：判断是否向您开放本功能。该状态为查询结果，我们不长期保存其完整副本，仅在验证时点使用。\n\n第二十一条（正版下载版本标记）用途：启动时校验账户类型，确保经本功能下载的版本不被离线账户启动。保存位置：本机数据目录。\n\n第二十二条（本地日志）用途：排查启动失败、下载异常与验证问题。保存位置：本机日志目录。我们不会自动上传日志；您在提交反馈时可自行决定是否附带。\n\n第二十三条（不处理的数据）我们不处理您的账号密码、支付信息、通信内容、通讯录、精确位置、剪贴板、生物识别信息与设备唯一标识。
en=Chapter 5 Data Items and Purposes\n\nArticle 18 (Sign-in token) Purpose: maintaining sign-in and validating sessions with third-party services at launch. Location: local PMCL data directory, encrypted. Retention: until you sign out or withdraw.\n\nArticle 19 (Account identifier and username) Purpose: generating launch arguments, showing the current account and distinguishing entries in the local account store. Location: local account store.\n\nArticle 20 (Ownership status) Purpose: deciding whether to enable the Feature. It is a query result used at verification time; we do not retain a full long-term copy.\n\nArticle 21 (Premium-download markers) Purpose: checking account type at launch so versions downloaded through the Feature cannot be started with an offline account. Location: local data directory.\n\nArticle 22 (Local logs) Purpose: troubleshooting launch, download and verification failures. Location: local log directory. Logs are never uploaded automatically; you choose whether to attach them.\n\nArticle 23 (Not processed) Passwords, payment information, communications, contacts, precise location, clipboard, biometric data and device identifiers.
ja=第5章 データ項目と目的\n\n第18条（サインイントークン）目的：サインイン状態の維持と起動時のセッション検証。保存場所：ローカルの PMCL データディレクトリ（暗号化）。保存期間：サインアウトまたは撤回まで。\n\n第19条（アカウント識別子とユーザー名）目的：起動引数の生成、現在のアカウント表示、ローカルアカウントの識別。保存場所：ローカルのアカウントストア。\n\n第20条（所有権状態）目的：本機能の可否の判断。認証時に使用する照会結果であり、完全なコピーを長期保存しません。\n\n第21条（正規ダウンロードのマーカー）目的：起動時のアカウント種別確認。本機能で取得したバージョンをオフラインで起動できないようにします。保存場所：ローカルデータディレクトリ。\n\n第22条（ローカルログ）目的：起動・ダウンロード・認証の不具合調査。保存場所：ローカルログディレクトリ。自動送信は行いません。\n\n第23条（処理しないデータ）パスワード、支払い情報、通信内容、連絡先、正確な位置、クリップボード、生体情報、端末識別子。

consent.authorization.body.06
zh=第六章 存储与安全\n\n第二十四条（加密存储）登录令牌以加密形式保存，加密密钥由本地机制管理。我们不掌握可用于解密您本地令牌的密钥。\n\n第二十五条（访问控制）本地数据仅可由运行 PMCL 的系统用户访问。我们建议您为设备设置登录密码，并避免在公用设备上使用本功能。\n\n第二十六条（传输安全）与第三方服务通信时，PMCL 使用 HTTPS 等加密传输方式；我们不对传输链路的绝对安全作出保证，该等保证由相应服务提供方承担。\n\n第二十七条（安全事件的应对）若您发现本地数据异常、设备丢失或账号出现异常登录，请立即退出登录、修改账号密码，并通过项目渠道告知我们。\n\n第二十八条（残余风险）尽管采取上述措施，仍无法完全排除数据被未授权访问的可能。您理解并接受该等残余风险。
en=Chapter 6 Storage and Security\n\nArticle 24 (Encryption) Sign-in tokens are stored encrypted with locally managed keys. We do not hold keys that can decrypt your local token.\n\nArticle 25 (Access control) Local data is accessible only to the system user running PMCL. We recommend a device login password and avoiding public devices.\n\nArticle 26 (Transit security) Communications with third-party services use HTTPS and similar encrypted channels. We do not guarantee absolute link security; that is the service providers' responsibility.\n\nArticle 27 (Incident response) If you notice abnormal local data, device loss or unusual sign-ins, sign out immediately, change your password and inform us through project channels.\n\nArticle 28 (Residual risk) Despite these measures unauthorised access cannot be fully excluded. You understand and accept this residual risk.
ja=第6章 保存と安全\n\n第24条（暗号化）サインイントークンはローカル管理の鍵で暗号化して保存します。当方はローカルトークンを復号できる鍵を保有しません。\n\n第25条（アクセス制御）ローカルデータは PMCL を実行するシステムユーザーのみがアクセスできます。端末のログインパスワード設定を推奨し、公共端末での利用は避けてください。\n\n第26条（通信の保護）第三者サービスとの通信には HTTPS などの暗号化経路を使用します。経路の絶対的な安全は保証せず、それは各サービス提供者の責任です。\n\n第27条（事故時の対応）ローカルデータの異常、端末の紛失、不審なサインインに気付いた場合は、直ちにサインアウトし、パスワードを変更し、公開窓口へご連絡ください。\n\n第28条（残存リスク）上記の措置を講じても、不正アクセスを完全に排除することはできません。この残存リスクを理解し受け入れるものとします。

consent.authorization.body.07
zh=第七章 保存期限与删除\n\n第二十九条（保存期限）登录令牌保存至您退出登录、撤回授权或令牌失效后经刷新仍不可用时止；账户标识与用户名保存至您从本地账户库删除该账户时止；正版下载版本标记保存至相应版本被删除或您清除本地数据时止。\n\n第三十条（删除方式）您可通过「账号」页面退出登录以删除本地令牌，通过账户管理删除账户条目，或直接删除 PMCL 数据目录中的相应文件。删除操作在本机完成，无需向我们申请。\n\n第三十一条（删除的后果）删除令牌后，本功能将不可用，直至您重新登录并完成验证；删除版本标记后，相应版本将不再受正版启动校验约束，但您仍需遵守游戏权利方的使用条款。\n\n第三十二条（备份与残留）您自行创建的设备备份、系统快照或同步副本可能保留已删除数据的副本。该等副本不在我们的控制范围内，需由您自行清理。
en=Chapter 7 Retention and Deletion\n\nArticle 29 (Retention) Tokens are retained until you sign out, withdraw, or the token expires and cannot be refreshed. Account identifiers are retained until you remove the account locally. Version markers are retained until the version is deleted or local data is cleared.\n\nArticle 30 (Deletion) You may sign out on the Accounts page, remove the account entry, or delete the corresponding files in the PMCL data directory. Deletion happens locally with no request to us.\n\nArticle 31 (Consequences) After deletion the Feature is unavailable until you sign in and verify again. Removing version markers ends the premium launch check for those versions, but the rights holder's terms still apply.\n\nArticle 32 (Backups) Device backups, snapshots or synced copies you created may retain deleted data. They are outside our control and must be cleaned up by you.
ja=第7章 保存期間と削除\n\n第29条（保存期間）トークンはサインアウト・撤回・更新不能な失効まで保存します。アカウント識別子はローカルで削除するまで保存します。バージョンマーカーは当該バージョンの削除またはローカルデータの消去まで保存します。\n\n第30条（削除方法）「アカウント」ページでのサインアウト、アカウント項目の削除、または PMCL データディレクトリ内の該当ファイルの削除により行えます。削除は端末上で完結し、当方への申請は不要です。\n\n第31条（削除の影響）削除後は再サインインと再認証まで本機能を利用できません。マーカーを削除すると当該バージョンの正規起動確認は終了しますが、権利者の条件は引き続き適用されます。\n\n第32条（バックアップ）ご自身で作成したバックアップやスナップショット、同期コピーには削除済みデータが残る場合があります。これらは当方の管理外であり、ご自身で削除してください。

consent.authorization.body.08
zh=第八章 用户权利\n\n第三十三条（知情权）您有权了解我们处理哪些数据、为何处理、保存于何处。本协议第五章与附录二即为该等说明。\n\n第三十四条（撤回权）您有权随时撤回本授权。撤回后我们不再基于本授权处理您的数据，但不影响撤回前已完成的处理与已下载内容的有效性。\n\n第三十五条（删除权）您有权删除本地保存的账户数据与版本标记。删除方式见第三十条。\n\n第三十六条（更正权）您发现本地保存的账户信息有误的，可通过重新登录或删除后重新添加予以更正。\n\n第三十七条（投诉权）您认为我们的处理行为违反本协议或适用法律的，可通过项目公开渠道提出；我们将在合理期限内答复。\n\n第三十八条（行使方式）上述权利均可由您在本地自行行使，无需经过审批，也不收取任何费用。
en=Chapter 8 Your Rights\n\nArticle 33 (Information) You may learn which data we process, why and where. Chapter 5 and Appendix 2 provide that information.\n\nArticle 34 (Withdrawal) You may withdraw at any time. We then stop processing based on this authorization, without affecting prior processing or the validity of downloads already completed.\n\nArticle 35 (Deletion) You may delete locally stored account data and version markers as described in Article 30.\n\nArticle 36 (Correction) If locally stored account information is inaccurate, correct it by signing in again or removing and re-adding the account.\n\nArticle 37 (Complaints) If you believe our processing violates this Agreement or applicable law, raise it through public project channels; we will respond within a reasonable period.\n\nArticle 38 (Exercise) All rights may be exercised locally by you without approval and free of charge.
ja=第8章 利用者の権利\n\n第33条（知る権利）どのデータを、なぜ、どこに保存するかを確認できます。本契約の第5章と付録2に記載しています。\n\n第34条（撤回権）いつでも撤回できます。撤回後は本認証に基づく処理を停止しますが、撤回前の処理や既に完了したダウンロードの有効性には影響しません。\n\n第35条（削除権）ローカルに保存されたアカウントデータとバージョンマーカーを削除できます（第30条）。\n\n第36条（訂正権）ローカルのアカウント情報に誤りがある場合は、再サインインまたは削除・再追加で訂正できます。\n\n第37条（苦情申立て）処理が本契約や適用法に違反すると考える場合は公開窓口へご連絡ください。合理的な期間内に回答します。\n\n第38条（行使方法）以上の権利は端末上で自由に行使でき、承認や費用は不要です。

consent.authorization.body.09
zh=第九章 授权期限与终止\n\n第三十九条（生效）本授权自您勾选确认并点击「同意并继续」之时生效。\n\n第四十条（自动终止）出现下列情形之一的，本授权自动终止：您退出登录；您删除本地账户数据；您卸载 PMCL 并清除数据目录；令牌失效且无法刷新；本功能停止提供。\n\n第四十一条（我方终止）您违反本协议或《免责协议》的，或依法律、监管要求必须停止处理的，我们可终止本授权并停止向您开放本功能。\n\n第四十二条（终止后的处理）授权终止后，我们不再处理您的数据；本地已有数据的清除由您按第三十条操作，或由您在卸载时一并删除。\n\n第四十三条（存续条款）本协议中关于责任限制、争议解决与语言版本的条款，在授权终止后继续有效。
en=Chapter 9 Term and Termination\n\nArticle 39 (Effectiveness) This authorization takes effect when you tick the boxes and click "Agree and continue".\n\nArticle 40 (Automatic termination) It terminates automatically when you sign out, delete local account data, uninstall PMCL and clear its data directory, when the token expires and cannot be refreshed, or when the Feature is discontinued.\n\nArticle 41 (Termination by us) If you breach this Agreement or the Disclaimer, or if law or regulation requires us to stop, we may terminate this authorization and the Feature.\n\nArticle 42 (After termination) We stop processing your data. Local data is cleared by you as described in Article 30, or removed on uninstall.\n\nArticle 43 (Survival) Provisions on limitation of liability, dispute resolution and language survive termination.
ja=第9章 有効期間と終了\n\n第39条（発効）チェックを入れて「同意して続行」を押した時点で発効します。\n\n第40条（自動終了）サインアウト、ローカルアカウントデータの削除、PMCL のアンインストールとデータディレクトリの削除、トークンの失効かつ更新不能、本機能の提供終了のいずれかで終了します。\n\n第41条（当方による終了）本契約または免責契約に違反した場合、法令上処理の停止が必要な場合、当方は本認証と本機能を終了できます。\n\n第42条（終了後）当方はデータ処理を停止します。ローカルデータは第30条に従い利用者が削除するか、アンインストール時に削除されます。\n\n第43条（存続）責任の制限、紛争解決、言語に関する条項は終了後も有効です。

consent.authorization.body.10
zh=第十章 第三方与责任\n\n第四十四条（第三方的独立处理）微软与 Mojang 依其自身的服务条款与隐私政策处理您的账号数据。该等处理独立于本授权，我们无法控制，也不对其承担责任。\n\n第四十五条（不共享）我们不会将您的本地数据出售、出租、交换或以其他方式提供给第三方，法律另有强制规定的除外。\n\n第四十六条（责任限制）在法律允许的最大范围内，因使用或无法使用本授权导致的数据丢失、账号受限、服务中断或其他损失，我们不承担责任；《免责协议》第十二章的约定同样适用于本协议。\n\n第四十七条（我们的义务边界）我们的义务限于按本协议约定在本地完成相应操作。我们不对第三方服务的可用性、准确性或安全性作出承诺。\n\n第四十八条（不可抗力）因不可抗力导致授权无法履行的，依《免责协议》第十四章处理。
en=Chapter 10 Third Parties and Liability\n\nArticle 44 (Independent processing) Microsoft and Mojang process your account data under their own terms and privacy policies. That processing is independent of this authorization; we neither control nor answer for it.\n\nArticle 45 (No sharing) We do not sell, rent, exchange or otherwise provide your local data to third parties, except where legally compelled.\n\nArticle 46 (Liability) To the maximum extent permitted by law we are not liable for data loss, account restriction, service interruptions or other loss arising from use or unavailability of this authorization; Chapter 12 of the Disclaimer applies equally.\n\nArticle 47 (Scope of our duties) Our duties are limited to performing the agreed local operations. We make no commitment about third-party availability, accuracy or security.\n\nArticle 48 (Force majeure) Inability to perform due to force majeure is handled under Chapter 14 of the Disclaimer.
ja=第10章 第三者と責任\n\n第44条（第三者の独立処理）Microsoft と Mojang は各自の規約とプライバシーポリシーに基づきアカウントデータを処理します。これは本認証とは独立しており、当方は制御も責任も負いません。\n\n第45条（非共有）法令上の強制がある場合を除き、ローカルデータを第三者へ販売・貸与・交換・提供しません。\n\n第46条（責任）法律で許される最大限の範囲で、本認証の利用または利用不能に起因するデータ喪失、アカウント制限、サービス中断その他の損失について責任を負いません。免責契約の第12章も同様に適用されます。\n\n第47条（義務の範囲）当方の義務は、合意されたローカル操作の実行に限られます。第三者の可用性・正確性・安全性は保証しません。\n\n第48条（不可抗力）不可抗力による履行不能は免責契約の第14章に従います。

consent.authorization.body.11
zh=第十一章 未成年人保护与跨境传输\n\n第四十九条（未成年人）若您为未成年人，应在监护人知情并同意的情况下作出本授权。监护人可代为撤回授权并要求删除本地数据。\n\n第五十条（不面向儿童收集）本功能不面向儿童设计，我们不会主动收集儿童个人信息，也不会基于本功能进行任何针对未成年人的营销。\n\n第五十一条（本地处理与跨境）本授权项下的数据处理在您的设备上完成，我们不将数据传输至境外服务器，因此不涉及个人信息出境。\n\n第五十二条（第三方跨境）您登录微软账户时，相关数据传输由 Microsoft 依其政策处理，可能涉及跨境传输；该等处理不属于本授权的范围。\n\n第五十三条（法律变化）若未来因功能调整需要跨境传输，我们将另行征得您的单独同意。
en=Chapter 11 Minors and Cross-Border Transfer\n\nArticle 49 (Minors) Minors should grant this authorization with a guardian's knowledge and consent. Guardians may withdraw it and request deletion of local data.\n\nArticle 50 (Not directed at children) The Feature is not designed for children; we do not knowingly collect children's personal information or market to minors through it.\n\nArticle 51 (Local processing) Data under this authorization is processed on your device. We do not transfer it to servers outside your region, so no cross-border transfer of personal information occurs.\n\nArticle 52 (Third parties) When you sign in to Microsoft, data is transferred under Microsoft's policies and may cross borders; that processing is outside this authorization.\n\nArticle 53 (Future changes) If cross-border transfer ever becomes necessary, we will obtain your separate consent first.
ja=第11章 未成年者と越境移転\n\n第49条（未成年者）未成年者は保護者の同意のもとで本認証を行ってください。保護者は撤回とローカルデータの削除を求めることができます。\n\n第50条（児童向けでない）本機能は児童向けではなく、児童の個人情報を意図的に収集したり、未成年者向けの勧誘を行いません。\n\n第51条（ローカル処理）本認証のデータは端末上で処理され、域外のサーバーへ送信しないため、個人情報の越境移転は発生しません。\n\n第52条（第三者）Microsoft へのサインイン時、データは同社の方針に基づき処理され、越境移転を含む場合があります。これは本認証の範囲外です。\n\n第53条（将来の変更）将来越境移転が必要になった場合は、別途の同意を取得します。

consent.authorization.body.12
zh=第十二章 其他约定\n\n第五十四条（协议变更）我们可能因法律、监管或功能变化修订本协议。修订后的协议将在您下次使用本功能前重新征求同意；您不同意的，可停止使用本功能。\n\n第五十五条（可分割性）本协议任何条款被认定无效或不可执行的，不影响其余条款的效力，双方应以最接近原意的有效条款替代。\n\n第五十六条（禁止转让）本授权具有人身属性，仅限您本人行使，不得转让、再许可、出租或用于任何商业目的。\n\n第五十七条（完整协议）本协议与《免责协议》共同构成完整约定，取代此前的口头或书面说明。\n\n第五十八条（适用法律与争议解决）本协议适用中华人民共和国大陆地区法律；因本协议产生的争议，双方应友好协商，协商不成的提交我们主要运营地有管辖权的人民法院处理。\n\n第五十九条（语言版本）本协议以简体中文版本为准，其他语言译本仅供参考。\n\n第六十条（生效确认）您勾选确认框并点击「同意并继续」，即表示您已完整阅读、理解并自愿作出本协议项下的全部授权。
en=Chapter 12 Miscellaneous\n\nArticle 54 (Changes) We may revise this Agreement for legal, regulatory or functional reasons. Revised terms require consent before your next use; you may stop using the Feature if you disagree.\n\nArticle 55 (Severability) If a provision is invalid or unenforceable, the rest remain effective and shall be replaced by a valid provision closest to the original intent.\n\nArticle 56 (No assignment) This authorization is personal and may not be assigned, sublicensed, rented or used commercially.\n\nArticle 57 (Entire agreement) This Agreement and the Disclaimer form the entire agreement and supersede prior statements.\n\nArticle 58 (Governing law) This Agreement is governed by the laws of mainland China; disputes shall first be negotiated and otherwise submitted to a competent court at our principal place of operation.\n\nArticle 59 (Language) The Simplified Chinese version prevails; other translations are for reference only.\n\nArticle 60 (Confirmation) By ticking and clicking "Agree and continue" you confirm that you have read, understood and voluntarily granted this authorization.
ja=第12章 その他\n\n第54条（変更）法令・規制・機能の変化に応じて改定することがあります。改定後は次回利用前に再同意を求め、同意できない場合は利用を中止できます。\n\n第55条（可分性）いずれかの条項が無効・執行不能でも他は有効に存続し、最も近い趣旨の有効な条項で置き換えます。\n\n第56条（譲渡禁止）本認証は一身専属であり、譲渡・再許諾・貸与・商業利用はできません。\n\n第57条（完全合意）本契約と免責契約が完全な合意を構成し、従前の説明に代わります。\n\n第58条（準拠法・紛争解決）中華人民共和国本土の法律に準拠し、紛争はまず協議、解決しない場合は当方の主たる事業所所在地の管轄裁判所に提訴します。\n\n第59条（言語）簡体字中国語版を正文とし、他の翻訳は参考です。\n\n第60条（確認）チェックして「同意して続行」を押すことで、全文を読み理解し自発的に認証したものとみなされます。

consent.authorization.body.13
zh=附录一 撤回授权操作指引\n\n（一）退出登录：打开 PMCL，进入「账号」页面，选择当前微软账户并退出登录。退出后本地登录令牌将被清除，本功能随即不可用。\n\n（二）删除账户：在账号列表中删除该账户条目，可同时清除本地保存的账户标识与用户名。\n\n（三）清除版本标记：删除经本功能下载的游戏版本，或在卸载 PMCL 时一并删除其数据目录。\n\n（四）完全清除：卸载 PMCL 并手动删除 PMCL 数据目录，可清除全部本地数据；操作前请确认已备份存档与配置。\n\n（五）注意事项：撤回授权不影响您已经获得的游戏文件的本地存在，但您对这些文件的使用仍受游戏权利方使用条款的约束。
en=Appendix 1 How to Withdraw\n\n(1) Sign out: open PMCL, go to Accounts, select the Microsoft account and sign out. The local token is cleared and the Feature becomes unavailable.\n\n(2) Remove the account: delete the account entry to clear the local identifier and username.\n\n(3) Clear markers: delete versions downloaded through the Feature, or remove the data directory when uninstalling PMCL.\n\n(4) Full removal: uninstall PMCL and delete its data directory to clear all local data; back up worlds and settings first.\n\n(5) Note: withdrawal does not remove game files already on your device, but their use remains subject to the rights holder's terms.
ja=付録1 認証撤回の手順\n\n(1) サインアウト：PMCL の「アカウント」で Microsoft アカウントを選びサインアウトします。ローカルトークンが削除され、本機能は利用できなくなります。\n\n(2) アカウント削除：アカウント項目を削除すると、ローカルの識別子とユーザー名が削除されます。\n\n(3) マーカー削除：本機能で取得したバージョンを削除するか、アンインストール時にデータディレクトリを削除します。\n\n(4) 完全削除：PMCL をアンインストールしデータディレクトリを削除すると、ローカルデータがすべて消去されます。事前にワールドと設定をバックアップしてください。\n\n(5) 注意：撤回しても端末上のゲームファイルは残りますが、その利用は権利者の条件に従います。

consent.authorization.body.14
zh=附录二 授权数据清单\n\n（一）数据项：微软账户登录令牌。是否上传：否。保存位置：本地数据目录（加密）。用途：登录状态维持与会话刷新。\n\n（二）数据项：账户 UUID 与用户名。是否上传：否。保存位置：本地账户库。用途：启动参数与界面显示。\n\n（三）数据项：Minecraft 所有权状态。是否上传：否。保存位置：不长期保存。用途：判断是否开放本功能。\n\n（四）数据项：正版下载版本标识。是否上传：否。保存位置：本地数据目录。用途：启动时的账户类型校验。\n\n（五）数据项：本地运行日志。是否上传：否（除非您主动提供）。保存位置：本地日志目录。用途：故障排查。\n\n（六）我们不收集：密码、支付信息、通讯录、精确位置、剪贴板、生物识别信息、设备唯一标识。
en=Appendix 2 Authorized Data Schedule\n\n(1) Microsoft sign-in token. Uploaded: no. Storage: local data directory (encrypted). Purpose: session maintenance and refresh.\n\n(2) Account UUID and username. Uploaded: no. Storage: local account store. Purpose: launch arguments and interface display.\n\n(3) Minecraft ownership status. Uploaded: no. Storage: not retained long term. Purpose: deciding whether to enable the Feature.\n\n(4) Premium-download version markers. Uploaded: no. Storage: local data directory. Purpose: account-type check at launch.\n\n(5) Local runtime logs. Uploaded: no (unless you provide them). Storage: local log directory. Purpose: troubleshooting.\n\n(6) Not collected: passwords, payment information, contacts, precise location, clipboard, biometric data, device identifiers.
ja=付録2 認証データの一覧\n\n(1) Microsoft サインイントークン。送信：なし。保存：ローカルデータディレクトリ（暗号化）。目的：サインイン維持と更新。\n\n(2) アカウント UUID とユーザー名。送信：なし。保存：ローカルのアカウントストア。目的：起動引数と表示。\n\n(3) Minecraft 所有権状態。送信：なし。保存：長期保存なし。目的：本機能の可否判断。\n\n(4) 正規ダウンロードのバージョンマーカー。送信：なし。保存：ローカルデータディレクトリ。目的：起動時のアカウント種別確認。\n\n(5) ローカル実行ログ。送信：なし（ご自身で提供する場合を除く）。保存：ローカルログディレクトリ。目的：不具合調査。\n\n(6) 収集しないもの：パスワード、支払い情報、連絡先、正確な位置、クリップボード、生体情報、端末識別子。

consent.disclaimer.body.21
zh=附录四 合规与监管说明\n\n（一）政策背景。部分地区的法律法规或监管要求，对游戏内容的获取与分发作出限制。为遵守该等要求，PMCL 在相应地区默认不提供游戏本体下载。\n\n（二）豁免逻辑。考虑到游戏权利方通常允许已购买游戏的用户获取其游戏文件，本功能允许在完成正版账户验证的前提下获取游戏本体。该豁免以「用户确实拥有该游戏」为前提，而非以地区为唯一判断标准。\n\n（三）验证的必要性。若无验证环节，本功能将无法区分正版持有人与其他使用者，从而使豁免失去正当性。因此验证不是形式步骤，而是本功能成立的基础。\n\n（四）限制的持续性。即使验证通过，PMCL 仍可能在政策变化时收紧或停止本功能。届时已下载内容不受影响，但新的下载将不再提供。\n\n（五）与第三方政策的关系。本功能不改变游戏权利方的使用条款，也不构成对其授权范围的扩张。您对游戏的使用始终受该等条款约束。
en=Appendix 4 Compliance and Regulatory Notes\n\n(1) Background. Laws or regulatory requirements in some regions restrict obtaining and distributing game content. To comply, PMCL does not offer game downloads by default in those regions.\n\n(2) Rationale for the exception. Rights holders generally allow users who purchased the game to obtain its files. The Feature therefore allows downloads after premium verification. The premise is genuine ownership, not geography alone.\n\n(3) Why verification is required. Without it the Feature could not distinguish owners from others, and the exception would lose its justification. Verification is therefore foundational, not a formality.\n\n(4) Continuing restrictions. Even after verification, PMCL may tighten or stop the Feature if policy changes. Existing downloads are unaffected, but new downloads will not be offered.\n\n(5) Third-party policies. The Feature does not change the rights holder's terms or expand their scope. Your use of the game remains subject to those terms.
ja=付録4 コンプライアンスと規制に関する説明\n\n(1) 背景：一部の地域では法令や規制によりゲーム内容の取得・配布が制限されています。PMCL はこれに従い、当該地域では既定でゲーム本体のダウンロードを提供しません。\n\n(2) 例外の根拠：権利者は通常、購入済みの利用者にファイル取得を認めています。そこで本機能は正規認証後の取得を認めます。前提は実際の所有であり、地域だけではありません。\n\n(3) 認証が必要な理由：認証がなければ所有者と其他人を区別できず、例外の正当性が失われます。認証は形式ではなく本機能の基礎です。\n\n(4) 制限の継続：認証後も政策変更により本機能を厳格化・停止することがあります。既存のダウンロードは影響を受けませんが、新規提供は行いません。\n\n(5) 第三者方針との関係：本機能は権利者の条件を変更せず、その範囲を拡大するものでもありません。ゲームの利用は当該条件に従います。

consent.disclaimer.body.22
zh=附录五 终止与数据删除指引\n\n（一）停止使用。您可直接关闭本功能并继续使用 PMCL 的其他功能；本协议在您停止使用时终止。\n\n（二）退出账号。在「账号」页面退出当前账户，可清除本地登录令牌，本功能随即不可用。\n\n（三）删除版本。删除经本功能下载的游戏版本，可同时移除对应的本地标记。\n\n（四）清除全部数据。卸载 PMCL 并删除其数据目录，可清除全部本地数据。执行前请备份存档、配置与整合包。\n\n（五）终止后的权利。协议终止不影响您依游戏权利方条款继续使用已安装内容，也不影响已生效的免责与责任限制条款。\n\n（六）残留数据的处理。您自行创建的备份、快照与同步副本不在我们的控制范围内，需由您自行清理。
en=Appendix 5 Termination and Data Deletion Guide\n\n(1) Stop using: close the Feature and keep using other PMCL features; this Agreement ends when you stop.\n\n(2) Sign out: use the Accounts page to sign out, which clears the local token and disables the Feature.\n\n(3) Delete versions: removing a version downloaded through the Feature also removes its local marker.\n\n(4) Clear all data: uninstall PMCL and delete its data directory. Back up worlds, settings and modpacks first.\n\n(5) Rights after termination: you may keep using installed content under the rights holder's terms; disclaimer and liability provisions survive.\n\n(6) Residual copies: backups, snapshots and synchronised copies you created are outside our control and must be cleaned up by you.
ja=付録5 終了とデータ削除の手引き\n\n(1) 利用中止：本機能を閉じ、他の PMCL 機能を続けて利用できます。中止時点で本契約は終了します。\n\n(2) サインアウト：「アカウント」ページでサインアウトするとローカルトークンが削除され、本機能は利用できなくなります。\n\n(3) バージョン削除：本機能で取得したバージョンを削除すると、対応するマーカーも削除されます。\n\n(4) 全データ消去：PMCL をアンインストールしデータディレクトリを削除します。事前にワールド・設定・Mod パックをバックアップしてください。\n\n(5) 終了後の権利：権利者の条件の下でインストール済み内容を利用できます。免責と責任制限の条項は存続します。\n\n(6) 残存コピー：ご自身で作成したバックアップ・スナップショット・同期コピーは当方の管理外であり、ご自身で削除してください。

consent.disclaimer.body.23
zh=附录六 常见争议情形处理示例\n\n情形一：验证通过后账号被封禁。该结果由第三方服务决定，我们不承担责任；建议您通过游戏权利方的申诉渠道处理。\n\n情形二：下载中途失败并留下残缺文件。您可重新下载或校验文件完整性；因网络或第三方渠道导致的失败不构成我们的违约。\n\n情形三：更换设备后无法启动已下载版本。请在新设备上重新登录正版账户；离线账户无法启动经本功能下载的版本，这是本功能的设计要求。\n\n情形四：他人借用您的设备下载了游戏。由此产生的账号风控与授权争议由您自行承担；请妥善保管设备与登录状态。\n\n情形五：您认为本功能侵犯了您的权益。请通过项目公开渠道联系我们，我们将在合理期限内答复并视情况调整。\n\n情形六：政策变化导致本功能下线。我们会在可行范围内提前告知；已下载内容不受影响。\n\n情形七：验证结果与实际所有权不符。请以游戏权利方的官方查询结果为准，并向其提出异议。
en=Appendix 6 Common Scenarios\n\nScenario 1: the account is suspended after verification. The outcome is decided by the third party; contact the rights holder's appeal channel. We bear no liability.\n\nScenario 2: a download fails and leaves partial files. Retry or verify integrity; failure caused by network or third-party channels is not a breach by us.\n\nScenario 3: a downloaded version will not launch on a new device. Sign in with a premium account again; offline accounts cannot launch it by design.\n\nScenario 4: someone else downloaded the game on your device. Account risk and licensing disputes are yours; keep your device and sign-in state secure.\n\nScenario 5: you believe the Feature infringes your rights. Contact us through public channels; we will respond within a reasonable time and adjust if appropriate.\n\nScenario 6: the Feature is withdrawn after a policy change. We will give notice where feasible; downloaded content is unaffected.\n\nScenario 7: verification conflicts with actual ownership. The rights holder's official result prevails; raise objections with them.
ja=付録6 よくあるシナリオ\n\nシナリオ1：認証後にアカウントが停止された。判断は第三者によるもので、権利者の異議申立て窓口をご利用ください。当方は責任を負いません。\n\nシナリオ2：ダウンロードが中断し不完全なファイルが残った。再試行または整合性検証を行ってください。通信や第三者経路による失敗は当方の債務不履行ではありません。\n\nシナリオ3：新しい端末でダウンロード版が起動しない。正規アカウントで再サインインしてください。オフラインでは仕様上起動できません。\n\nシナリオ4：他人があなたの端末でダウンロードした。アカウントリスクと許諾の紛争はご自身の負担です。端末とサインイン状態を適切に管理してください。\n\nシナリオ5：本機能が権利を侵害すると考える。公開窓口へご連絡ください。合理的期間内に回答し、必要に応じ調整します。\n\nシナリオ6：政策変更で本機能が終了した。可能な範囲で事前告知します。既存のダウンロードは影響を受けません。\n\nシナリオ7：認証結果が実際の所有と異なる。権利者の公式結果が優先です。同社へ異議を申し立ててください。

consent.disclaimer.body.24
zh=附录七 术语表\n\n「本功能」：指正版账户验证通过后开放的游戏本体下载功能。\n\n「正版账户」：指经微软账户体系登录并具备可识别 Minecraft 所有权状态的账户。\n\n「验证」：指 PMCL 在本机获取登录令牌、查询所有权状态并据此判断是否开放本功能的过程。\n\n「本地数据」：指保存在您设备上 PMCL 数据目录内的账户信息、令牌、版本标记与日志。\n\n「离线账户」：指未经过微软账户体系验证、仅以本地用户名标识的账户。\n\n「正版下载版本」：指经本功能下载并在本地登记的版本，其启动需要正版账户。\n\n「撤回」：指您退出登录或删除本地数据，从而终止本授权并停止相关处理的行为。
en=Appendix 7 Glossary\n\n"Feature": the game download capability available after premium verification.\n\n"Premium account": an account signed in through Microsoft with a recognizable Minecraft ownership status.\n\n"Verification": the process by which PMCL obtains a sign-in token on your device, queries ownership status and decides whether to enable the Feature.\n\n"Local data": account information, tokens, version markers and logs stored in the PMCL data directory on your device.\n\n"Offline account": an account not verified through Microsoft, identified only by a local username.\n\n"Premium-downloaded version": a version downloaded through the Feature and recorded locally, requiring a premium account to launch.\n\n"Withdrawal": signing out or deleting local data, thereby ending this authorization and related processing.
ja=付録7 用語集\n\n「本機能」：正規認証後に利用できるゲーム本体のダウンロード機能。\n\n「正規アカウント」：Microsoft でサインインし、Minecraft の所有権状態が確認できるアカウント。\n\n「認証」：PMCL が端末上でトークンを取得し、所有権状態を照会して本機能の可否を判断する過程。\n\n「ローカルデータ」：端末上の PMCL データディレクトリに保存されるアカウント情報、トークン、バージョンマーカー、ログ。\n\n「オフラインアカウント」：Microsoft 認証を受けず、ローカルのユーザー名のみで識別されるアカウント。\n\n「正規ダウンロード版」：本機能で取得しローカルに記録されたバージョン。起動に正規アカウントを要します。\n\n「撤回」：サインアウトまたはローカルデータ削除により本認証を終了し、関連処理を停止する行為。

consent.disclaimer.body.25
zh=附录八 条款索引与阅读提示\n\n（一）关于您授予我们什么：见《自愿授权协议》第二章、第五章与附录二。\n\n（二）关于我们不做什么：见《自愿授权协议》第三章与《免责协议》第三章。\n\n（三）关于风险：见《免责协议》第十章与附录一。\n\n（四）关于责任限制：见《免责协议》第十二章。\n\n（五）关于如何撤回：见《自愿授权协议》附录一与《免责协议》附录五。\n\n（六）关于数据：见《免责协议》附录一与《自愿授权协议》附录二。\n\n（七）阅读提示：若您对上述任一内容存在疑问，请先不要勾选确认，可通过项目公开渠道咨询后再决定。
en=Appendix 8 Clause Index and Reading Guide\n\n(1) What you authorize: see Chapter 2, Chapter 5 and Appendix 2 of the Voluntary Authorization Agreement.\n\n(2) What we do not do: see Chapter 3 of the Authorization Agreement and Chapter 3 of this Agreement.\n\n(3) Risks: see Chapter 10 and Appendix 1 of this Agreement.\n\n(4) Liability limits: see Chapter 12 of this Agreement.\n\n(5) How to withdraw: see Appendix 1 of the Authorization Agreement and Appendix 5 of this Agreement.\n\n(6) Data: see Appendix 1 of this Agreement and Appendix 2 of the Authorization Agreement.\n\n(7) If anything is unclear, do not tick the box; ask through the project's public channels first.
ja=付録8 条項索引と読み方の案内\n\n(1) 何を許可するか：任意認証契約の第2章・第5章・付録2。\n\n(2) 何をしないか：任意認証契約の第3章と本契約の第3章。\n\n(3) リスク：本契約の第10章と付録1。\n\n(4) 責任の制限：本契約の第12章。\n\n(5) 撤回の方法：任意認証契約の付録1と本契約の付録5。\n\n(6) データ：本契約の付録1と任意認証契約の付録2。\n\n(7) 不明な点がある場合はチェックせず、まず公開窓口でご確認ください。

consent.authorization.body.15
zh=附录三 数据安全措施说明\n\n（一）加密存储：登录令牌使用本地密钥加密后写入数据目录，明文不落盘。\n\n（二）最小化收集：仅处理本功能必需的数据项，不采集设备指纹、位置与行为轨迹。\n\n（三）本地处理：验证与状态查询在您的设备上发起，我们不设中转服务器。\n\n（四）访问限制：数据目录位于当前系统用户的主目录下，其访问权限由操作系统控制。\n\n（五）传输保护：与第三方服务通信使用加密通道，避免明文传输令牌。\n\n（六）故障隔离：下载、验证与启动相互独立，单一环节失败不会导致其他数据损坏。\n\n（七）残余风险：设备丢失、系统被入侵或您主动共享数据目录，仍可能导致数据泄露。
en=Appendix 3 Security Measures\n\n(1) Encryption: tokens are encrypted with a local key before being written; plaintext never touches disk.\n\n(2) Minimisation: only data required by the Feature is processed; no device fingerprinting, location or behavioural tracking.\n\n(3) Local processing: verification and queries originate on your device; we run no relay server.\n\n(4) Access limits: the data directory sits under your system user's home and its permissions are enforced by the OS.\n\n(5) Transit protection: encrypted channels are used with third-party services to avoid sending tokens in plaintext.\n\n(6) Fault isolation: download, verification and launch are independent, so a failure in one does not corrupt the others.\n\n(7) Residual risk: device loss, system compromise or sharing the data directory may still lead to disclosure.
ja=付録3 安全管理措置\n\n(1) 暗号化：トークンはローカル鍵で暗号化してから書き込み、平文はディスクに残しません。\n\n(2) 最小化：本機能に必要なデータのみを処理し、端末指紋、位置、行動履歴の収集は行いません。\n\n(3) ローカル処理：認証と照会は端末上で開始し、中継サーバーを運用しません。\n\n(4) アクセス制限：データディレクトリはシステムユーザーのホーム配下にあり、権限は OS が管理します。\n\n(5) 通信保護：第三者サービスとの通信は暗号化経路を用い、トークンの平文送信を避けます。\n\n(6) 障害の隔離：ダウンロード、認証、起動は独立しており、一つが失敗しても他が破損しません。\n\n(7) 残存リスク：端末の紛失、システムの侵害、データディレクトリの共有により情報が漏えいする可能性があります。

consent.authorization.body.16
zh=附录四 授权范围与流程说明\n\n（一）第一步：您在下载页点击「前往验证正版账户」。\n\n（二）第二步：您完整阅读《免责协议》与《自愿授权协议》，分别滚动至末尾并勾选确认。\n\n（三）第三步：您点击「同意并继续」，本授权生效，并跳转至账号页的微软登录区。\n\n（四）第四步：您完成微软账户登录，PMCL 在本机保存加密令牌并读取所有权状态。\n\n（五）第五步：验证通过后，下载页恢复显示游戏版本列表，并标注「已通过微软正版账户验证」。\n\n（六）第六步：经本功能下载的版本会在本地登记，启动时校验账户类型；非正版账户无法启动该等版本。\n\n（七）撤回：您可随时退出登录，撤回授权并清除本地令牌。
en=Appendix 4 Authorization Flow\n\n(1) You click "Verify a premium account" on the download page.\n\n(2) You read the Disclaimer and the Authorization Agreement, scroll each to the end and tick both boxes.\n\n(3) You click "Agree and continue"; the authorization takes effect and PMCL opens the Microsoft sign-in section.\n\n(4) You complete sign-in; PMCL stores an encrypted token locally and reads the ownership status.\n\n(5) Once verified, the download page shows the version list again with a "verified with a Microsoft account" note.\n\n(6) Versions downloaded through the Feature are recorded locally and checked at launch; non-premium accounts cannot start them.\n\n(7) Withdrawal: sign out at any time to withdraw and clear the local token.
ja=付録4 認証の流れ\n\n(1) ダウンロードページで「正規アカウントを認証する」をクリックします。\n\n(2) 免責契約と任意認証契約を読み、それぞれ最後までスクロールしてチェックします。\n\n(3) 「同意して続行」を押すと認証が発効し、アカウントページの Microsoft サインイン欄へ移動します。\n\n(4) サインインを完了すると、PMCL は暗号化したトークンをローカルに保存し、所有権状態を読み取ります。\n\n(5) 認証後、ダウンロードページにバージョン一覧が再表示され、「Microsoft アカウントで認証済み」と表示されます。\n\n(6) 本機能で取得したバージョンはローカルに記録され、起動時に確認されます。非正規アカウントでは起動できません。\n\n(7) 撤回：いつでもサインアウトして撤回し、ローカルトークンを削除できます。

consent.authorization.body.17
zh=附录五 常见问题\n\n问一：授权后你们能看到我的密码吗？\n答：不能。登录在微软的页面完成，PMCL 只保存加密后的令牌。\n\n问二：令牌会被上传吗？\n答：不会。令牌仅保存在本机，用于维持登录状态与判断所有权。\n\n问三：我可以只授权一次吗？\n答：授权在您退出登录前持续有效；退出后需重新登录并再次确认。\n\n问四：撤回授权会影响已下载的游戏吗？\n答：不会。已下载内容仍在本机，但启动经本功能下载的版本需要正版账户。\n\n问五：我可以把账号借给朋友验证吗？\n答：不可以。授权仅限您本人，出借账号可能触发第三方风控，也不符合本协议。\n\n问六：更换设备后需要重新验证吗？\n答：需要。本地数据不会自动迁移。\n\n问七：你们会因本授权向我收费吗？\n答：不会。本功能免费。\n\n问八：我可以拒绝授权吗？\n答：可以。拒绝仅导致本功能不可用，不影响 PMCL 其他功能。
en=Appendix 5 Frequently Asked Questions\n\nQ1: Can you see my password? No. Sign-in happens on Microsoft's page; PMCL only stores an encrypted token.\n\nQ2: Is the token uploaded? No. It stays on your device to maintain sign-in and check ownership.\n\nQ3: Do I authorize only once? The authorization lasts until you sign out; after that you must sign in and confirm again.\n\nQ4: Does withdrawal affect downloaded games? No. The files remain, but launching versions downloaded through the Feature requires a premium account.\n\nQ5: May I lend my account for verification? No. Authorization is personal; lending may trigger third-party risk controls and breaches this Agreement.\n\nQ6: Must I verify again on a new device? Yes. Local data does not migrate.\n\nQ7: Will you charge me? No, the Feature is free.\n\nQ8: May I refuse? Yes; refusing only makes the Feature unavailable.
ja=付録5 よくある質問\n\n問1：パスワードは見えますか。いいえ。サインインは Microsoft の画面で行われ、PMCL は暗号化トークンのみ保存します。\n\n問2：トークンは送信されますか。いいえ。端末内に留まり、サインイン維持と所有権確認に使われます。\n\n問3：一度だけ認証すればよいですか。サインアウトまで有効です。その後は再サインインと再確認が必要です。\n\n問4：撤回するとダウンロード済みゲームに影響しますか。いいえ。本機能で取得したバージョンの起動には正規アカウントが必要です。\n\n問5：アカウントを貸して認証できますか。いいえ。認証は本人限りで、貸与は第三者リスク管理を誘発し本契約にも反します。\n\n問6：新しい端末では再認証が必要ですか。はい。ローカルデータは移行しません。\n\n問7：料金はかかりますか。いいえ、無償です。\n\n問8：拒否できますか。できます。拒否しても他の機能には影響しません。

consent.disclaimer.body.26
zh=第十七章 个人信息保护\n\n第八十六条（处理原则）我们依合法、正当、必要与诚信原则处理与本功能相关的个人信息，仅处理实现本功能所必需的最小范围。\n\n第八十七条（您的同意）我们通过本协议与《自愿授权协议》取得您的明示同意。您可随时撤回同意，撤回不影响撤回前已进行的处理。\n\n第八十八条（安全措施）我们采取加密存储、最小化收集与本地处理等措施保护您的信息，但无法承诺绝对安全。\n\n第八十九条（不共享）除法律强制规定外，我们不向任何第三方提供您的个人信息。\n\n第九十条（您的权利）您有权查询、更正、删除您的个人信息，也有权要求我们解释处理规则。行使方式见《自愿授权协议》第八章。
en=Chapter 17 Personal Information Protection\n\nArticle 86 (Principles) We process personal information related to the Feature lawfully, fairly, minimally and in good faith, limited to what is necessary.\n\nArticle 87 (Consent) We obtain your explicit consent through this Agreement and the Voluntary Authorization Agreement. You may withdraw at any time without affecting prior processing.\n\nArticle 88 (Security) We use encrypted storage, minimal collection and local processing, but cannot promise absolute security.\n\nArticle 89 (No sharing) Except where legally compelled, we do not provide your personal information to any third party.\n\nArticle 90 (Your rights) You may access, correct and delete your personal information and ask us to explain our processing rules; see Chapter 8 of the Authorization Agreement.
ja=第17章 個人情報の保護\n\n第86条（原則）本機能に関する個人情報を、適法・公正・必要最小限・誠実の原則で処理します。\n\n第87条（同意）本契約と「任意認証契約」により明示的な同意を取得します。いつでも撤回でき、撤回前の処理には影響しません。\n\n第88条（安全管理）暗号化保存、最小化、ローカル処理を行いますが、絶対的な安全は保証できません。\n\n第89条（非共有）法令上の強制がある場合を除き、個人情報を第三者に提供しません。\n\n第90条（権利）個人情報の照会・訂正・削除、処理規則の説明を求めることができます（任意認証契約の第8章参照）。

consent.disclaimer.body.27
zh=附录九 声明与承诺\n\n（一）我们声明：本功能不以营利为目的，不构成对游戏内容的销售、出租或分销。\n\n（二）我们声明：本功能不提供破解、绕过授权或规避付费的能力，其存在以尊重游戏权利方的权利为前提。\n\n（三）我们承诺：不将您的账号数据用于本功能以外的目的，不向第三方出售或交换您的数据。\n\n（四）我们承诺：在政策或法律要求变化时，优先选择收紧本功能，而非降低验证标准。\n\n（五）我们提示：本协议不能替代您所在地区的法律意见；如您对合规性存有疑问，请咨询专业人士。\n\n（六）我们保留：在不违反法律的前提下，对本功能的开放范围、验证方式与地区适用作出调整的权利。
en=Appendix 9 Statements and Undertakings\n\n(1) We state that the Feature is not for profit and does not constitute sale, rental or distribution of game content.\n\n(2) We state that the Feature offers no cracking, authorization bypass or payment evasion, and exists on the premise of respecting the rights holder's rights.\n\n(3) We undertake not to use your account data for purposes beyond the Feature or to sell or exchange it with third parties.\n\n(4) We undertake, when law or policy changes, to prefer tightening the Feature over lowering verification standards.\n\n(5) We note that this Agreement is not a substitute for legal advice in your region; consult a professional if in doubt.\n\n(6) We reserve the right to adjust the availability, verification method and regional applicability of the Feature, subject to applicable law.
ja=付録9 声明と約束\n\n(1) 本機能は営利目的ではなく、ゲーム内容の販売・貸与・配布を構成しません。\n\n(2) 本機能はクラック・認証回避・支払い回避の手段を提供せず、権利者の権利を尊重することを前提とします。\n\n(3) アカウントデータを本機能以外の目的に使用せず、第三者への販売・交換も行いません。\n\n(4) 法令や政策が変わった場合、認証基準を下げるのではなく本機能を厳格化することを優先します。\n\n(5) 本契約は地域の法的助言に代わるものではありません。疑義がある場合は専門家にご相談ください。\n\n(6) 適用法の範囲内で、本機能の提供範囲・認証方法・地域適用を調整する権利を留保します。

consent.authorization.body.18
zh=附录六 不同场景下的授权状态\n\n（一）家庭共享设备（多系统用户）：各系统用户的数据目录相互独立，授权互不影响。\n\n（二）多人共用同一系统账户：登录状态为共用，后登录者会覆盖先前的令牌；请避免在公共环境使用本功能。\n\n（三）重装操作系统：本地数据目录若被格式化则授权与令牌一并清除，需重新登录验证。\n\n（四）更换设备：本地数据不迁移，需在新设备上重新授权并登录。\n\n（五）使用便携版或绿色版：数据随目录移动，若目录被复制到其他设备，登录状态与版本标记会一并被复制，请谨慎处理。\n\n（六）企业统一管理环境：若设备由组织统一管理，组织可能具备访问该设备数据的能力，请事先确认。\n\n（七）同时登录多个启动器：其他启动器可能刷新同一账户的令牌，导致本地令牌失效，需重新登录。
en=Appendix 6 Authorization States in Different Scenarios\n\n(1) Shared family device with multiple OS users: data directories are independent and authorizations do not affect each other.\n\n(2) Multiple people on one OS user: sign-in state is shared and the latest sign-in replaces earlier tokens; avoid the Feature on public setups.\n\n(3) OS reinstall: if the data directory is formatted, authorization and tokens are cleared and verification is required again.\n\n(4) New device: local data is not migrated; authorize and sign in again.\n\n(5) Portable builds: data moves with the directory; copying it to another device copies sign-in state and markers, so handle with care.\n\n(6) Organisational management: if the device is managed, the organisation may access its data; confirm beforehand.\n\n(7) Multiple launchers: another launcher may refresh the same account's token and invalidate yours, requiring sign-in again.
ja=付録6 シナリオ別の認証状態\n\n(1) 家庭の共用端末（複数 OS ユーザー）：データディレクトリは独立し、認証同士は影響しません。\n\n(2) 1 つの OS ユーザーを複数人で使用：サインイン状態は共有され、後からサインインした人がトークンを上書きします。公共環境では避けてください。\n\n(3) OS の再インストール：データディレクトリが初期化されると認証とトークンも消去され、再認証が必要です。\n\n(4) 端末の変更：ローカルデータは移行されず、再度認証とサインインが必要です。\n\n(5) ポータブル版：データはディレクトリと共に移動し、他の端末へコピーするとサインイン状態とマーカーも複製されます。取扱いにご注意ください。\n\n(6) 組織管理の端末：組織がデータにアクセスできる場合があります。事前にご確認ください。\n\n(7) 複数ランチャーの併用：他のランチャーが同じアカウントのトークンを更新し、ローカルのトークンが失効する場合があります。

consent.authorization.body.19
zh=附录七 撤回授权后的状态对照\n\n（一）退出登录后：本地令牌被清除；本功能立即不可用；已下载版本仍在本地；启动该等版本需重新登录正版账户。\n\n（二）删除账户条目后：账户标识与用户名被清除；版本标记保留；界面不再显示该账户。\n\n（三）删除版本后：对应版本文件与标记一并移除；重新下载时需再次验证。\n\n（四）卸载并清除数据目录后：全部本地数据被清除；重新安装后需重新授权与验证。\n\n（五）仅删除令牌但保留版本标记：本功能不可用，但版本标记仍会在您下次登录后继续生效。\n\n（六）撤回不影响：已完成的下载、已安装的版本、您自行备份的存档与配置。
en=Appendix 7 State After Withdrawal\n\n(1) After sign-out: token cleared; Feature unavailable immediately; downloaded versions remain; launching them requires signing in with a premium account.\n\n(2) After removing the account entry: identifier and username cleared; version markers remain; the account is no longer shown.\n\n(3) After deleting a version: its files and marker are removed; downloading again requires verification.\n\n(4) After uninstalling and clearing the data directory: all local data is cleared; authorization and verification are required after reinstallation.\n\n(5) Deleting only the token: the Feature is unavailable, but markers remain effective after your next sign-in.\n\n(6) Unaffected by withdrawal: completed downloads, installed versions and your own backups of worlds and settings.
ja=付録7 撤回後の状態\n\n(1) サインアウト後：トークン削除、本機能は即時利用不可、ダウンロード済みバージョンは残存、起動には再サインインが必要。\n\n(2) アカウント項目の削除後：識別子とユーザー名を削除、バージョンマーカーは残存、画面に表示されなくなります。\n\n(3) バージョン削除後：ファイルとマーカーを削除、再ダウンロードには再認証が必要。\n\n(4) アンインストールとデータディレクトリ削除後：ローカルデータをすべて消去、再インストール後に再認証が必要。\n\n(5) トークンのみ削除：本機能は利用不可ですが、マーカーは次回サインイン後も有効です。\n\n(6) 撤回の影響を受けないもの：完了したダウンロード、インストール済みバージョン、ご自身で作成したバックアップ。

consent.disclaimer.body.28
zh=附录十 使用场景与边界说明\n\n（一）家庭共用设备。同一台电脑上的不同系统用户可分别登录各自的正版账户；不得在同一系统用户下反复切换他人账号以规避限制。\n\n（二）学校或机房环境。公共设备上的登录状态可能被他人使用，请在使用完毕后退出登录，避免账号风险与授权争议。\n\n（三）代为操作。您可协助他人完成其本人账号的登录，但不得以他人账号为您自己下载，也不得代他人完成验证并交付结果。\n\n（四）迁移设备。更换设备后需重新登录；本地版本标记不会随之迁移，新设备上的下载将重新登记。\n\n（五）企业或组织环境。若您在组织设备上使用本功能，应同时遵守该组织的设备与网络使用规定。\n\n（六）公开演示。在直播、录屏或公开演示中使用本功能时，请避免展示账号信息与令牌内容。\n\n（七）内容创作。您可录制使用本功能的过程，但不得将本功能包装为规避授权的工具进行推广。\n\n（八）跨境使用。若您在不同地区间移动，验证结果可能随网络归属变化而重新判定，本功能可能随之不可用。
en=Appendix 10 Scenarios and Boundaries\n\n(1) Shared family device: different OS users may sign in with their own premium accounts; do not repeatedly switch accounts under one OS user to evade limits.\n\n(2) School or lab devices: sign-in state may be used by others; sign out when finished to avoid account risk and disputes.\n\n(3) Helping others: you may assist someone in signing in with their own account, but may not download for yourself using their account or verify on their behalf and hand over the result.\n\n(4) Moving devices: sign in again; version markers do not migrate, and downloads on the new device are recorded afresh.\n\n(5) Organisational devices: also comply with your organisation's device and network policies.\n\n(6) Public demonstration: avoid showing account information or tokens when streaming, recording or presenting.\n\n(7) Content creation: you may record your use of the Feature, but may not promote it as a tool for bypassing authorization.\n\n(8) Cross-region use: verification may be re-evaluated as your network origin changes, and the Feature may become unavailable.
ja=付録10 利用シナリオと境界\n\n(1) 家庭の共用端末：OS ユーザーごとにデータは独立し、各自の正規アカウントでサインインできます。同一ユーザーで頻繁に切り替えて制限を回避しないでください。\n\n(2) 学校・実習室：サインイン状態が他人に使われる可能性があるため、利用後はサインアウトしてください。\n\n(3) 代理操作：本人のアカウントでのサインインを手伝うことはできますが、他人のアカウントで自分のために取得したり、代理認証して結果を渡すことはできません。\n\n(4) 端末の移行：再サインインが必要です。マーカーは移行せず、新端末で再記録されます。\n\n(5) 組織の端末：組織の端末・ネットワーク規定にも従ってください。\n\n(6) 公開デモ：配信・録画・演示ではアカウント情報やトークンを表示しないでください。\n\n(7) コンテンツ制作：利用過程の録画は可能ですが、認証回避の道具として宣伝してはなりません。\n\n(8) 越境利用：接続元の変化により認証が再判定され、本機能が利用できなくなることがあります。

consent.disclaimer.body.29
zh=附录十一 通知、反馈与联系方式\n\n（一）通知渠道。我们通过 PMCL 启动器内公告、项目代码仓库的 Release 说明与文档更新向您发布与本功能相关的通知。\n\n（二）反馈渠道。您可通过项目代码仓库的 Issue、讨论区或文档中列明的其他公开渠道提交问题与建议。\n\n（三）答复期限。我们将在合理期限内答复您的问题；涉及复杂技术或法律问题的，答复时间可能延长。\n\n（四）紧急情况。若您发现安全漏洞或数据泄露风险，请优先通过项目公开渠道标注「安全」字样提交，我们将优先处理。\n\n（五）语言。反馈可使用简体中文、繁体中文、英文或日文；其他语言可能无法及时处理。\n\n（六）非承诺。上述渠道为志愿维护，我们不承诺固定的响应时间或必然的解决方案。
en=Appendix 11 Notices, Feedback and Contact\n\n(1) Channels: we publish Feature-related notices through in-app announcements, release notes and documentation updates.\n\n(2) Feedback: submit issues and suggestions via the code repository's issues, discussions or other public channels listed in the documentation.\n\n(3) Response time: we reply within a reasonable period; complex technical or legal questions may take longer.\n\n(4) Security: if you find a vulnerability or data-leak risk, submit it with a "security" label through public channels and we will prioritise it.\n\n(5) Languages: feedback may be in Simplified or Traditional Chinese, English or Japanese; other languages may not be handled promptly.\n\n(6) No guarantee: these channels are maintained by volunteers; we do not promise fixed response times or that every issue will be resolved.
ja=付録11 通知・フィードバック・連絡先\n\n(1) 通知経路：アプリ内のお知らせ、リリースノート、文書の更新で本機能に関する通知を行います。\n\n(2) フィードバック：リポジトリの Issue、ディスカッション、文書に記載の公開窓口からご連絡ください。\n\n(3) 回答期限：合理的な期間内に回答します。技術的・法的に複雑な場合は時間を要することがあります。\n\n(4) 緊急時：脆弱性や情報漏えいのリスクを発見した場合は「security」と明記して公開窓口へご連絡ください。優先的に扱います。\n\n(5) 言語：簡体字・繁体字中国語、英語、日本語に対応します。他の言語は遅れる場合があります。\n\n(6) 非保証：窓口は有志で運営されており、固定の回答時間や解決を約束するものではありません。

consent.authorization.body.20
zh=附录八 授权与免责的关系\n\n（一）分工。《自愿授权协议》解决「您允许我们做什么」，界定授权范围、数据项与撤回方式；《免责协议》解决「做这些事可能带来什么后果」，界定风险、免责与责任限制。\n\n（二）共同生效。两份协议须同时接受，任一未被接受的，本功能不予开放。\n\n（三）违反的后果。违反授权范围（如超范围处理）与违反免责约定（如滥用本功能）分别构成违约，我们有权据此中止或终止本功能。\n\n（四）冲突处理。两份协议就同一事项表述不一致时，授权与数据处理事项以本协议为准，风险与责任事项以《免责协议》为准。\n\n（五）终止后的存续。授权终止后，责任限制与争议解决条款仍然有效，以覆盖终止前已经发生的行为。\n\n（六）阅读建议。建议先阅读本协议的第二章与第五章，明确授权范围与数据项；再阅读《免责协议》第十章的的风险揭示，最后确认是否接受。
en=Appendix 8 How the Two Agreements Relate\n\n(1) Division of labour: the Authorization Agreement defines what you permit; the Disclaimer defines the consequences, risk and liability limits.\n\n(2) Joint effect: both must be accepted; if either is not, the Feature is unavailable.\n\n(3) Breach: exceeding the authorization scope and misusing the Feature each constitute breach, entitling us to suspend or terminate.\n\n(4) Conflicts: for authorization and data processing this Agreement prevails; for risk and liability the Disclaimer prevails.\n\n(5) Survival: after termination, liability and dispute provisions remain effective to cover acts before termination.\n\n(6) Reading order: start with Chapters 2 and 5 here to understand scope and data items, then Chapter 10 of the Disclaimer on risk, and finally decide.
ja=付録8 2つの契約の関係\n\n(1) 役割分担：任意認証契約は「何を許可するか」、免責契約は「その結果とリスク、責任の制限」を定めます。\n\n(2) 同時発効：両方の承諾が必要で、一方でも欠けると本機能は利用できません。\n\n(3) 違反の結果：認証範囲の逸脱と本機能の濫用はいずれも契約違反となり、中止・終了の根拠となります。\n\n(4) 矛盾時：認証とデータ処理は本契約、リスクと責任は免責契約が優先します。\n\n(5) 終了後の存続：責任制限と紛争解決の条項は、終了前の行為を対象として存続します。\n\n(6) 読み方：まず本契約の第2章と第5章で範囲とデータ項目を確認し、次に免責契約の第10章のリスクを読み、最後に承諾をご判断ください。

consent.disclaimer.body.30
zh=附录十二 常见误解澄清\n\n（一）误解：验证通过就等于获得了官方授权。澄清：验证仅用于判断本功能是否向您开放，不改变游戏权利方的授权范围。\n\n（二）误解：PMCL 与游戏权利方存在合作。澄清：双方不存在代理、经销或合作关系，PMCL 不是官方产品。\n\n（三）误解：本功能属于破解或盗版工具。澄清：本功能不绕过付费、不伪造授权、不修改游戏验证逻辑，其前提正是用户已拥有该游戏。\n\n（四）误解：离线账户也能启动经本功能下载的版本。澄清：不能。这是本功能开放下载的交换条件，也是启动校验的核心目的。\n\n（五）误解：本协议只是形式，没有约束力。澄清：本协议构成您与我们之间的约定，在适用法律允许的范围内具有约束力。\n\n（六）误解：我的数据会被上传到你们的服务器。澄清：我们不存在用于存储账号数据的服务器，令牌与标记均保存在本机。\n\n（七）误解：更换设备后无需重新验证。澄清：本地数据不会自动迁移，新设备需要重新登录。\n\n（八）误解：政策变化与我无关。澄清：政策变化可能导致本功能调整或停止，进而影响您后续的下载。
en=Appendix 12 Common Misunderstandings\n\n(1) "Verification means official licensing." No: it only determines availability of the Feature.\n\n(2) "PMCL partners with the rights holder." No: there is no agency, distribution or partnership, and PMCL is not official.\n\n(3) "This is a cracking or piracy tool." No: it bypasses no payment, forges no authorization and modifies no verification logic; its premise is genuine ownership.\n\n(4) "Offline accounts can launch downloaded versions." No: that is the core launch check, and the condition of the download exception.\n\n(5) "The Agreement is a mere formality." No: it is binding to the extent permitted by law.\n\n(6) "My data is uploaded to your servers." No: we operate no server for storing account data; tokens and markers stay local.\n\n(7) "A new device needs no verification." No: local data does not migrate.\n\n(8) "Policy changes do not affect me." They may: the Feature could be adjusted or stopped, affecting further downloads.
ja=付録12 よくある誤解の整理\n\n(1) 「認証通過＝公式許諾」：いいえ。本機能の可否を判断するだけです。\n\n(2) 「PMCL は権利者と提携している」：いいえ。代理・販売・提携関係はなく、公式製品でもありません。\n\n(3) 「クラック・海賊版ツール」：いいえ。支払い回避・許諾偽造・検証改変は行わず、前提は正当な所有です。\n\n(4) 「オフラインでも起動できる」：いいえ。それが起動時確認の核心であり、ダウンロード例外の条件です。\n\n(5) 「契約は形式だけ」：いいえ。適用法の範囲内で拘束力を持ちます。\n\n(6) 「データはサーバーに送信される」：いいえ。アカウントデータを保存するサーバーはなく、端末内に留まります。\n\n(7) 「端末を変えても再認証不要」：いいえ。ローカルデータは移行しません。\n\n(8) 「政策変更は自分に関係ない」：関係し得ます。本機能の調整・停止により以後の取得に影響します。

consent.authorization.body.21
zh=附录九 本协议的版本与更新\n\n（一）版本标识。本协议随应用版本一同发布，您可在应用内查看到当前生效的协议内容与更新日期。\n\n（二）更新原因。协议更新通常源于法律或监管要求变化、功能调整、数据处理方式变化或表述澄清。\n\n（三）更新后的确认。协议更新后，您需要在下次使用本功能前重新阅读并确认；未确认的，本功能暂不开放。\n\n（四）历史版本的效力。您在旧版本协议下已完成的授权行为，仍按当时版本认定；但后续处理以新版本为准。\n\n（五）不同意更新。您不同意更新内容的，可停止使用本功能并退出登录，这不影响您使用 PMCL 的其他功能。\n\n（六）语言同步。协议的中文版本更新后，其他语言译本将尽快同步；译本滞后期间以中文版本为准。
en=Appendix 9 Versions and Updates of This Agreement\n\n(1) Versioning: this Agreement is released with the application; the version in force and its update date are visible in the app.\n\n(2) Reasons: updates usually follow legal or regulatory changes, functional changes, changes in processing or clarifications.\n\n(3) Reconfirmation: after an update you must read and confirm before your next use; otherwise the Feature stays unavailable.\n\n(4) Prior versions: acts completed under an earlier version are judged by that version, while subsequent processing follows the new one.\n\n(5) Disagreement: you may stop using the Feature and sign out, without affecting other PMCL features.\n\n(6) Language sync: translations follow the Chinese update as soon as practicable; until then the Chinese version prevails.
ja=付録9 本契約の版と更新\n\n(1) 版の表示：本契約はアプリと共に公開され、有効な版と更新日をアプリ内で確認できます。\n\n(2) 更新の理由：法令・規制の変化、機能変更、処理方法の変更、表現の明確化などです。\n\n(3) 再確認：更新後は次回利用前に再確認が必要で、未確認の場合本機能は利用できません。\n\n(4) 旧版の効力：旧版の下で完了した行為は当時の版で判断し、以後の処理は新版に従います。\n\n(5) 更新に同意しない場合：利用を中止しサインアウトできます。他の機能には影響しません。\n\n(6) 言語の同期：中国語版の更新後、翻訳は可能な限り速やかに追従し、追従まで中国語版が優先します。

consent.disclaimer.body.31
zh=附录十三 地区政策变化时的应对\n\n（一）政策收紧。若相关法律法规或监管要求收紧，我们可能立即暂停本功能的新下载，并保留已安装内容的使用。届时您将无法再通过本功能获取新的游戏版本。\n\n（二）政策放宽。若限制解除，我们可能恢复常规下载流程，本功能及其验证步骤可能随之取消，相关入口将被移除。\n\n（三）验证服务中断。若第三方账户服务或所有权查询接口不可用，本功能将暂时不可用；您可稍后重试，或改用游戏权利方提供的官方渠道。\n\n（四）账号状态异常。若您的账户被限制或要求额外验证，请先通过游戏权利方渠道解决，再回到 PMCL 重新登录。\n\n（五）替代方案。您可随时改用游戏权利方提供的官方启动器或授权渠道获取游戏，本协议不限制您选择其他工具。\n\n（六）通知义务。在可行范围内，我们会通过公告说明本功能的调整原因与影响范围；但紧急情况下可能先行调整、后补说明。
en=Appendix 13 Responding to Regional Policy Changes\n\n(1) Tightening: we may immediately suspend new downloads while keeping installed content usable; you will not be able to obtain new versions through the Feature.\n\n(2) Relaxation: if restrictions are lifted we may restore the normal download flow and remove the Feature and its verification steps.\n\n(3) Verification outages: if third-party sign-in or ownership services are unavailable, the Feature is temporarily unavailable; retry later or use official channels.\n\n(4) Abnormal account status: resolve it through the rights holder first, then sign in again in PMCL.\n\n(5) Alternatives: you may use the rights holder's official launcher or authorized channels at any time; this Agreement does not restrict your choice of tools.\n\n(6) Notice: where feasible we explain adjustments and their impact through announcements, though urgent cases may be adjusted first and explained later.
ja=付録13 地域政策が変化した場合の対応\n\n(1) 規制強化：新規ダウンロードを直ちに停止し、インストール済みの利用は維持することがあります。以後、本機能で新しいバージョンを取得できません。\n\n(2) 規制緩和：制限が解除された場合、通常のダウンロード手順に戻し、本機能と認証手順を廃止することがあります。\n\n(3) 認証サービスの障害：第三者のサインインや所有権照会が利用できない場合、本機能は一時的に利用できません。後で再試行するか公式窓口をご利用ください。\n\n(4) アカウント状態の異常：まず権利者の窓口で解決し、その後 PMCL で再サインインしてください。\n\n(5) 代替手段：権利者の公式ランチャーや正規チャネルをいつでも利用できます。本契約は他のツールの選択を制限しません。\n\n(6) 通知：可能な範囲で調整理由と影響を告知しますが、緊急時は先に調整し後から説明することがあります。

consent.disclaimer.body.32
zh=附录十四 签署确认与存档说明\n\n（一）电子签署的效力。您通过勾选确认框并点击「同意并继续」作出的意思表示，与书面签署具有同等效力，可作为您接受本协议的证据。\n\n（二）确认记录的保存。本功能会记录您作出确认的时间与协议版本，仅保存在本机，用于判断是否需要向您重新征求同意。\n\n（三）如何获取协议副本。您可在本弹窗中随时阅读协议全文；如需留存，可通过系统截图或复制文本的方式自行保存。\n\n（四）文本归档。协议的历史版本随应用版本一同保留在项目仓库中，您可查阅任一历史版本的具体表述。\n\n（五）举证说明。若双方就协议内容或确认行为发生争议，本机保存的确认记录、协议版本号与发布记录可作为参考依据。\n\n（六）建议做法。若您对条款有疑问，建议在确认前截图保存并在咨询专业人士后再作决定。
en=Appendix 14 Signing and Archiving\n\n(1) Electronic signature: ticking the box and clicking "Agree and continue" has the same effect as a written signature and may serve as evidence of acceptance.\n\n(2) Confirmation record: the time and version of your confirmation are recorded locally solely to decide whether consent must be sought again.\n\n(3) Obtaining a copy: you may read the full text in this dialog at any time and keep a copy by screenshot or copying the text.\n\n(4) Archives: historical versions remain in the project repository so you can review any prior wording.\n\n(5) Evidence: in a dispute over content or confirmation, the local confirmation record, version number and release record may serve as reference.\n\n(6) Recommendation: if you have doubts, keep a screenshot and consult a professional before confirming.
ja=付録14 署名確認と保管\n\n(1) 電子署名の効力：チェックして「同意して続行」を押す意思表示は書面署名と同等の効力を持ち、承諾の証拠となり得ます。\n\n(2) 確認記録：確認時刻と契約バージョンを端末内に記録し、再同意が必要かの判断にのみ使用します。\n\n(3) 写しの取得：ダイアログ内でいつでも全文を閲覧でき、スクリーンショットやコピーで保存できます。\n\n(4) アーカイブ：過去の版はリポジトリに保存され、当時の文言を確認できます。\n\n(5) 証拠：内容や確認行為に争いがある場合、確認記録・バージョン番号・リリース記録が参考となります。\n\n(6) 推奨：疑義がある場合は確認前にスクリーンショットを保存し、専門家にご相談ください。

consent.authorization.body.22
zh=附录十 支持与争议处理\n\n（一）支持渠道。您可通过项目代码仓库的 Issue、讨论区或文档中列明的公开渠道获取帮助。\n\n（二）技术问题。涉及登录失败、令牌失效或下载异常的问题，请提供 PMCL 版本号、系统版本与复现步骤，我们将在合理期限内答复。\n\n（三）协议争议。若您对本协议的表述、适用范围或处理方式存在异议，请先通过公开渠道沟通，我们会在可行范围内解释或调整。\n\n（四）账号争议。涉及账号权属、封禁或所有权认定的争议，请直接联系游戏权利方的支持渠道，我们无权代为处理。\n\n（五）响应说明。上述渠道由志愿者维护，我们不承诺固定响应时间；紧急安全问题将优先处理。\n\n（六）争议解决。协商不成的，依本协议第五十八条提交有管辖权的人民法院处理。\n\n（七）记录保留。为便于处理争议，建议您保留与我们的沟通记录、协议确认时间与相关版本号；我们亦会在合理期限内保留必要的往来记录。\n\n（八）善意沟通。请以善意、真实、完整的方式提出诉求；对于明显虚假、重复或恶意的提交，我们可能不再逐一答复。
en=Appendix 10 Support and Dispute Channels\n\n(1) Support: get help through the project repository's issues, discussions or other public channels listed in the documentation.\n\n(2) Technical issues: for sign-in failures, token expiry or download errors, provide the PMCL version, OS version and reproduction steps.\n\n(3) Agreement disputes: if you object to the wording, scope or processing, contact us publicly first; we will explain or adjust where feasible.\n\n(4) Account disputes: ownership, suspension or entitlement disputes should go to the rights holder's support; we cannot handle them.\n\n(5) Response: channels are volunteer-maintained and response times are not fixed; urgent security issues are prioritised.\n\n(6) Disputes: failing negotiation, matters are submitted to a competent court under Article 58.
ja=付録10 サポートと紛争の窓口\n\n(1) サポート：リポジトリの Issue、ディスカッション、文書記載の公開窓口をご利用ください。\n\n(2) 技術的な問題：サインイン失敗、トークン失効、ダウンロード異常の場合は、PMCL の版、OS の版、再現手順をお知らせください。\n\n(3) 契約に関する異議：表現・範囲・処理方法に異議がある場合は、まず公開窓口へご連絡ください。可能な範囲で説明または調整します。\n\n(4) アカウント紛争：帰属・停止・所有権の認定は権利者のサポートへご連絡ください。当方は代理できません。\n\n(5) 回答について：窓口は有志運営で、固定の回答時間は約束しません。緊急の安全問題を優先します。\n\n(6) 紛争解決：協議が整わない場合は第58条に従い管轄裁判所へ提訴します。

consent.disclaimer.body.33
zh=结语\n\n本协议与《自愿授权协议》的条款较为详尽，是因为本功能涉及第三方账号、地区政策与游戏内容的权利边界。我们不希望以冗长掩盖风险，而是希望您在充分知情的前提下作出决定。\n\n若您没有时间阅读全文，请至少确认三件事：第一，经本功能下载的版本只能使用正版账户启动；第二，您的登录令牌只保存在本机，不会上传；第三，您可以随时退出登录以撤回授权。\n\n若您无法接受上述任一条款，请关闭本弹窗，继续使用 PMCL 的其他功能，或改用游戏权利方提供的官方渠道。感谢您的耐心阅读。
en=Closing\n\nThis Agreement and the Voluntary Authorization Agreement are detailed because the Feature touches third-party accounts, regional policy and the rights boundary of game content. We do not intend to hide risk behind length; we want you to decide with full knowledge.\n\nIf you have no time to read everything, confirm at least three points: first, versions downloaded through the Feature can only be launched with a premium account; second, your sign-in token stays on your device and is never uploaded; third, you may sign out at any time to withdraw authorization.\n\nIf you cannot accept any of these terms, close this dialog and keep using other PMCL features, or use the rights holder's official channels. Thank you for reading.
ja=結び\n\n本契約と「任意認証契約」が詳細であるのは、本機能が第三者のアカウント、地域政策、ゲーム内容の権利境界に関わるためです。長さでリスクを覆い隠す意図はなく、十分な理解のもとでご判断いただきたいと考えています。\n\n全文を読む時間がない場合でも、次の三点はご確認ください。第一に、本機能で取得したバージョンは正規アカウントでのみ起動できます。第二に、サインイントークンは端末内にのみ保存され、送信されません。第三に、いつでもサインアウトして認証を撤回できます。\n\nいずれかの条項を受け入れられない場合は、このダイアログを閉じ、他の機能または権利者の公式窓口をご利用ください。お読みいただきありがとうございます。

consent.disclaimer.body.34
zh=第十八章 服务的变更、升级与维护\n\n第八十六条（变更的权利）我们可能因功能迭代、安全修补、第三方接口调整或合规要求，对本功能的界面、流程、可用范围与验证方式作出变更。变更可能影响您既有的使用习惯，但不改变已完成下载的本地存在。\n\n第八十七条（升级的必要性）为修复缺陷或满足合规要求，部分升级可能是强制的：未完成升级的客户端可能无法继续使用本功能。我们会在可行范围内提前告知升级原因与影响。\n\n第八十八条（维护窗口）我们可能在不预先通知的情况下进行维护或紧急修补。维护期间本功能可能中断，我们不因此承担违约责任。\n\n第八十九条（功能下线）若某项能力因第三方停止提供、成本不可持续或合规风险而无法维持，我们可将其下线。下线后相关入口将被移除，但已经完成的下载与安装不受影响。\n\n第九十条（兼容性）我们不保证本功能与所有操作系统版本、Java 运行时、安全软件、虚拟化环境或系统级代理配置兼容。因环境不兼容导致的问题，您可通过调整环境或改用官方渠道解决。\n\n第九十一条（数据格式变更）本功能可能在升级时改变本地数据的存储格式。升级过程通常会迁移旧数据；若迁移失败，您可能需要重新登录并重新验证。
en=Chapter 18 Changes, Upgrades and Maintenance\n\nWe may change the Feature's interface, flow, availability and verification method for iteration, security, third-party API changes or compliance. Some upgrades may be mandatory. Maintenance may interrupt the Feature without liability. Discontinued capabilities are removed, but completed downloads and installations are unaffected. We do not guarantee compatibility with every OS, Java runtime, security product or proxy configuration. Local data formats may change on upgrade and may require signing in again.
ja=第18章 変更・アップグレード・保守\n\n機能改善、セキュリティ、第三者 API の変更、コンプライアンス対応により、画面・手順・提供範囲・認証方法を変更することがあります。必須のアップグレードや、予告なしの保守中断があり得ます。提供終了となる機能は削除されますが、完了済みのダウンロードとインストールには影響しません。すべての OS・Java・セキュリティ製品・プロキシ構成との互換性は保証しません。

consent.disclaimer.body.35
zh=第十九章 插件、扩展与第三方集成\n\n第九十二条（插件的独立性）PMCL 支持通过插件扩展功能。插件由第三方开发者提供，其行为、内容与安全性不由我们控制；您安装插件属于自主决定。\n\n第九十三条（插件可能触及本功能）插件可能通过公开接口触发安装、启动或验证流程。无论是否经过插件，启动经本功能下载的版本都必须使用正版账户；该限制在核心层实施，插件无法绕过。\n\n第九十四条（插件的合规责任）若插件试图规避地区限制、伪造验证结果或批量代验证，我们有权停用相关插件并向您提示风险。由此产生的后果由插件作者与使用者承担。\n\n第九十五条（第三方集成）本功能可能与第三方服务集成（如账户服务、内容分发）。该等集成不构成我们对第三方服务的背书，第三方服务的条款与政策独立适用。\n\n第九十六条（插件数据）插件可能读取本地数据或发起网络请求。请在安装前确认插件的来源与权限；因插件导致的数据泄露或账号风险，我们不承担直接责任。\n\n第九十七条（不建议的组合）我们不建议将本功能与来源不明的插件、修改版客户端或系统级注入工具同时使用。该等组合可能导致验证异常或账号风控。
en=Chapter 19 Plugins, Extensions and Integrations\n\nPlugins are third-party software; we do not control their behaviour, content or security, and installing them is your decision. Plugins may trigger install, launch or verification through public APIs, but the premium-account launch check is enforced in the core and cannot be bypassed by a plugin. We may disable plugins that attempt to evade regional limits, forge verification or verify in bulk. Third-party integrations do not constitute endorsement, and their terms apply independently.
ja=第19章 プラグイン・拡張・第三者連携\n\nプラグインは第三者が提供するもので、動作・内容・安全性は当方が管理せず、導入はご自身の判断です。プラグインが公開 API 経由でインストール・起動・認証を呼び出すことはありますが、正規アカウントでの起動確認はコアで実施され、プラグインでは回避できません。地域制限の回避・認証の偽造・代理一括認証を試みるプラグインは無効化することがあります。

consent.disclaimer.body.36
zh=第二十章 用户支持与申诉程序\n\n第九十八条（支持范围）我们为与本功能相关的技术问题提供支持，包括验证失败、下载异常、启动校验提示等；不提供账号找回、封禁申诉与购买咨询。\n\n第九十九条（提交材料）提交问题时，请提供 PMCL 版本号、操作系统与 Java 版本、问题发生时间、复现步骤以及必要的日志片段。信息不完整可能导致无法定位。\n\n第一百条（申诉流程）若您认为本功能对您的限制有误（例如您确有所有权却被判定为未验证），可通过公开渠道提交申诉并附上必要说明。我们会在合理期限内核查。\n\n第一百零一条（处理结果）核查结果可能为：维持现状、调整本地记录、提示您重新验证，或在无法核实的情况下建议您联系游戏权利方。我们不保证申诉必然得到有利结果。\n\n第一百零二条（滥用申诉）对明显虚假、重复或恶意的申诉，我们有权不再逐一答复，并保留限制相关设备使用本功能的权利。\n\n第一百零三条（响应时间）支持与申诉由志愿者维护，响应时间不固定；涉及安全的问题优先处理。
en=Chapter 20 Support and Appeals\n\nWe support technical issues with the Feature, such as verification failures, download errors and launch-check prompts; we do not handle account recovery, suspensions or purchase questions. Provide the PMCL version, OS and Java versions, timing, reproduction steps and relevant logs. If you believe a restriction is mistaken, submit an appeal with the necessary explanation; outcomes may uphold, adjust local records, request re-verification, or refer you to the rights holder. Abuse of appeals may lead to restricted access.
ja=第20章 サポートと異議申立て\n\n本機能の技術的問題（認証失敗、ダウンロード異常、起動時の確認表示など）を支援します。アカウント復旧・停止申立て・購入相談は対象外です。PMCL の版、OS と Java の版、発生日時、再現手順、関連ログをご提供ください。制限が誤りだと考える場合は公開窓口へ異議を申し立ててください。結果は維持・記録の調整・再認証の依頼・権利者への照会のいずれかとなり、有利な結果を保証するものではありません。

consent.disclaimer.body.37
zh=第二十一章 记录保存与审计\n\n第一百零四条（本地记录）本功能在本地保存协议确认时间、协议版本、正版下载版本标记与必要的运行日志。该等记录用于判断是否需要重新征求同意，以及在启动时校验账户类型。\n\n第一百零五条（保存期限）协议确认记录保存至您卸载 PMCL 或清除数据目录；版本标记保存至相应版本被删除。我们不设远程副本，因此不存在"服务端留痕"。\n\n第一百零六条（审计的边界）我们不会对您的本地使用行为进行远程审计、屏幕采集或行为分析。若您主动提交日志，该日志仅用于排查您所报告的问题。\n\n第一百零七条（法律要求）若司法机关或监管机构依法要求提供信息，我们将在法律允许的范围内配合；由于我们不集中保存账号数据，能够提供的内容通常限于公开的项目记录。\n\n第一百零八条（记录准确性）本地记录可能因系统时间错误、数据损坏或人为修改而不准确。我们不保证该等记录在争议中必然被采信，但可作为参考。\n\n第一百零九条（您自己的留存）建议您自行留存协议确认的截图、版本号与沟通记录，以便在需要时说明当时的情况。
en=Chapter 21 Records and Auditing\n\nWe store locally the time and version of your consent, premium-download markers and necessary runtime logs, used to decide whether consent must be renewed and to check account type at launch. Records persist until uninstall or deletion of the version. We do not perform remote auditing, screen capture or behavioural analysis, and we keep no server-side copies. Local records may be inaccurate due to clock errors, corruption or tampering and are not guaranteed to be conclusive in a dispute.
ja=第21章 記録の保存と監査\n\n同意の時刻と版、正規ダウンロードのマーカー、必要な実行ログを端末内に保存し、再同意の要否判断と起動時のアカウント種別確認に使用します。保存はアンインストールまたはバージョン削除までです。遠隔監査、画面収集、行動分析は行わず、サーバー側の複製も保持しません。ローカル記録は時刻誤り・破損・改変により不正確となる場合があり、紛争での決定的証拠を保証しません。

consent.disclaimer.body.38
zh=第二十二章 协议的转让与承继\n\n第一百一十条（您的转让限制）未经我们书面同意，您不得将本协议项下的权利或义务转让给他人，包括随设备、账号或项目一并转让。\n\n第一百一十一条（我们的转让）我们可将本协议项下的权利义务整体转让给承接本项目的个人或实体，包括项目移交、代码仓库迁移或运营主体变更的情形。\n\n第一百一十二条（转让后的通知）发生上述转让时，我们会以合理方式通知您，例如在启动器内公告或项目页面说明。通知后继续使用本功能，视为您接受受让方承继本协议。\n\n第一百一十三条（拒绝的权利）您不同意转让的，可停止使用本功能并退出登录；已完成的下载与安装不受影响。\n\n第一百一十四条（项目终止）若项目整体终止且无承继方，本协议随之终止；免责、责任限制与争议解决条款继续有效，以覆盖终止前发生的行为。\n\n第一百一十五条（开源许可的独立性）本协议转让不影响 PMCL 依开源许可证授予您的权利；该等权利由相应许可证独立调整。
en=Chapter 22 Assignment and Succession\n\nYou may not assign your rights or obligations without our written consent. We may assign this Agreement to an individual or entity continuing the project, including on handover, repository migration or a change of operator, with reasonable notice; continued use after notice constitutes acceptance. If you disagree, you may stop using the Feature and sign out. If the project ends without a successor, this Agreement terminates while disclaimer, liability and dispute provisions survive.
ja=第22章 契約の譲渡と承継\n\n当方の書面同意なく権利義務を譲渡できません。当方はプロジェクトを承継する個人・団体（引き継ぎ、リポジトリ移転、運営主体の変更を含む）に本契約を譲渡でき、合理的に通知します。通知後の継続利用は承諾とみなします。同意しない場合は利用を中止しサインアウトできます。承継者がなくプロジェクトが終了した場合、本契約は終了しますが、免責・責任制限・紛争解決の条項は存続します。

consent.disclaimer.body.39
zh=第二十三章 协议的完整性与冲突处理\n\n第一百一十六条（完整协议）本协议与《自愿授权协议》共同构成您与我们就本功能达成的完整约定，取代此前一切口头说明、页面提示、客服回复与宣传文案中与本协议不一致的部分。\n\n第一百一十七条（冲突顺序）若本协议不同条款之间出现冲突，按下列顺序处理：首先适用明确针对特定情形的特别条款；其次适用免责与责任限制条款；最后适用一般性条款。若本协议与《自愿授权协议》冲突，按各自规范的事项分别适用。\n\n第一百一十八条（与开源许可证的关系）PMCL 的源代码依随附的开源许可证授权。本协议不限制、不削减、也不替代该等许可证赋予您的权利；两者冲突时，就代码本身的使用以开源许可证为准。\n\n第一百一十九条（与第三方条款的关系）您与 Microsoft、Mojang 或其他第三方之间的约定独立于本协议。我们不是该等约定的当事方，也不对其履行承担任何责任。\n\n第一百二十条（非弃权性解释）我们未对某一条款主张权利，不表示该条款失效，也不构成对其他情形的默示同意。\n\n第一百二十一条（可分性与替代）任一数条款无效的，其余条款继续有效；双方应以最接近原条款目的的有效条款替代之，替代条款自原条款无效之日起适用。
en=Chapter 23 Entire Agreement and Conflicts\n\nThis Agreement and the Authorization Agreement form the entire agreement and supersede prior statements. Special clauses prevail over general ones, and disclaimers over general terms. Open-source licences governing PMCL's code are unaffected and prevail for the code itself. Third-party terms are independent. Not asserting a clause does not waive it; invalid clauses are replaced by valid ones closest to the original intent.
ja=第23章 契約の完全性と抵触\n\n本契約と任意認証契約が完全な合意を構成し、従前の説明に代わります。特別条項が一般条項に、免責条項が一般条項に優先します。PMCL のコードに適用されるオープンソースライセンスは影響を受けず、コード自体については当該ライセンスが優先します。第三者の条件は独立して適用されます。権利の不行使は放棄ではなく、無効な条項は最も近い趣旨の有効な条項で置き換えます。

consent.disclaimer.body.40
zh=第二十四章 权利行使与时效\n\n第一百二十二条（权利保留）本协议未明确授予您的权利，均由我们或相应权利人保留。\n\n第一百二十三条（时效）您因本功能向我们主张权利的，应在知道或应当知道相关事实之日起一年内提出；法律另有强制规定的，从其规定。超过期限的，我们有权不再受理。\n\n第一百二十四条（我们的时效）我们对您违反本协议的行为主张责任的时效，适用法律规定的诉讼时效；我们未在该期限内主张，不表示放弃。\n\n第一百二十五条（证据形式）双方确认：启动器内的提示、协议版本号、发布记录、电子邮件或公开渠道的沟通记录，均可作为证明相关事实的证据。\n\n第一百二十六条（举证便利）因本功能的技术特性，本地记录通常由您掌握。若您主张某项事实而该事实的相关记录在您控制之下，您应提供相应材料。\n\n第一百二十七条（不加重责任）本条不改变法律对举证责任的强制分配，也不排除您依法享有的救济途径。
en=Chapter 24 Exercise of Rights and Time Limits\n\nRights not expressly granted are reserved. Claims about the Feature should be raised within one year of knowledge (or as statute requires); later claims may be declined. Our claims are subject to statutory limitation periods. Prompts, version numbers, release records and communications may serve as evidence. Records held by you should be produced when you rely on them. Nothing here alters mandatory rules on burden of proof.
ja=第24章 権利行使と時効\n\n明示的に付与されていない権利は留保されます。本機能に関する請求は、知った時から1年以内（法令に強行規定がある場合はそれに従う）に行うものとし、期間経過後は受理しないことがあります。当方の請求は法定の時効に従います。画面表示、版番号、リリース記録、通信記録は証拠となり得ます。立証責任に関する強行規定を変更するものではありません。

consent.disclaimer.body.41
zh=第二十五章 未成年人使用的特别约定\n\n第一百二十八条（监护人同意）未成年人使用本功能，应由监护人阅读本协议并代为同意。监护人代为同意的，视为其已了解本功能涉及账号、地区政策与第三方服务。\n\n第一百二十九条（监护人的管理）监护人可通过退出登录、删除账户与清除数据，随时终止未成年人对本功能的使用。\n\n第一百三十条（不面向儿童）本功能不面向十四周岁以下的儿童设计，我们不会主动面向儿童推广，也不会基于本功能收集儿童个人信息。\n\n第一百三十一条（学校的责任）若未成年人在学校或培训机构的设备上使用本功能，该机构应尽到相应的管理与告知义务。\n\n第一百三十二条（误用提示）若我们发现疑似未成年人在缺乏监护的情况下使用本功能，可提示其停止使用并要求监护人确认。\n\n第一百三十三条（法律优先）若您所在地区对未成年人使用网络服务有特别规定，以该等规定为准。
en=Chapter 25 Minors\n\nMinors should use the Feature only with a guardian's consent, and guardians are deemed informed about accounts, regional policy and third-party services. Guardians may end use by signing out, deleting accounts or clearing data. The Feature is not designed for children under 14 and is not marketed to them. Schools and training institutions must supervise and inform. Local rules on minors prevail.
ja=第25章 未成年者の利用\n\n未成年者は保護者の同意のもとで利用し、保護者はアカウント、地域政策、第三者サービスについて承知したものとみなされます。保護者はサインアウトやデータ削除により利用を終了できます。14歳未満の児童向けではなく、児童向けの勧誘も行いません。学校・研修機関は管理と告知の義務を負います。地域の特別規定が優先します。

consent.disclaimer.body.42
zh=第二十六章 语言、译本与公示\n\n第一百三十四条（正文语言）本协议以简体中文版本为正文。繁体中文、英文、日文及其他语言的译本仅为便于理解，与正文不一致时以简体中文版本为准。\n\n第一百三十五条（译本的更新）正文更新后，译本将尽快同步；同步完成前，译本可能与正文存在差异，此时亦以正文为准。\n\n第一百三十六条（公示方式）本协议的全文随应用发布并可随时查阅；重大变更将通过启动器内公告或版本说明公示。\n\n第一百三十七条（历史版本）历史版本随项目记录保留，您可查阅任一版本的具体表述，以确认当时适用的条款。\n\n第一百三十八条（可读性说明）本协议使用较为严谨的表述，可能不便于快速阅读。若您对某一条款的理解存疑，请以书面方式提出，我们将尽量解释。\n\n第一百三十九条（解释权）对协议条款的解释应依据其文字含义、上下文、目的与诚实信用原则，不应作不利于任一方的单方解释。
en=Chapter 26 Language, Translations and Publication\n\nThe Simplified Chinese text is authoritative; other translations are for convenience and yield to it. Translations are updated after Chinese changes, and the Chinese text prevails in the interim. The full text ships with the application and is always readable; material changes are announced in-app or in release notes. Historical versions remain available. Ambiguities should be raised in writing and interpreted by text, context, purpose and good faith, not against either party.
ja=第26章 言語・翻訳・公示\n\n簡体字中国語版を正文とし、他の翻訳は参考で正文に劣後します。正文の更新後、翻訳は速やかに追従し、追従までは正文が優先します。全文はアプリと共に配布され常に閲覧でき、重要な変更はアプリ内またはリリースノートで公示します。過去の版も参照できます。疑義は書面で提出し、文言・文脈・目的・信義則に基づいて解釈し、一方に不利な解釈は行いません。

consent.disclaimer.body.43
zh=第二十七章 安全事件与漏洞披露\n\n第一百四十条（安全事件的类型）与本功能相关的安全事件包括：本地令牌被未授权访问、验证流程被绕过、下载内容被篡改、插件恶意行为、更新包被伪造等。\n\n第一百四十一条（披露方式）若您发现上述问题，请通过项目公开渠道以「安全」标识提交，并尽量提供复现步骤与影响范围。请不要在公开渠道披露可直接利用的细节。\n\n第一百四十二条（处置流程）我们收到报告后，会评估影响、修复缺陷、必要时发布安全更新，并在合理范围内向报告者反馈处理结果。\n\n第一百四十三条（不鼓励的行为）未经授权对第三方服务进行探测、扫描或压力测试，不属于本协议鼓励的安全研究，由此产生的后果由行为人自行承担。\n\n第一百四十四条（事件后的措施）若发生影响用户的安全事件，我们会提示用户重新登录、更换凭据或暂停使用相关功能，并在可行范围内说明情况。\n\n第一百四十五条（免责的边界）及时、善意地报告安全问题不会被视为违约；但以安全研究为名实施的攻击、数据窃取或服务干扰不在免责范围内。
en=Chapter 27 Security Incidents and Disclosure\n\nSecurity issues include unauthorised access to local tokens, bypassed verification, tampered downloads, malicious plugins and forged update packages. Report them through public channels labelled "security" with reproduction steps, without publishing exploitable details. We assess, fix, release updates and report back where reasonable. Unauthorised probing, scanning or stress testing of third-party services is not endorsed. Prompt, good-faith reports are not a breach; attacks, data theft or disruption under the guise of research are not excused.
ja=第27章 セキュリティ事案と脆弱性の開示\n\nローカルトークンへの不正アクセス、認証回避、ダウンロード内容の改ざん、悪意あるプラグイン、更新パッケージの偽造などが該当します。公開窓口に「security」と明記し、再現手順を添えてご連絡ください。悪用可能な詳細の公開は避けてください。当方は影響評価、修正、更新の配布を行い、合理的な範囲で結果を反馈します。第三者サービスへの無断の調査・スキャン・負荷試験は推奨せず、善意の報告は违约とみなしません。

consent.disclaimer.body.44
zh=第二十八章 声明汇总与最终确认\n\n第一百四十六条（核心声明汇总）我们再次声明：本功能不提供破解、不绕过付费、不伪造授权、不分发游戏文件；其存在以用户已合法拥有游戏为前提。\n\n第一百四十七条（核心义务汇总）您再次确认：账号为本人所有、不共享验证结果、不自动化批量使用、不将本功能用于商业目的、不规避技术措施。\n\n第一百四十八条（核心限制汇总）经本功能下载的版本只能使用正版账户启动；验证结果依赖第三方服务，可能失效；本地数据仅存于您的设备。\n\n第一百四十九条（核心风险汇总）账号风控、政策变化、服务中断、技术故障与数据残余风险由您自行承担。\n\n第一百五十条（最终确认）您在完整阅读本协议与《自愿授权协议》、分别滚动至末尾并勾选确认后，方可点击「同意并继续」；该操作即构成对本协议全部内容的接受。\n\n第一百五十一条（可分割的确认）若您仅接受其中一份协议，本功能不予开放；未接受的协议条款不因您的部分确认而生效。
en=Chapter 28 Summary and Final Confirmation\n\nWe restate: the Feature offers no cracking, bypass, forged authorization or file distribution, and presupposes lawful ownership. You confirm: the account is yours, results are not shared, no automated bulk use, no commercial use and no circumvention. Versions downloaded through the Feature require a premium account; verification may lapse; local data stays on your device. Account risk, policy change, outages, technical failure and residual data risk are yours. Accepting only one of the two agreements does not grant access.
ja=第28章 宣言の総括と最終確認\n\n当方は再度宣言します：本機能はクラック、支払い回避、許諾偽造、ファイル配布を行わず、適法な所有を前提とします。利用者は、アカウントが本人のものであること、結果を共有しないこと、自動一括利用・商業利用・回避行為を行わないことを確認します。本機能で取得した版は正規アカウントでのみ起動でき、認証は失効し得て、ローカルデータは端末内に留まります。アカウントリスク、政策変更、障害、技術的故障、データの残存リスクは利用者が負担します。一方の契約のみの承諾では本機能は提供されません。

consent.authorization.body.23
zh=第十三章 分项授权与粒度\n\n第六十一条（分项授权）本授权按功能分项理解：登录授权、令牌保存授权、所有权查询授权、本地记录授权。上述各项共同构成本功能必要的授权组合；缺一不可。\n\n第六十二条（不得默认勾选）我们不预设任何勾选状态，也不提供「一键同意全部」的入口。您须分别阅读两份协议并分别勾选。\n\n第六十三条（单独同意的事项）若未来出现需要单独同意的新处理活动（例如新增数据项、变更处理目的、跨境传输），我们将另行征求您的单独同意，且不以其作为继续使用既有功能的条件。\n\n第六十四条（授权的可撤回性）各分项授权均可通过退出登录、删除账户或清除数据撤回，撤回方式与整体撤回一致。\n\n第六十五条（授权的不可分割性）由于本功能依赖完整的授权链，撤回任一分项授权将导致本功能整体不可用；这不影响您使用 PMCL 的其他功能。\n\n第六十六条（超出范围的拒绝权）对于我们请求但非本功能必需的任何授权，您有权拒绝，且拒绝不应影响本功能的正常使用。
en=Chapter 13 Itemised Authorization\n\nAuthorization is understood as separate items: sign-in, token storage, ownership queries and local records; all are required for the Feature. No box is pre-ticked and there is no "agree to all" shortcut. New processing activities (new data items, new purposes, cross-border transfer) require separate consent and are not a condition for existing features. Each item can be withdrawn locally; withdrawing any one disables the Feature as a whole while other PMCL features remain available. You may refuse any authorization not necessary for the Feature.
ja=第13章 分項認証と粒度\n\n認証は、サインイン、トークン保存、所有権照会、ローカル記録の各項目からなり、いずれも本機能に必要です。既定のチェックや「すべて同意」は提供しません。新たな処理（データ項目の追加、目的の変更、越境移転）には別途の同意を求め、既存機能の条件とはしません。各項目はローカルで撤回でき、一つでも撤回すると本機能は利用できなくなりますが、他の機能には影響しません。本機能に不要な認証は拒否できます。

consent.authorization.body.24
zh=第十四章 数据主体请求的处理流程\n\n第六十七条（请求类型）您可以提出查阅、更正、删除、撤回同意与解释说明等请求。上述请求均可通过本地操作直接完成，无需向我们提交。\n\n第六十八条（本地查阅）您可在账号页面查看当前登录的账户、协议确认记录对应的版本，以及本地数据目录中的数据文件。\n\n第六十九条（本地更正）账户信息有误的，可删除该账户后重新登录；版本标记有误的，可删除相应版本或清除数据目录。\n\n第七十条（本地删除）退出登录清除令牌，删除账户清除标识与用户名，删除版本清除标记，卸载并清除目录清除全部本地数据。\n\n第七十一条（需我们协助的请求）若您认为某些数据不在您的本地控制范围内（例如您曾主动提交的日志），可通过公开渠道提出请求，我们将在合理期限内处理。\n\n第七十二条（身份核验）为避免误删他人数据，我们在协助处理请求时可能需要您说明提交时间、渠道与内容概要；我们不会因此收集额外的个人信息。
en=Chapter 14 Handling Data Subject Requests\n\nYou may request access, correction, deletion, withdrawal and explanations; all can be completed locally without contacting us. Use the Accounts page and the data directory to inspect, correct, delete tokens, accounts, markers or all local data. For data outside your control (such as logs you submitted), contact us publicly and we will respond within a reasonable period. We may ask for the submission time, channel and summary to avoid deleting another person's data, without collecting additional personal information.
ja=第14章 データ主体の請求処理\n\n閲覧・訂正・削除・同意撤回・説明を求めることができ、いずれも当方への申請なしに端末上で完結します。「アカウント」ページとデータディレクトリでトークン・アカウント・マーカー・全データを確認・削除できます。当方の管理外のデータ（提出済みログなど）については公開窓口へご連絡ください。合理的期間内に対応します。他人のデータを誤って削除しないため、提出日時・経路・概要の説明を求める場合がありますが、追加の個人情報は収集しません。

consent.authorization.body.25
zh=第十五章 安全事件响应与通知\n\n第七十三条（事件分级）我们将与授权相关的安全事件分为：影响单个设备的本地泄露、影响验证流程的缺陷、影响更新分发的伪造风险。不同级别对应不同的响应措施。\n\n第七十四条（响应措施）视事件级别，我们可能采取：提示用户重新登录、暂停相关功能、发布安全更新、吊销受影响的签名或说明规避方法。\n\n第七十五条（通知方式）事件影响范围较大时，我们会在启动器内公告或发布说明，尽量描述影响、处置与用户应采取的措施。\n\n第七十六条（您的配合）收到安全提示后，请及时更新版本、重新登录并在必要时修改账号密码；继续使用受影响版本可能扩大风险。\n\n第七十七条（不谎报）我们不会隐瞒已知的重大安全事件，但也不会在修复完成前披露可直接利用的细节，以免扩大损害。\n\n第七十八条（责任边界）安全事件由第三方服务或您的设备环境引起时，我们协助排查但不承担由此产生的直接或间接损失。
en=Chapter 15 Security Incident Response\n\nIncidents are graded from local leaks on a single device, through defects in verification, to forged update distribution. Responses may include asking users to sign in again, suspending features, releasing security updates or revoking affected signatures. For broad incidents we publish in-app notices describing impact, handling and user actions. Please update, sign in again and change passwords as advised. We do not conceal known material incidents, nor disclose exploitable details before fixes are available. Incidents rooted in third-party services or your environment are assisted but not compensated.
ja=第15章 セキュリティ事案への対応\n\n単一機器の漏えいから、認証プロセスの欠陥、更新配布の偽造まで段階的に分類します。対応として、再サインインの依頼、機能の一時停止、セキュリティ更新の配布、影響を受けた署名の失効などを行います。広範な事案ではアプリ内で影響・対応・利用者の措置を告知します。指示に従い更新・再サインイン・パスワード変更を行ってください。既知の重大事案を隠蔽せず、修正前には悪用可能な詳細を公開しません。第三者や利用者環境に起因する事案は調査を支援しますが、損失の補償は行いません。

consent.authorization.body.26
zh=第十六章 诊断日志与故障排查数据\n\n第七十九条（日志范围）本功能产生的诊断日志包括：验证发起与结果、令牌刷新的成功与失败、下载任务的开始与结束、启动校验的判定结果。日志不含您的密码与完整令牌。\n\n第八十条（日志用途）日志仅用于排查您主动报告的问题，以及在我们内部复现缺陷。我们不基于日志进行用户画像或行为分析。\n\n第八十一条（日志保存）日志保存在本机日志目录，按大小或时间滚动清理；我们不会自动上传，也不会在后台周期性收集。\n\n第八十二条（主动提交）您在提交问题时，可自行选择是否附带日志片段。请先检查其中是否包含不希望公开的路径、用户名或服务器地址。\n\n第八十三条（脱敏建议）若需公开发布日志，建议先替换用户名、绝对路径与内网地址等信息。\n\n第八十四条（日志的删除）您可随时删除日志目录中的文件；删除后不影响本功能的正常使用。
en=Chapter 16 Diagnostic Logs\n\nLogs cover verification attempts and results, token refresh outcomes, download task boundaries and launch-check decisions, and never contain your password or full token. They are used only to investigate issues you report and to reproduce defects internally; no profiling or behavioural analysis is performed. Logs stay in the local log directory with rolling cleanup and are never uploaded automatically. You choose whether to attach excerpts, and should redact usernames, paths and internal addresses before publishing. You may delete logs at any time.
ja=第16章 診断ログ\n\nログには認証の開始と結果、トークン更新の成否、ダウンロードの開始終了、起動時確認の判定が含まれ、パスワードや完全なトークンは含まれません。利用者が報告した問題の調査と、社内での不具合再現にのみ使用し、プロファイリングや行動分析は行いません。ログはローカルのログディレクトリに保存され、自動送信されません。添付するかはご自身で判断し、公開前にユーザー名・パス・内部アドレスを伏せてください。いつでも削除できます。

consent.authorization.body.27
zh=第十七章 插件与扩展对授权的影响\n\n第八十五条（插件不继承授权）本授权仅授予 PMCL 本体，不自动延伸至第三方插件。插件若需访问账户数据或发起验证，应自行取得您的同意。\n\n第八十六条（核心校验不可绕过）启动经本功能下载的版本时，账户类型校验在核心层执行，插件无法通过替换界面或伪造返回值绕过。\n\n第八十七条（插件的可见性）插件可能读取本地数据或发起网络请求。安装前请确认插件来源、权限与更新记录，避免使用来源不明的构建。\n\n第八十八条（插件行为的后果）因插件导致的数据泄露、账号风控或验证异常，由插件作者与使用者承担；我们可停用明显违规的插件。\n\n第八十九条（插件与协议的关系）插件不得以「已获得 PMCL 授权」为由，主张对您账号数据的处理权。\n\n第九十条（卸载插件）卸载插件不会自动清除其曾写入的数据；如需彻底清理，请检查插件文档说明的存储位置。
en=Chapter 17 Plugins and Extensions\n\nThis authorization covers PMCL itself, not third-party plugins; a plugin needing account data or verification must obtain your consent separately. The premium-account launch check is enforced in the core and cannot be bypassed by replacing the interface or forging results. Plugins may read local data or make network requests, so verify their origin and permissions. Consequences of plugin behaviour fall on the author and user, and clearly violating plugins may be disabled. A plugin cannot claim PMCL's authorization as grounds for processing your data. Uninstalling a plugin does not remove data it wrote; check its documentation.
ja=第17章 プラグインと拡張\n\n本認証は PMCL 本体に限られ、第三者プラグインには及びません。アカウントデータや認証が必要なプラグインは独自に同意を取得する必要があります。正規アカウントの起動確認はコアで実施され、画面差し替えや結果偽造では回避できません。プラグインはローカルデータを読んだり通信したりするため、出所と権限を確認してください。プラグインの行為による結果は作者と利用者が負担し、明白な違反プラグインは無効化することがあります。アンインストールしても書き込んだデータは残る場合があります。

consent.authorization.body.28
zh=第十八章 账号注销、设备转让与数据继承\n\n第九十一条（账号注销）您在游戏权利方处注销账号后，本功能将因无法验证而不可用；本地令牌与标记的清除需您自行操作。\n\n第九十二条（设备转让）转让设备前，请退出登录、删除账户并清除 PMCL 数据目录，避免受让人继承您的登录状态与验证记录。\n\n第九十三条（数据继承）本授权具有人身属性，不随设备、账号或项目转让而转移；受让人不会因取得设备而取得您的授权。\n\n第九十四条（企业设备回收）组织回收设备时，应按其内部流程清除 PMCL 数据；我们无法远程代为清除。\n\n第九十五条（继承人）在符合法律规定的情形下，近亲属可依法律程序处理相关数据；由于数据仅存于本地，实际处理需通过设备本身完成。\n\n第九十六条（数据不可恢复）本地数据删除后通常无法恢复；请在删除前自行备份确需保留的内容。
en=Chapter 18 Account Closure, Device Transfer and Inheritance\n\nIf you close your account with the rights holder, verification fails and the Feature becomes unavailable; clearing local tokens and markers is up to you. Before transferring a device, sign out, remove accounts and clear the PMCL data directory. This authorization is personal and does not pass with the device, account or project. Organisations reclaiming devices must clear PMCL data themselves. Where law permits, close relatives may handle data through legal procedures, but since data is local, this happens on the device. Deleted local data is generally unrecoverable.
ja=第18章 アカウント削除・端末譲渡・承継\n\n権利者側でアカウントを削除すると認証できず本機能は利用できません。トークンとマーカーの削除はご自身で行ってください。端末を譲渡する前にサインアウトし、アカウントを削除し、データディレクトリを消去してください。本認証は一身専属で、端末・アカウント・プロジェクトの譲渡に伴い移転しません。組織が端末を回収する場合は自らデータを消去してください。法令が認める場合、近親者は法的手続により対応できますが、データはローカルにあるため端末上での操作が必要です。削除したデータは通常復元できません。

consent.authorization.body.29
zh=第十九章 第三方库与开源组件\n\n第九十七条（组件构成）PMCL 使用若干开源库与第三方组件（例如 UI 框架、HTTP 客户端、加密库）。该等组件依其各自的许可证使用。\n\n第九十八条（组件的能力）部分组件具备网络请求、文件读写与本地存储能力；其调用范围受 PMCL 的代码约束，我们不会借组件超出本授权范围处理数据。\n\n第九十九条（组件自身的隐私行为）我们选择的组件不包含广告 SDK 或行为分析 SDK；若未来引入可能涉及数据处理的新组件，我们将更新本协议并重新征求同意。\n\n第一百条（许可证义务）组件的许可证要求保留版权与许可声明；您在使用与分发 PMCL 时应遵守该等要求。\n\n第一百零一条（组件缺陷）第三方组件的缺陷可能影响本功能的表现与安全；我们会尽力跟进修复，但不对组件本身的缺陷承担超出法律规定的责任。\n\n第一百零二条（组件替换）我们可能在不改变数据处理范围的前提下替换或升级组件，此类变更无需重新取得授权。
en=Chapter 19 Third-Party Libraries and Open-Source Components\n\nPMCL uses open-source libraries and third-party components under their respective licences. Some have network, file and storage capabilities, constrained by PMCL's code so that data processing stays within this authorization. No advertising or analytics SDKs are included; if a new component would involve data processing, we will update this Agreement and seek consent again. Licence notices must be preserved. We follow up on component defects but accept no liability beyond what the law requires. Components may be replaced without changing the scope of processing.
ja=第19章 第三者ライブラリとオープンソース\n\nPMCL は各ライセンスに従い複数のオープンソースライブラリと第三者コンポーネントを使用します。一部は通信・ファイル・保存の機能を持ちますが、PMCL のコードにより本認証の範囲内に制約されます。広告・分析 SDK は含みません。データ処理を伴う新たなコンポーネントを導入する場合は本契約を更新し再同意を求めます。ライセンス表示の保持が必要です。コンポーネントの不具合は追跡しますが、法律を超える責任は負いません。処理範囲を変えずにコンポーネントを差し替えることがあります。

consent.disclaimer.body.45
zh=第二十九章 服务费用、第三方成本与税费\n\n第一百五十二条（本功能不收费）本功能不向您收取任何费用，也不以捐赠、订阅、广告分成或数据交换作为开放条件。我们没有为使用本功能设置付费门槛，也不会因您不使用而减损其他功能。\n\n第一百五十三条（第三方成本）您使用本功能时可能产生第三方成本，例如网络流量费用、云存储费用或设备折旧。该等成本由您自行承担，我们不代为支付或补偿。\n\n第一百五十四条（游戏本身的费用）本功能不代收游戏价款。若您尚未购买游戏，本功能无法为您取得所有权，您应通过游戏权利方的官方渠道购买。任何声称可通过本功能「免费获得正版」的说法均属不实。\n\n第一百五十五条（禁止转售）您不得以本功能为基础提供付费服务，包括但不限于代验证、代下载、加速下载的付费通道，或将其打包进收费产品。\n\n第一百五十六条（税费）因您使用本功能产生的任何税费，由您依所在地法律自行申报与缴纳。\n\n第一百五十七条（费用变更）若未来引入与本功能相关的收费项目（例如可选的增值服务），我们将提前公示并单独征求同意；拒绝付费不影响既有免费功能的可用性。
en=Chapter 29 Fees, Third-Party Costs and Taxes\n\nThe Feature is free: no donation, subscription, advertising or data-exchange condition applies, and no paid gate is set. Third-party costs such as bandwidth, storage or device wear are yours. We do not collect game payments; if you do not own the game, buy it through official channels, and any claim of \"free premium access\" via the Feature is false. You may not resell the Feature or offer paid verification or download services. Taxes arising from your use are yours to declare. Any future paid option will be announced and require separate consent without disabling existing free features.
ja=第29章 費用・第三者コスト・税\n\n本機能は無償で、寄付・購読・広告・データ交換を条件とせず、有料の入口もありません。通信料や保存料、端末の消耗などの第三者コストは利用者の負担です。ゲーム代金の徴収は行わないため、未所有の場合は権利者の公式窓口で購入してください。本機能で「無料で正規版が得られる」という説明は事実ではありません。代理認証・代理ダウンロードなどの有料提供は禁止します。利用に伴う税は利用者が申告してください。将来有料機能を導入する場合は事前に公示し、別途同意を求めます。

consent.disclaimer.body.46
zh=第三十章 下载校验与内容完整性细则\n\n第一百五十八条（校验方式）PMCL 在下载完成后会对文件进行大小与哈希校验，以判断文件是否完整、是否与清单记录一致。校验失败的文件不会被当作有效安装。\n\n第一百五十九条（校验的局限）校验只能证明文件与清单记录一致，不能证明文件本身无缺陷、无兼容性问题或符合您的特定用途。\n\n第一百六十条（断点续传）本功能支持断点续传。续传时会重新校验已下载部分，避免拼接产生损坏文件。\n\n第一百六十一条（校验失败的处置）校验失败时，请重试下载；多次失败可能是网络中间设备篡改、磁盘故障或来源异常，建议更换网络、检查磁盘并核对来源。\n\n第一百六十二条（缓存与临时文件）下载过程可能产生临时文件与缓存。正常结束时会自动清理；异常中断时可能残留，您可手动删除。\n\n第一百六十三条（内容变更）游戏权利方可能更新其分发内容。我们不保证您在不同时间下载到的内容完全一致，也不对版本间差异导致的存档或模组兼容问题负责。
en=Chapter 30 Download Verification and Integrity\n\nAfter downloading, PMCL verifies file size and hash against the manifest; mismatches are not treated as valid installs. Verification proves consistency with the manifest, not absence of defects or fitness for your use. Resumable downloads re-verify partial data to avoid corrupt concatenation. On failure, retry; repeated failures may indicate interception, disk faults or an abnormal source. Temporary files are cleaned on success and may remain after interruption. Content may change upstream, and we are not responsible for save or mod incompatibilities between versions.
ja=第30章 ダウンロード検証と完全性\n\n完了後にサイズとハッシュを照合し、不一致は有効なインストールとして扱いません。検証はマニフェストとの一致を示すもので、欠陥の不存在や用途への適合を保証しません。再開時は途中データを再検証し、破損した連結を避けます。失敗時は再試行し、繰り返す場合は傍受・ディスク故障・異常な配布元を疑ってください。一時ファイルは正常終了時に削除され、中断時に残る場合があります。配布内容は更新されることがあり、版間のセーブや Mod の互換性については責任を負いません。

consent.disclaimer.body.47
zh=第三十一章 地区判定的技术说明与误判处理\n\n第一百六十四条（判定依据）地区判定依据本机出口 IP 的归属地，并结合系统语言与时区作为辅助信号。判定不读取您的位置权限、GPS 或账号注册地。\n\n第一百六十五条（判定方式）判定通过直连方式测量真实出口 IP，不经过系统代理。因此开启代理或 VPN 不会改变判定结果。\n\n第一百六十六条（可能误判的情形）常见的误判包括：企业网络统一出口、跨境专线、卫星网络、运营商地址库滞后、以及系统语言与时区被手动修改。\n\n第一百六十七条（误判的处理）若您认为判定有误，请通过公开渠道说明所在地区、网络类型与判定时间。我们会在合理范围内核查，但不保证修改判定结果。\n\n第一百六十八条（判定的实时性）判定结果会持续刷新。切换网络后可能立即变化，本功能的可用性可能随之改变。\n\n第一百六十九条（判定的单方性）判定规则由我们设定，您无法通过技术手段要求我们采用特定判定方式；但您可以随时停止使用本功能并改用官方渠道。
en=Chapter 31 Regional Determination and False Positives\n\nRegional determination uses the device's egress IP, with system language and timezone as auxiliary signals; it does not read location permissions, GPS or account registration region. Egress IP is measured by direct connection, so proxies and VPNs do not change the result. Common false positives include corporate egress, cross-border leased lines, satellite links, stale carrier databases and manually altered locale settings. If you believe the result is wrong, describe your region, network type and timing publicly; we will review within reason but cannot guarantee a change. Results refresh continuously and may change when you switch networks.
ja=第31章 地域判定と誤判定\n\n地域判定は端末の出口 IP を用い、言語とタイムゾーンを補助信号とします。位置権限・GPS・登録地域は読み取りません。出口 IP は直接接続で測定するため、プロキシや VPN では結果が変わりません。企業の共通出口、越境専用線、衛星回線、事業者データベースの遅延、言語設定の変更などで誤判定が起こり得ます。誤りと考えられる場合は地域・回線種別・時刻を公開窓口へお知らせください。合理的範囲で確認しますが、変更を保証するものではありません。判定は継続的に更新されます。

consent.disclaimer.body.48
zh=附录十五 验证失败排查清单\n\n（一）确认已使用微软账户登录，而非离线账户或第三方皮肤站账户。\n\n（二）确认网络可正常访问 Microsoft 账户服务与游戏权利方的接口；可尝试切换网络后重试。\n\n（三）确认系统时间准确。时间偏差过大可能导致令牌校验失败。\n\n（四）确认设备未启用会拦截 HTTPS 的安全软件、抓包工具或系统级代理。\n\n（五）若提示令牌过期，请退出登录后重新登录，触发令牌刷新。\n\n（六）若提示账号状态异常，请先在游戏权利方渠道确认账号是否被限制，再回到本功能重试。\n\n（七）若提示版本过旧，请先完成 PMCL 的更新。\n\n（八）若以上步骤均无效，请提交日志片段与复现步骤，并说明所在地区与网络类型。\n\n（九）请勿通过反复快速重试、切换账号或使用自动化工具来「冲过」验证，该等行为可能触发风控。
en=Appendix 15 Verification Failure Checklist\n\nConfirm you signed in with a Microsoft account rather than an offline or third-party account. Confirm Microsoft and rights-holder endpoints are reachable and try another network. Check that system time is accurate. Disable security software, capture tools or system proxies that intercept HTTPS. If the token expired, sign out and in again. If the account status is abnormal, resolve it with the rights holder first. Update PMCL if prompted. If all fails, submit logs, reproduction steps, your region and network type. Do not try to force verification by rapid retries, account switching or automation, which may trigger risk controls.
ja=付録15 認証失敗のチェックリスト\n\nオフラインや第三者アカウントではなく Microsoft アカウントでサインインしているか確認してください。Microsoft と権利者のエンドポイントに到達できるか確認し、別回線も試してください。システム時刻が正確か確認してください。HTTPS を傍受するセキュリティ製品・キャプチャツール・システムプロキシを停止してください。トークン失効の場合はサインインし直してください。アカウント状態が異常な場合は先に権利者で解決してください。更新を求められたら PMCL を更新してください。解決しない場合はログ・再現手順・地域・回線種別を提出してください。

consent.disclaimer.body.49
zh=附录十六 账号风控应对清单\n\n（一）若账号突然要求额外验证或被限制登录，请先通过游戏权利方的官方渠道处理，不要在多个工具间反复尝试。\n\n（二）避免在短时间内于多台设备、多个地区登录同一账号。\n\n（三）避免频繁注销与重新登录，避免在公共设备上保留登录状态。\n\n（四）避免使用来源不明的启动器、插件或加速工具操作同一账号。\n\n（五）若您在 PMCL 中收到异常提示，请立即退出登录并检查设备是否存在可疑软件。\n\n（六）保留相关时间点与提示内容，以便在向游戏权利方申诉时说明情况。\n\n（七）理解账号风控由第三方决定，我们无法代为解除，也无法保证申诉成功。\n\n（八）若风控导致本功能不可用，您可以改用官方渠道继续游戏，本协议不限制您的选择。
en=Appendix 16 Account Risk-Control Checklist\n\nIf your account suddenly requires extra verification or is restricted, handle it through the rights holder first and avoid repeated attempts across tools. Avoid signing in on many devices or regions in a short period, frequent re-login, and leaving sessions on public devices. Avoid operating the same account with unknown launchers, plugins or accelerators. If PMCL shows an abnormal prompt, sign out and check the device for suspicious software. Keep timestamps and messages for any appeal. Risk controls are decided by third parties; we cannot lift them or guarantee appeals. If the Feature becomes unavailable, you may use official channels without restriction.
ja=付録16 アカウントのリスク管理への対応\n\n突然の追加認証や制限を受けた場合は、まず権利者の公式窓口で対応し、複数のツールで繰り返し試さないでください。短期間に多数の端末・地域でサインインすること、頻繁な再ログイン、公共端末でのサインイン保持を避けてください。出所不明のランチャー・プラグイン・加速ツールで同じアカウントを操作しないでください。異常な表示が出た場合はサインアウトし、端末の不審なソフトを確認してください。申立てに備えて時刻と表示内容を保管してください。リスク管理は第三者が判断し、当方は解除できず、申立ての成功も保証しません。

consent.disclaimer.body.50
zh=附录十七 下载异常处置流程\n\n（一）网络中断：本功能支持断点续传，恢复网络后可继续；多次中断建议更换网络。\n\n（二）下载速度为 0：检查磁盘空间、防火墙规则与分发渠道可用性，必要时更换下载时段。\n\n（三）校验失败：重新下载；若持续失败，检查磁盘健康状态与网络中间设备。\n\n（四）下载完成但无法启动：确认账户类型符合要求、Java 运行时可用、版本文件完整；必要时重新安装该版本。\n\n（五）提示文件被占用：关闭正在运行的游戏与其他启动器，再重试。\n\n（六）磁盘空间不足：清理缓存与旧版本后再试；本功能不会自动删除您的存档。\n\n（七）来源异常：若提示来源不可信或证书异常，请停止下载并通过公开渠道反馈，不要绕过校验。\n\n（八）处理无效时：提交日志、版本号、操作系统与网络环境信息，等待排查。
en=Appendix 17 Handling Download Problems\n\nNetwork drops: downloads resume; switch networks if it keeps happening. Zero speed: check disk space, firewall rules and channel availability. Checksum failure: download again; persistent failure suggests disk issues or interception. Downloaded but won't launch: check account type, Java runtime and file integrity, then reinstall the version. File locked: close running games and other launchers. Low disk space: clear caches and old versions; saves are never deleted automatically. Untrusted source or certificate warnings: stop and report; do not bypass verification. If unresolved, submit logs, version, OS and network details.
ja=付録17 ダウンロード異常時の手順\n\n通信断：再開できます。繰り返す場合は回線を変えてください。速度がゼロ：空き容量、ファイアウォール、配布元の可用性を確認してください。検証失敗：再ダウンロードし、続く場合はディスクと傍受を疑ってください。完了しても起動しない：アカウント種別、Java、ファイルの完全性を確認し、必要なら再インストールしてください。ファイル使用中：実行中のゲームや他のランチャーを閉じてください。容量不足：キャッシュと古い版を整理してください。出所や証明書の異常：中止して通報し、検証を回避しないでください。

consent.disclaimer.body.51
zh=附录十八 协议条款速查表\n\n（一）关于「本功能是什么」：第 3 章、第 12 条、第 14 条。\n\n（二）关于「为什么需要验证」：第 4 章、附录四。\n\n（三）关于「账号必须是谁的」：第 5 章、第 22 条、附录十。\n\n（四）关于「不能做什么」：第 6 章、第 27 至 32 条。\n\n（五）关于「下载内容从哪来」：第 7 章、第 33 条。\n\n（六）关于「知识产权归谁」：第 8 章。\n\n（七）关于「第三方服务」：第 9 章。\n\n（八）关于「风险有哪些」：第 10 章、附录一、附录十二。\n\n（九）关于「我们不承担什么」：第 11 章、第 12 章。\n\n（十）关于「数据怎么处理」：附录一、附录三、《自愿授权协议》第 4 至 7 章。\n\n（十一）关于「怎么撤回」：第 15 章、附录五、《自愿授权协议》附录一。\n\n（十二）关于「怎么联系我们」：附录十一。\n\n（十三）关于「以哪个语言为准」：第 5 条、第 26 章。
en=Appendix 18 Quick Clause Index\n\nWhat the Feature is: Chapter 3, Articles 12 and 14. Why verification is required: Chapter 4 and Appendix 4. Whose account it must be: Chapter 5, Article 22, Appendix 10. What you may not do: Chapter 6, Articles 27 to 32. Where content comes from: Chapter 7, Article 33. Who owns intellectual property: Chapter 8. Third-party services: Chapter 9. Risks: Chapter 10, Appendices 1 and 12. What we do not cover: Chapters 11 and 12. Data handling: Appendix 1 and 3, and Chapters 4 to 7 of the Authorization Agreement. How to withdraw: Chapter 15, Appendix 5, Appendix 1 of the Authorization Agreement. Contact: Appendix 11. Governing language: Article 5 and Chapter 26.
ja=付録18 条項早見表\n\n本機能とは：第3章・第12条・第14条。認証が必要な理由：第4章・付録4。誰のアカウントか：第5章・第22条・付録10。禁止事項：第6章・第27〜32条。内容の出所：第7章・第33条。知的財産：第8章。第三者サービス：第9章。リスク：第10章・付録1・付録12。免責：第11章・第12章。データ処理：付録1・付録3・任意認証契約第4〜7章。撤回：第15章・付録5・任意認証契約付録1。連絡先：付録11。正文言語：第5条・第26章。

consent.disclaimer.body.52
zh=附录十九 术语逐条解释（扩展）\n\n（一）「所有权状态」：游戏权利方服务给出的、可反映某账户是否持有该游戏的查询结果；它不是法律意义上的所有权证明。\n\n（二）「验证通过」：在某一时点查询到可识别的所有权状态，且账户类型符合要求；它不代表永久有效。\n\n（三）「正版启动校验」：启动经本功能下载的版本时，检查当前账户是否为微软账户的本地逻辑；该校验不连接第三方服务。\n\n（四）「本地标记」：记录某版本系经本功能下载的本地数据，用于触发正版启动校验。\n\n（五）「出口 IP」：您的设备访问外部服务时对外呈现的 IP 地址；本功能以直连方式测量，不使用代理。\n\n（六）「风控」：第三方服务对异常登录或操作采取的额外验证、限制或封禁措施。\n\n（七）「断点续传」：网络中断后从中断处继续下载的能力，续传时会重新校验已下载部分。\n\n（八）「哈希校验」：通过比较文件摘要判断文件是否完整、是否与清单记录一致的方法。\n\n（九）「撤回」：退出登录或删除本地数据，从而终止授权并停止相关处理的行为。\n\n（十）「译本」：为便于理解而提供的非中文版本；与简体中文正文冲突时，以正文为准。
en=Appendix 19 Glossary (Extended)\n\nOwnership status: a query result from the rights holder indicating whether an account holds the game; it is not legal proof of ownership. Passing verification: a recognizable ownership status at a given moment with a qualifying account type; not permanently valid. Premium launch check: local logic that tests whether the current account is a Microsoft account when launching a version downloaded through the Feature; it contacts no third party. Local marker: local data recording that a version came through the Feature. Egress IP: the address your device presents externally, measured directly without proxies. Risk control: extra verification, restriction or suspension applied by a third party. Resumable download: continuing from where a transfer stopped, re-verifying partial data. Hash verification: comparing file digests against the manifest. Withdrawal: signing out or deleting local data to end authorization. Translation: non-Chinese versions provided for convenience, subordinate to the Chinese text.
ja=付録19 用語の逐条解説（拡張）\n\n所有権状態：権利者の照会結果で、当該アカウントがゲームを保有するかを示すもの。法的な所有の証明ではありません。認証通過：ある時点で所有権状態が確認でき、アカウント種別が条件を満たすこと。永久の有効性は意味しません。正規起動確認：本機能で取得した版の起動時に、現在のアカウントが Microsoft アカウントかを端末上で確認する処理。第三者へ接続しません。ローカルマーカー：本機能経由の取得を記録するローカルデータ。出口 IP：端末が外部に示すアドレスで、プロキシを使わず直接測定します。リスク管理：第三者による追加認証・制限・停止。再開可能ダウンロード：中断位置から再開し、途中データを再検証する方式。ハッシュ検証：ダイジェストをマニフェストと比較する方法。撤回：サインアウトやデータ削除による認証の終了。翻訳：理解のための非中国語版で、正文に劣後します。

consent.authorization.body.30
zh=第二十章 授权与同意的记录方式\n\n第一百零三条（记录内容）本功能在本地记录您确认的协议版本、确认时间与确认结果（同意或不同意）。记录不包含您的任何生物特征、签名图像或身份证件信息。\n\n第一百零四条（记录用途）该记录仅用于判断是否需要向您重新征求同意，以及在争议中说明当时的确认情况；不用于其他目的。\n\n第一百零五条（拒绝的记录）您选择「不同意」时，我们同样记录该结果，以避免在本次使用中重复弹出；拒绝记录不影响您随时再次查看协议。\n\n第一百零六条（记录的可删除性）您可通过清除 PMCL 数据目录删除上述记录；删除后再次使用本功能时需要重新阅读并确认。\n\n第一百零七条（记录与撤回的区别）撤回授权是终止处理，删除确认记录只是清除同意的痕迹；两者可以分别进行。\n\n第一百零八条（无远程留痕）我们不将这些记录上传至任何服务器，因此不存在可被远程查询的同意记录数据库。
en=Chapter 20 Recording Consent\n\nWe record locally the agreement version, the time and the result of your confirmation (agree or decline). No biometrics, signature images or identity documents are recorded. The record is used only to decide whether consent must be sought again and to evidence the confirmation in a dispute. Declining is also recorded to avoid repeated prompts in the same session. You may delete the record by clearing the data directory, after which consent is required again. Withdrawal and deleting the record are separate actions. No copy is uploaded, so there is no remote consent database.
ja=第20章 同意の記録方法\n\n同意した契約の版、時刻、結果（同意／不同意）を端末内に記録します。生体情報、署名画像、身分証明書は記録しません。記録は再同意の要否判断と、紛争時の確認状況の説明にのみ使用します。不同意も記録し、同一セッションでの繰り返し表示を避けます。データディレクトリを消去すると記録も削除され、再度の確認が必要になります。撤回と記録削除は別の操作です。サーバーへの送信は行わないため、遠隔から照会できる同意記録データベースは存在しません。

consent.authorization.body.31
zh=第二十一章 数据处理的合法性基础\n\n第一百零九条（同意为基础）本功能处理个人信息的合法性基础是您的明示同意；我们不以「履行合同所必需」或「合法利益」替代您的同意。\n\n第一百一十条（同意的质量）您的同意应在充分知情、自愿、明确的前提下作出。我们通过完整展示协议、要求滚动至末尾与分别勾选来保障同意的质量。\n\n第一百一十一条（目的明确）处理目的限于本协议第五条所列事项；超出该等目的的处理，我们不会以「技术必要」为由径自进行。\n\n第一百一十二条（最小必要）在不影响功能的前提下，我们选择对您影响最小的处理方式，例如将处理限制在本地、避免长期保存查询结果。\n\n第一百一十三条（安全保障）我们采取与风险相适应的安全措施，包括加密存储与访问控制，以保护您的数据。\n\n第一百一十四条（责任可追溯）协议版本、确认时间与发布记录可共同证明处理规则在当时的内容，便于事后核查。
en=Chapter 21 Lawful Basis\n\nOur lawful basis is your explicit consent; we do not substitute contractual necessity or legitimate interest. Consent must be informed, voluntary and specific, which we support by showing the full text, requiring scrolling to the end and separate checkboxes. Processing is limited to the purposes in Article 5, and we do not invoke technical necessity to exceed them. We choose the least intrusive means, such as local processing and avoiding long-term retention of query results. Security measures are proportionate, including encryption and access control. Version numbers, timestamps and release records make the rules traceable after the fact.
ja=第21章 処理の適法性の基礎\n\n適法性の基礎は明示的な同意であり、契約履行の必要性や正当な利益で代替しません。同意は十分な情報に基づく任意かつ特定のものである必要があり、全文表示・末尾までのスクロール・個別チェックで担保します。処理は第5条の目的に限られ、技術的必要性を理由に超えることはありません。ローカル処理や照会結果の長期保存回避など、影響の小さい方法を選びます。暗号化とアクセス制御を含む相応の安全措置を講じます。版番号・時刻・リリース記録により事後の検証が可能です。

consent.authorization.body.32
zh=附录十一 本地数据文件清单\n\n（一）账户库文件：保存账户标识、用户名与加密后的令牌。用途：登录与启动。删除方式：在账号页删除账户或清除数据目录。\n\n（二）令牌加密文件或字段：保存加密后的访问令牌与刷新令牌。用途：维持登录与刷新会话。删除方式：退出登录。\n\n（三）正版下载标记文件：保存经本功能下载的版本标识列表。用途：启动时校验账户类型。删除方式：删除对应版本或清除数据目录。\n\n（四）配置与偏好文件：保存界面与功能偏好。用途：保持您的使用习惯。删除方式：在设置中重置或清除数据目录。\n\n（五）日志文件：保存运行日志与错误堆栈。用途：排查问题。删除方式：删除日志目录中的文件。\n\n（六）下载队列与缓存文件：保存任务状态与临时数据。用途：断点续传与进度展示。删除方式：清空下载队列或删除缓存目录。\n\n（七）说明：上述文件均位于本机 PMCL 数据目录，不设远程副本。
en=Appendix 11 Local Data File Inventory\n\nAccount store: identifiers, usernames and encrypted tokens; used for sign-in and launch; delete via the Accounts page or by clearing the data directory. Token file or fields: encrypted access and refresh tokens; delete by signing out. Premium-download markers: version identifiers downloaded through the Feature; delete with the version or by clearing data. Configuration and preferences: interface and feature settings; reset in settings or clear data. Logs: runtime logs and stack traces; delete the log files. Queue and cache files: task state and temporary data for resumption; clear the queue or cache directory. All files live in the local PMCL data directory with no remote copy.
ja=付録11 ローカルデータファイル一覧\n\nアカウントストア：識別子・ユーザー名・暗号化トークン。ログインと起動に使用。削除はアカウントページまたはデータディレクトリの消去。トークンファイル：暗号化されたアクセス／リフレッシュトークン。サインアウトで削除。正規ダウンロードマーカー：本機能で取得した版の識別子。版の削除またはデータ消去で削除。設定ファイル：画面と機能の設定。設定でリセットまたはデータ消去。ログ：実行ログとスタックトレース。ファイル削除で消去。キューとキャッシュ：再開用の状態と一時データ。キューまたはキャッシュの削除で消去。いずれもローカルの PMCL データディレクトリにあり、遠隔の複製はありません。

consent.authorization.body.33
zh=附录十二 授权状态判定矩阵\n\n（一）未登录 + 未确认协议：不提供本功能；按钮点击后先展示协议。\n\n（二）已确认协议 + 未登录：跳转登录；登录成功后自动继续验证。\n\n（三）已登录微软账户 + 协议有效：直接验证并开放本功能。\n\n（四）已登录非微软账户 + 协议有效：提示改用微软账户，本功能不开放。\n\n（五）已登录微软账户 + 协议版本过期：重新展示协议，确认后再验证。\n\n（六）已登录但令牌失效：尝试刷新；刷新失败则要求重新登录。\n\n（七）已验证通过 + 地区判定变化：重新判定是否开放；已下载内容不受影响。\n\n（八）已退出登录：立即关闭本功能，保留已下载内容与版本标记。\n\n（九）说明：矩阵仅描述本功能的可用性，不改变您对 PMCL 其他功能的使用。
en=Appendix 12 Authorization State Matrix\n\nNot signed in and agreements unconfirmed: the Feature is unavailable and the agreements are shown first. Confirmed but not signed in: proceed to sign-in, then verification. Signed in with Microsoft and agreements valid: verify and enable. Signed in with a non-Microsoft account: prompt to switch; the Feature stays unavailable. Microsoft account with an outdated agreement version: show the agreements again before verifying. Token expired: refresh, otherwise require sign-in. Verified but the region result changes: re-evaluate availability; downloads are unaffected. Signed out: the Feature closes immediately while downloads and markers remain. The matrix affects only this Feature.
ja=付録12 認証状態の判定表\n\n未サインインかつ未確認：本機能は提供せず、まず契約を表示。確認済みで未サインイン：サインインへ進み、その後認証。Microsoft でサインイン済みで契約有効：認証して提供。非 Microsoft アカウント：切替を促し、本機能は提供しない。契約版が古い：再表示して確認後に認証。トークン失効：更新し、失敗時は再サインイン。認証済みで地域判定が変化：可否を再判定し、既存のダウンロードは影響なし。サインアウト：本機能を即時終了し、ダウンロードとマーカーは保持。本表は本機能の可否のみを扱います。

consent.authorization.body.34
zh=附录十三 撤回操作检查清单\n\n（一）确认已保存需要保留的存档、配置与日志，删除后通常无法恢复。\n\n（二）在「账号」页退出当前微软账户，清除本地令牌。\n\n（三）如不再使用该账户，删除账户条目以清除标识与用户名。\n\n（四）如不再需要特定版本，删除该版本以同时移除正版下载标记。\n\n（五）如希望彻底清除，卸载 PMCL 并删除其数据目录。\n\n（六）检查是否存在自行创建的备份、快照或同步副本，并按需清理。\n\n（七）如需继续游戏，可改用游戏权利方的官方渠道；已安装内容仍可依其条款使用。\n\n（八）撤回后如需重新使用本功能，须重新阅读协议、确认并登录验证。
en=Appendix 13 Withdrawal Checklist\n\nSave worlds, settings and logs you want to keep; deletion is generally irreversible. Sign out of the Microsoft account on the Accounts page to clear the token. Remove the account entry to clear the identifier and username. Delete specific versions to remove their premium-download markers. To erase everything, uninstall PMCL and delete its data directory. Check your own backups, snapshots or synced copies and clean them as needed. To keep playing, use the rights holder's official channels; installed content remains usable under their terms. Reusing the Feature requires reading and confirming the agreements and signing in again.
ja=付録13 撤回時のチェックリスト\n\n残したいワールド・設定・ログを保存してください。削除後は通常復元できません。「アカウント」ページでサインアウトし、ローカルトークンを削除します。不要なアカウント項目を削除し、識別子とユーザー名を消去します。不要な版を削除し、正規ダウンロードマーカーも削除します。完全に消去する場合は PMCL をアンインストールしデータディレクトリを削除します。自作のバックアップや同期コピーも確認し、必要に応じて削除します。ゲームを続ける場合は権利者の公式窓口を利用でき、インストール済み内容は当該条件の下で利用できます。再度の利用には契約の確認とサインインが必要です。

consent.authorization.body.35
zh=附录十四 安全事件响应流程\n\n（一）发现：您或我们通过报告、监控或排查发现异常，例如令牌泄露、验证被绕过或更新包异常。\n\n（二）评估：我们判断影响范围（单设备、单版本或全部用户）与可利用性，决定处置级别。\n\n（三）遏制：视情况暂停相关功能、停止分发受影响版本、或在说明中提示临时规避方式。\n\n（四）修复：发布修复版本或更新清单；涉及签名的问题将吊销受影响签名并重新签发。\n\n（五）通知：影响较大时通过启动器公告或发布说明告知影响、处置与用户应采取的步骤。\n\n（六）复盘：记录原因与改进项，减少同类问题再次发生的可能。\n\n（七）您的配合：及时更新、重新登录、必要时修改账号密码，并避免在修复前继续使用受影响版本。
en=Appendix 14 Incident Response Flow\n\nDetection: you or we discover an anomaly such as token exposure, bypassed verification or an abnormal update package. Assessment: we judge scope (single device, single version or all users) and exploitability to set the response level. Containment: suspend features, stop distributing an affected build, or advise temporary mitigations. Remediation: release fixes or updated manifests; affected signatures are revoked and reissued. Notification: for broader impact we explain impact, handling and user actions in-app or in release notes. Review: causes and improvements are recorded. Your part: update promptly, sign in again, change passwords if needed and avoid affected builds until fixed.
ja=付録14 セキュリティ事案の対応手順\n\n検知：トークン漏えい、認証回避、更新パッケージの異常などを報告・監視・調査で把握します。評価：影響範囲（単一機器・単一版・全利用者）と悪用可能性を判断し、対応レベルを決めます。封じ込め：機能の一時停止、影響版の配布停止、暫定的な回避方法の案内を行います。修正：修正版や更新マニフェストを配布し、署名問題では該当署名を失効して再発行します。通知：影響が広い場合はアプリ内やリリースノートで影響・対応・利用者の措置を説明します。振り返り：原因と改善点を記録します。利用者は速やかな更新・再サインイン・必要に応じたパスワード変更を行ってください。

consent.authorization.body.36
zh=附录十五 第三方组件与许可证说明\n\n（一）界面框架：用于构建跨平台界面，可能在本地缓存渲染资源；不收集账号数据。\n\n（二）HTTP 客户端：用于访问账户服务与内容分发渠道；仅发送完成请求所必需的信息。\n\n（三）加密库：用于令牌与敏感字段的加密存储；密钥由本地机制管理。\n\n（四）JSON 与序列化库：用于读写本地配置与清单；不涉及网络传输。\n\n（五）日志与诊断库：用于本地日志输出；不启用远程上报。\n\n（六）说明：上述组件均依其各自的开源许可证使用，许可证要求保留版权与许可声明。我们不引入广告 SDK 或行为分析 SDK；若未来引入涉及数据处理的组件，将更新本协议并重新征求同意。
en=Appendix 15 Third-Party Components and Licences\n\nUI framework: builds the cross-platform interface and may cache rendering resources locally; no account data is collected. HTTP client: reaches account services and content channels, sending only what requests require. Cryptography library: encrypts tokens and sensitive fields with locally managed keys. JSON and serialisation libraries: read and write local configuration and manifests with no network transfer. Logging and diagnostics: produce local logs without remote reporting. All components are used under their open-source licences, which require preserving notices. No advertising or analytics SDKs are included; components involving data processing would require an updated Agreement and renewed consent.
ja=付録15 第三者コンポーネントとライセンス\n\nUI フレームワーク：クロスプラットフォーム画面を構築し、描画リソースをローカルにキャッシュする場合があります。アカウントデータは収集しません。HTTP クライアント：アカウントサービスと配布チャネルへ接続し、要求に必要な情報のみ送信します。暗号ライブラリ：トークンと機密項目をローカル管理の鍵で暗号化します。JSON・シリアライズ：設定とマニフェストを読み書きし、通信は行いません。ログ・診断：ローカルログを出力し、遠隔送信は行いません。いずれも各オープンソースライセンスに従い、著作権表示の保持が必要です。広告・分析 SDK は含みません。データ処理を伴う新規コンポーネントは契約更新と再同意の対象です。

consent.disclaimer.body.53
zh=第三十二章 系统环境、版本支持与兼容性\n\n第一百七十条（最低系统要求）本功能需要满足 PMCL 当前发布说明中列明的最低系统要求。低于该要求的环境可能无法启动、无法完成验证或在下载过程中异常退出，我们不对该等环境提供支持。\n\n第一百七十一条（Java 运行时）启动游戏需要相应版本的 Java 运行时。PMCL 可能在缺失时自动下载并安装合适的运行时；自动安装失败时，您需要自行准备可用的运行时，并确保其来源可信。\n\n第一百七十二条（支持的版本范围）我们通常只对最近若干个 PMCL 版本提供技术支持与安全更新。使用过旧版本时，您可能遇到已经修复的缺陷，也可能因接口变化而无法完成验证。\n\n第一百七十三条（旧版本的风险）旧版本可能包含已知漏洞，也可能不再符合当前的合规要求。我们建议您保持更新；继续使用旧版本所产生的风险由您自行承担。\n\n第一百七十四条（虚拟化与容器环境）在虚拟机、容器、云桌面或远程桌面中使用本功能时，硬件加速、图形渲染与网络出口可能与实体设备不同，我们不保证其可用性与性能。\n\n第一百七十五条（网络环境）本功能需要能够访问账户服务与内容分发渠道。受限网络、强制门户、企业防火墙或深度包检测可能导致验证失败或下载中断。\n\n第一百七十六条（语言与时区设置）系统语言与时区参与地区判定。手动修改语言或时区可能改变判定结果，进而影响本功能的可用性。\n\n第一百七十七条（环境不兼容的处理）若确认属于环境不兼容，您可调整环境后重试，或改用游戏权利方提供的官方渠道；我们不因此承担违约责任。
en=Chapter 32 Environment, Supported Versions and Compatibility\n\nThe Feature requires the minimum system requirements in the current release notes; unsupported environments may fail to start, verify or download. A matching Java runtime is required and may be downloaded automatically; if that fails, provide a trusted runtime yourself. Support and security fixes target recent PMCL releases; older builds may carry known defects or fail verification. VMs, containers, cloud desktops and remote sessions may differ in acceleration, rendering and egress and are not guaranteed. Access to account services and content channels is required; restricted networks, captive portals, firewalls and deep packet inspection may break verification. System language and timezone affect regional determination, so changing them can change availability.
ja=第32章 動作環境・対応版・互換性\n\n本機能は現行リリースノートの最低要件を満たす環境が必要で、非対応環境では起動・認証・ダウンロードに失敗することがあります。対応する Java ランタイムが必要で、自動導入に失敗した場合は信頼できるランタイムを自ら用意してください。技術支援と安全更新は最近の PMCL 版を対象とし、古い版は既知の不具合や認証失敗を抱える場合があります。仮想マシン、コンテナ、クラウドデスクトップ、リモート接続では描画や出口が異なり、動作を保証しません。アカウントサービスと配布チャネルへの到達が必要で、制限された回線や captive portal、ファイアウォール、DPI は認証を妨げる場合があります。言語とタイムゾーンは地域判定に影響します。

consent.disclaimer.body.54
zh=第三十三章 存档、模组与本地内容的独立性\n\n第一百七十八条（本功能的范围）本功能仅涉及游戏本体及其必要的库文件与资源文件。存档、模组、资源包、光影包、配置文件与截图均不属于本功能的处理范围。\n\n第一百七十九条（存档不受影响）本功能不会读取、修改或删除您的存档。版本切换、重装与卸载过程中的存档变化，取决于您选择的目录结构与操作方式，与验证流程无关。\n\n第一百八十条（模组的兼容性）模组由其作者维护，可能与特定游戏版本、加载器版本或 Java 版本不兼容。因模组导致崩溃、存档损坏或性能异常，本功能不承担责任。\n\n第一百八十一条（资源包与光影）资源包与光影对显存与驱动有额外要求。本功能不保证其在您的设备上可用，也不对渲染异常负责。\n\n第一百八十二条（不主动删除本地内容）我们不会主动删除您的本地内容。清理缓存、临时文件与旧版本的操作，应由您在确认备份后进行。\n\n第一百八十三条（版本切换的影响）不同游戏版本对存档格式的支持不同。使用较新版本打开旧存档后，可能无法再用旧版本打开，请在切换前备份。\n\n第一百八十四条（备份建议）建议您定期备份存档与配置，并将其保存在与游戏目录分离的位置，以降低磁盘故障与误操作带来的损失。\n\n第一百八十五条（数据损坏的自担）因磁盘故障、异常断电、第三方软件或人为操作导致的数据损坏，由您自行承担；我们不提供数据恢复服务。
en=Chapter 33 Saves, Mods and Local Content Are Independent\n\nThe Feature covers only the game and its required libraries and assets. Saves, mods, resource packs, shaders, configuration and screenshots are outside its scope. The Feature never reads, modifies or deletes your saves; changes during version switching, reinstall or uninstall depend on your directory layout and actions. Mods are maintained by their authors and may be incompatible with particular game, loader or Java versions; crashes, save damage or performance issues caused by mods are not our responsibility. Resource packs and shaders have extra GPU and driver requirements. We do not delete local content proactively; clean caches and old versions only after backing up. Newer versions may upgrade save formats irreversibly, so back up before switching.
ja=第33章 セーブ・Mod・ローカル内容の独立性\n\n本機能の対象はゲーム本体と必要なライブラリ・アセットのみです。セーブ、Mod、リソースパック、シェーダー、設定、スクリーンショットは対象外です。本機能はセーブを読み取り・変更・削除せず、版の切替や再インストール、アンインストール時の変化は利用者のディレクトリ構成と操作に依存します。Mod は作者が管理し、ゲーム・ローダー・Java の版によっては非互換となります。Mod によるクラッシュやセーブ破損、性能異常について当方は責任を負いません。リソースパックとシェーダーは GPU とドライバの追加要件があります。ローカル内容を当方が能動的に削除することはなく、整理はバックアップ後にご自身で行ってください。

consent.disclaimer.body.55
zh=第三十四章 与其他启动器、工具共存\n\n第一百八十六条（多启动器共存）您可以在同一设备上安装多个启动器。不同启动器可能共享游戏目录、库目录或账户缓存，由此产生的冲突由您自行协调。\n\n第一百八十七条（共享目录的风险）多个启动器共用同一游戏目录时，一方对库文件、版本文件或配置的修改可能影响另一方。建议为不同启动器配置独立目录。\n\n第一百八十八条（加速器与代理工具）加速器、代理工具与网络优化软件可能改变网络路径。若其劫持 HTTPS 或注入证书，验证可能失败；此类问题不属于本功能缺陷。\n\n第一百八十九条（抓包与调试工具）抓包工具、调试器与注入框架可能与启动器的安全机制冲突。我们不建议在启用本功能时使用该等工具，也不对其造成的异常负责。\n\n第一百九十条（杀毒软件误报）部分安全软件可能将自动下载运行时、写入启动参数等行为判定为可疑。请通过添加信任或白名单解决，不要直接关闭系统防护。\n\n第一百九十一条（文件占用与版本锁）游戏运行期间，相关文件被占用属正常现象。此时进行重装或删除可能失败，请先退出游戏与其他启动器。\n\n第一百九十二条（冲突的处理）出现冲突时，建议先隔离变量：只保留一个启动器、关闭加速与抓包工具、使用默认目录，再逐步启用，以定位问题来源。\n\n第一百九十三条（不建议的组合）我们不建议将本功能与来源不明的修改版客户端、系统级注入工具或共享账户的第三方工具同时使用。
en=Chapter 34 Coexistence with Other Launchers and Tools\n\nMultiple launchers may coexist, but they can share game, library or account caches and conflict; separate directories are recommended. Accelerators and proxy tools may alter network paths, and those intercepting HTTPS or injecting certificates can break verification. Capture tools, debuggers and injection frameworks may conflict with launcher security and should not be used with the Feature. Security software may flag automatic runtime downloads or launch-argument writes; use allowlists rather than disabling protection. Files are locked while the game runs, so close games and other launchers before reinstalling or deleting. To diagnose conflicts, isolate variables one at a time.
ja=第34章 他のランチャーやツールとの共存\n\n複数のランチャーの併用は可能ですが、ゲーム・ライブラリ・アカウントのキャッシュを共有して衝突する場合があり、ディレクトリの分離を推奨します。加速ツールやプロキシは通信経路を変え、HTTPS を傍受したり証明書を挿入すると認証が失敗します。キャプチャツール、デバッガ、注入フレームワークはランチャーの安全機構と衝突するため、本機能と併用しないでください。セキュリティソフトがランタイムの自動導入や起動引数の書き込みを検知する場合があり、保護を無効化せず許可リストで対応してください。ゲーム実行中はファイルが使用中となるため、再インストールや削除の前に終了してください。

consent.disclaimer.body.56
zh=第三十五章 消费者权益与法定权利的保留\n\n第一百九十四条（不排除法定权利）本协议不排除、不限制您依适用法律享有的消费者权益。若本协议的任何内容与强制性法律规定冲突，在该冲突范围内以法律规定为准。\n\n第一百九十五条（格式条款的提示）对于免除或限制我们责任、加重您义务或限制您主要权利的条款，我们已以显著方式提示，并在确认前要求您完整阅读。\n\n第一百九十六条（免费服务的性质）本功能免费提供，不构成买卖合同的标的。您理解免费服务在可用性、支持范围与责任承担上，与付费服务存在合理差异。\n\n第一百九十七条（救济途径）若您认为我们的处理损害了您的合法权益，可先通过公开渠道沟通；沟通不成，您仍可依适用法律寻求救济。\n\n第一百九十八条（条款无效的处理）若某一条款被认定无效，双方应以最接近原意的有效条款替代，且不影响其他条款的效力及您已依法取得的权利。\n\n第一百九十九条（不公平条款的调整）若某一条款被认定显失公平，应在该条款范围内作合理调整，而非整体否定协议的效力。\n\n第二百条（投诉渠道）您可通过项目公开渠道提出投诉。我们会在合理期限内答复，并在必要时调整功能或文案。\n\n第二百零一条（法律强制规定的优先）涉及个人信息保护、未成年人保护与消费者保护的强制性规定，优先于本协议的任何相反约定。
en=Chapter 35 Consumer Rights and Mandatory Law\n\nThis Agreement does not exclude or limit consumer rights under applicable law; where it conflicts with mandatory rules, those rules prevail to the extent of the conflict. Clauses that disclaim or limit liability, increase your obligations or restrict principal rights are highlighted and require full reading before confirmation. The Feature is free and is not the subject of a sale, so availability, support and liability reasonably differ from paid services. If you believe your rights are harmed, contact us publicly first; you retain any remedies the law provides. Invalid clauses are replaced by valid ones closest to the original intent without affecting the rest or rights already acquired.
ja=第35章 消費者保護と強行法規\n\n本契約は適用法上の消費者の権利を排除・制限しません。強行規定と抵触する場合は、その範囲で法令が優先します。責任の免除・制限、義務の加重、主要な権利の制限に関する条項は目立つ形で示し、確認前の全文読了を求めます。本機能は無償で売買の対象ではないため、可用性・支援範囲・責任の負担は有償サービスと合理的に異なります。権利が害されたと考える場合はまず公開窓口へご連絡ください。法令上の救済手段は保持されます。無効な条項は最も近い趣旨の有効な条項で置き換え、他の条項や既得の権利に影響しません。

consent.disclaimer.body.57
zh=第三十六章 卸载、残留清理与迁移\n\n第二百零二条（卸载方式）您可通过系统卸载程序移除 PMCL。卸载通常会删除程序文件，但未必会删除用户数据目录，具体取决于平台与安装方式。\n\n第二百零三条（残留数据位置）用户数据通常位于 PMCL 的数据目录与游戏目录中，包括账户信息、正版下载标记、缓存与日志。请在卸载后检查该等目录。\n\n第二百零四条（迁移到新设备的步骤）建议依次执行：退出登录；备份存档与配置；复制游戏目录（如需）；在新设备安装 PMCL；重新登录并完成验证。\n\n第二百零五条（迁移后的验证）正版下载标记随数据目录复制而保留，但启动校验仍要求正版账户。若未复制数据目录，新设备上的下载将重新登记。\n\n第二百零六条（卸载与已下载内容）卸载启动器不会自动删除游戏目录中的版本文件。您可以在其他启动器中继续使用这些文件，但须遵守游戏权利方的使用条款。\n\n第二百零七条（重新安装后的状态）重新安装后，若数据目录被保留，登录状态与标记可能仍在；若被清除，则需要重新登录与验证。\n\n第二百零八条（清理建议）彻底清理时，请依次删除数据目录、日志目录与缓存目录，并检查是否存在自行创建的备份或同步副本。\n\n第二百零九条（数据不可恢复）本地数据被删除或覆盖后通常无法恢复。请在清理前确认已备份所有需要保留的内容。
en=Chapter 36 Uninstall, Residue and Migration\n\nUninstalling through the system usually removes program files but may leave the user data directory, depending on platform and installation method. User data typically lives in the PMCL data directory and the game directory, including account information, premium-download markers, caches and logs; check them after uninstalling. To migrate: sign out, back up saves and settings, copy the game directory if needed, install PMCL on the new device, then sign in and verify again. Markers travel with the data directory, but launch checks still require a premium account. Uninstalling does not delete game files, which remain usable elsewhere under the rights holder's terms. Deleted local data is generally unrecoverable.
ja=第36章 アンインストール・残留・移行\n\nシステムの削除機能ではプログラムは消えてもユーザーデータディレクトリが残る場合があり、プラットフォームと導入方法によります。ユーザーデータは通常、PMCL データディレクトリとゲームディレクトリにあり、アカウント情報、正規ダウンロードマーカー、キャッシュ、ログを含みます。移行手順は、サインアウト、セーブと設定のバックアップ、必要に応じゲームディレクトリの複製、新端末への PMCL 導入、再サインインと再認証です。マーカーはデータディレクトリと共に移りますが、起動確認には正規アカウントが必要です。アンインストールしてもゲームファイルは残り、権利者の条件の下で利用できます。削除したローカルデータは通常復元できません。

consent.authorization.body.37
zh=第二十二章 令牌生命周期与刷新机制\n\n第一百一十五条（令牌类型）本功能涉及两类令牌：访问令牌用于在短时间内向第三方服务证明会话有效；刷新令牌用于在访问令牌过期后换取新的访问令牌。两者均加密保存在本机。\n\n第一百一十六条（刷新时机）当访问令牌临近过期、启动游戏需要有效会话、或您主动触发重新验证时，PMCL 会尝试刷新。刷新需要网络与第三方服务可用。\n\n第一百一十七条（刷新失败的处理）刷新失败可能由网络中断、令牌被撤销、账号状态异常或第三方服务故障引起。此时本功能将要求您重新登录；重新登录即构成新的授权行为。\n\n第一百一十八条（令牌的吊销）您可以在游戏权利方的账号安全页面撤销对第三方应用的授权。撤销后，本地的刷新令牌将失效，本功能随即不可用。\n\n第一百一十九条（令牌不共享）我们不会将您的令牌提供给任何第三方，也不会用于本功能以外的请求；令牌仅在本机与相应的第三方服务之间使用。\n\n第一百二十条（令牌的删除）退出登录会删除本地保存的令牌；删除账户会同时清除标识与用户名；卸载并清除数据目录会删除全部本地令牌。\n\n第一百二十一条（残留风险）若您的设备被他人使用、备份未加密或系统被入侵，令牌仍可能被读取。请为设备设置登录密码，并避免在公共设备上保持登录状态。
en=Chapter 22 Token Lifecycle and Refresh\n\nAccess tokens prove session validity briefly; refresh tokens obtain new access tokens. Both are stored encrypted locally. PMCL refreshes when a token nears expiry, when launching needs a valid session, or when you re-verify; refreshing needs network and third-party availability. Failures caused by outages, revocation, abnormal account status or service faults require signing in again, which constitutes a new authorization. You may revoke third-party access in the rights holder's security settings, which invalidates the refresh token and disables the Feature. Tokens are never shared with third parties nor used for other requests. Signing out deletes them; uninstalling and clearing data removes all local tokens. Device sharing, unencrypted backups or compromise can still expose them.
ja=第22章 トークンのライフサイクルと更新\n\nアクセストークンは短期間のセッション証明に、リフレッシュトークンは新しいアクセストークンの取得に用い、いずれも端末内に暗号化保存します。有効期限が近いとき、起動に有効なセッションが必要なとき、または再認証時に更新を試み、通信と第三者サービスの可用性が必要です。障害・失効・アカウント異常・サービス障害による失敗時は再サインインを求め、これが新たな認証となります。権利者のセキュリティ設定で第三者アクセスを取り消すとリフレッシュトークンが無効になり本機能は利用できません。トークンは第三者に提供せず、他の要求にも使用しません。サインアウトで削除され、アンインストールとデータ消去で全て削除されます。

consent.authorization.body.38
zh=第二十三章 多账号与账号切换\n\n第一百二十二条（多账号共存）PMCL 支持在本地账户库中保存多个账户。您可以在多个账户之间切换，但同一时刻只有当前选中的账户用于启动与验证。\n\n第一百二十三条（切换的含义）切换账户后，本功能将以新账户的所有权状态重新判断是否开放。若新账户不是微软账户或未通过验证，本功能将不可用。\n\n第一百二十四条（切换的记录）切换本身不会修改已下载版本的正版标记；但启动校验始终针对当前选中的账户，因此需要正版账户处于选中状态。\n\n第一百二十五条（频繁切换的风险）短时间内频繁切换账户并触发验证，可能被第三方判定为异常行为。请避免在自动化脚本或批量工具中切换账户。\n\n第一百二十六条（本地账户库的安全）本地账户库保存在数据目录中，可能包含多个账户的标识与加密令牌。请妥善保护该目录，避免整目录复制或分享。\n\n第一百二十七条（移除账户）移除账户会清除该账户在本地保存的标识与令牌，但不影响其他账户，也不删除已下载的游戏版本。\n\n第一百二十八条（账号归属不变）多账号共存不改变任何账户的归属。您仍需确保仅使用本人合法所有的账户进行验证。
en=Chapter 23 Multiple Accounts and Switching\n\nThe local account store may hold several accounts, but only the selected one is used for launch and verification. Switching re-evaluates availability against the new account; a non-Microsoft or unverified account disables the Feature. Switching does not change premium-download markers, but launch checks always target the selected account. Frequent switching with repeated verification may be judged abnormal; avoid automation or bulk tools. The account store may contain identifiers and encrypted tokens for several accounts, so protect the directory and avoid copying or sharing it wholesale. Removing an account clears only that account's local data.
ja=第23章 複数アカウントと切替\n\nローカルのアカウントストアに複数のアカウントを保存できますが、起動と認証に使われるのは選択中の一つだけです。切替後は新しいアカウントで可否を再判定し、非 Microsoft または未認証の場合は利用できません。切替は正規ダウンロードマーカーを変更しませんが、起動確認は常に選択中のアカウントを対象とします。短時間の頻繁な切替と再認証は異常と判断される場合があり、自動化や一括ツールでの切替は避けてください。ストアには複数アカウントの識別子と暗号化トークンが含まれるため、ディレクトリの保護と一括コピーの回避が必要です。

consent.authorization.body.39
zh=第二十四章 网络环境、代理与本地网关\n\n第一百二十九条（网络依赖）本功能需要访问 Microsoft 账户服务、游戏权利方的所有权接口以及内容分发渠道。任一环节不可用都可能导致验证或下载失败。\n\n第一百三十条（系统代理）PMCL 的更新分发与部分网络请求可能遵循系统代理设置；而地区判定使用直连方式测量出口 IP，不经过代理。两者的差别可能导致「能联网但判定为受限」的现象。\n\n第一百三十一条（代理认证）若您的代理需要认证，请在系统中配置好凭据，或临时关闭代理后重试。我们不读取、也不保存您的代理凭据。\n\n第一百三十二条（本地网关与强制门户）在酒店、机场或企业网络中，强制门户可能拦截请求并返回登录页面。此时验证会失败，请完成门户认证后再试。\n\n第一百三十三条（证书拦截）部分安全软件或企业网关会替换 HTTPS 证书。PMCL 不信任未知证书，验证会因此失败；请通过信任配置解决，不要关闭证书校验。\n\n第一百三十四条（IPv6 与双栈）在双栈网络中，不同协议的出口 IP 可能归属不同地区。判定可能随协议选择而变化，属于正常现象。\n\n第一百三十五条（网络诊断）若怀疑网络问题，可先在浏览器中访问对应服务确认可达性，再提交日志与网络环境信息。
en=Chapter 24 Networks, Proxies and Local Gateways\n\nThe Feature needs Microsoft account services, ownership endpoints and content channels; failure at any point blocks verification or downloads. PMCL updates and some requests may follow system proxy settings, while regional determination measures the egress IP directly, which can produce "online but restricted" results. Configure proxy credentials in the system or disable the proxy temporarily; we never read or store them. Captive portals in hotels, airports or enterprises intercept requests; complete portal authentication first. Security software or gateways replacing HTTPS certificates cause verification failures; fix trust configuration rather than disabling certificate checks. In dual-stack networks, IPv4 and IPv6 egress may belong to different regions.
ja=第24章 ネットワーク・プロキシ・ローカルゲートウェイ\n\n本機能は Microsoft のアカウントサービス、所有権エンドポイント、配布チャネルへの到達が必要で、いずれかが利用できないと認証やダウンロードが失敗します。PMCL の更新や一部の要求はシステムプロキシに従う場合がありますが、地域判定は出口 IP を直接測定するため「通信は可能だが制限判定」という現象が起こり得ます。プロキシ認証はシステム側で設定するか一時的に無効化してください。ホテルや空港、企業の captive portal は要求を横取りするため、ポータル認証を先に完了してください。証明書を差し替えるソフトやゲートウェイは認証失敗の原因となり、証明書検証を切らずに信頼設定で解決してください。

consent.authorization.body.40
zh=第二十五章 数据备份、迁移与恢复\n\n第一百三十六条（备份建议）建议您定期备份数据目录中的配置与账户信息，以及游戏目录中的存档与模组。备份应保存在与设备分离的位置，并视需要加密。\n\n第一百三十七条（备份中的敏感数据）数据目录包含加密令牌，属于敏感数据。备份文件应妥善保管，避免上传至公开的网盘或代码仓库。\n\n第一百三十八条（迁移步骤）迁移到新设备时，建议先在新设备安装 PMCL，再复制配置；令牌可能因设备或系统变化而失效，届时需要重新登录。\n\n第一百三十九条（不保证可迁移）我们不保证本地数据在不同版本、不同操作系统之间可迁移。跨平台迁移时，部分路径与格式可能需要重新生成。\n\n第一百四十条（恢复的限制）本地数据损坏后通常无法恢复。我们无法从服务器重建您的账户数据，因为我们不保存该等数据。\n\n第一百四十一条（恢复后的验证）即使成功恢复数据，启动校验仍以当前账户类型为准；非正版账户无法启动经本功能下载的版本。\n\n第一百四十二条（云同步）PMCL 不提供账户数据的云同步。若您使用第三方同步工具同步数据目录，请自行评估其安全性与合规性。
en=Chapter 25 Backup, Migration and Recovery\n\nBack up configuration and account information in the data directory, plus saves and mods in the game directory, ideally off-device and encrypted if needed. The data directory contains encrypted tokens and should never be uploaded to public drives or repositories. To migrate, install PMCL first, then copy configuration; tokens may become invalid across devices or systems and require signing in again. Migration across versions or operating systems is not guaranteed, and some paths or formats may need regeneration. Corrupted local data generally cannot be recovered, and we cannot rebuild it from servers because we store no such data. Even after recovery, launch checks still require a premium account. PMCL offers no cloud sync.
ja=第25章 バックアップ・移行・復元\n\nデータディレクトリの設定とアカウント情報、ゲームディレクトリのセーブと Mod を、端末と分離した場所へ必要に応じ暗号化して保管してください。データディレクトリには暗号化トークンが含まれるため、公開ストレージやリポジトリへのアップロードは避けてください。移行時は先に PMCL を導入し、その後で設定を複製します。トークンは端末や OS の変更で失効し、再サインインが必要になる場合があります。版や OS をまたぐ移行は保証されず、パスや形式の再生成が必要なことがあります。破損したローカルデータは通常復元できず、当方はサーバーから再構築できません。復元後も起動確認には正規アカウントが必要です。

consent.authorization.body.41
zh=第二十六章 授权与消费者权益\n\n第一百四十三条（不排除法定权利）本授权不排除您依适用法律享有的个人信息权益与消费者权益。若本协议与强制性规定冲突，在该范围内以法律规定为准。\n\n第一百四十四条（知情权与解释）您有权要求我们解释处理规则。若本协议某处表述不清，我们会在合理范围内补充说明，而不以含糊表述限制您的权利。\n\n第一百四十五条（撤回不设障碍）撤回授权不需要任何理由，也不需要经过审批。我们不会因您撤回而降低其他功能的质量，或要求您支付费用。\n\n第一百四十六条（未成年人保护）涉及未成年人的处理，以更有利于未成年人的规则为准；监护人可代为行使撤回与删除的权利。\n\n第一百四十七条（投诉与救济）您可先通过公开渠道投诉；未获答复或对答复不满的，可依适用法律向有关机构投诉或寻求司法救济。\n\n第一百四十八条（条款无效的处理）若本协议某一条款被认定无效，其余条款继续有效，双方以最接近原意的有效条款替代，且不影响您已依法取得的权利。\n\n第一百四十九条（法律强制规定的优先）个人信息保护、数据安全、未成年人保护与消费者保护的强制性规定，优先于本协议的任何相反约定。
en=Chapter 26 Authorization and Consumer Rights\n\nThis authorization does not exclude your personal information or consumer rights under applicable law; mandatory rules prevail where they conflict. You may ask us to explain processing rules, and we will clarify rather than rely on ambiguity to limit your rights. Withdrawal requires no reason or approval, and we will not degrade other features or charge you for withdrawing. Processing involving minors follows rules more favourable to them, and guardians may exercise withdrawal and deletion. Complaints may be raised publicly first, and you retain any statutory remedies. Invalid clauses are replaced without affecting the rest or rights already acquired. Mandatory rules on personal information, data security, minors and consumers prevail.
ja=第26章 認証と消費者保護\n\n本認証は適用法上の個人情報に関する権利と消費者の権利を排除しません。強行規定と抵触する場合はその範囲で法令が優先します。処理規則の説明を求めることができ、不明瞭な表現で権利を制限するのではなく合理的に補足します。撤回に理由や承認は不要で、撤回を理由に他の機能の品質を下げたり費用を請求したりしません。未成年者に関する処理はより有利な規則に従い、保護者は撤回と削除を代行できます。まず公開窓口へ相談でき、法令上の救済手段は保持されます。無効な条項は他の条項や既得の権利に影響せず置き換えます。個人情報・データ安全・未成年者・消費者の強行規定が優先します。

consent.disclaimer.body.58
zh=第三十七章 用户反馈、建议与内容许可\n\n第二百一十条（反馈的提交）您可以通过项目代码仓库的 Issue、讨论区、文档中列明的公开渠道提交缺陷报告、功能建议与体验反馈。提交时请说明 PMCL 版本、系统环境与问题现象，以便我们定位。\n\n第二百一十一条（禁止提交的内容）请勿在任何公开反馈中包含账号密码、登录令牌、身份证件、支付信息、精确住址或其他敏感数据。若您认为必须提供日志，请先自行脱敏，替换用户名、绝对路径与内网地址。\n\n第二百一十二条（反馈的许可）您提交的缺陷描述、建议与示例代码，视为许可我们在改进产品、编写文档、回复问题与发布说明中使用，且不因此产生报酬或其他对价义务。\n\n第二百一十三条（署名意愿）若您希望在文档、发布说明或致谢列表中被署名，请在提交时明确说明希望使用的名称；我们会在合理范围内尊重该意愿，但无法保证每一次采纳都附带署名。\n\n第二百一十四条（保密期待）我们不承诺对反馈内容保密。公开渠道提交的内容本身即可能被他人看到；若您有保密需求，请勿通过公开渠道提交。\n\n第二百一十五条（建议的采纳）是否采纳建议、何时采纳以及如何实现，由我们自行决定。未采纳不构成违约，也不构成对您任何承诺的违反。\n\n第二百一十六条（内容权利保证）您保证提交的反馈、示例与素材不侵犯第三方的著作权、商标权或其他权利。若因您提交的内容引发第三方主张，由您自行承担责任。\n\n第二百一十七条（恶意内容）对于包含恶意代码、虚假信息、骚扰、歧视或其他不当内容的反馈，我们有权不予处理、删除相关内容，并保留追究责任的权利。\n\n第二百一十八条（处理期限）我们会尽力处理收到的反馈，但不承诺固定的响应时间或修复时间。涉及安全的问题会优先处理。\n\n第二百一十九条（渠道变更）反馈渠道可能随项目调整而变化。以项目文档中最新列明的渠道为准；旧渠道可能不再被监控。
en=Chapter 37 Feedback, Suggestions and Content Licence\n\nSubmit reports and suggestions through the repository's issues, discussions or documented channels, including the PMCL version, environment and symptoms. Never include passwords, tokens, identity documents, payment details, precise addresses or other sensitive data; redact usernames, paths and internal addresses before sharing logs. Submitted descriptions, suggestions and sample code are licensed to us for improving the product, documentation, replies and release notes, without compensation. Tell us if you want to be credited, and we will respect that where reasonable. Public submissions are not confidential. Whether and when to adopt suggestions is our decision and non-adoption is not a breach. You warrant your submissions infringe no third-party rights. Malicious, false or harassing content may be removed.
ja=第37章 フィードバック・提案・内容の許諾\n\nリポジトリの Issue、ディスカッション、文書記載の窓口から、PMCL の版、環境、症状を添えて報告してください。パスワード、トークン、身分証、支払い情報、正確な住所などの機密情報を含めず、ログを共有する前にユーザー名・パス・内部アドレスを伏せてください。提出された説明・提案・サンプルコードは、製品改善、文書作成、回答、リリースノートでの利用を許諾したものとし、対価は発生しません。クレジット希望は合理的範囲で尊重します。公開窓口の内容は秘密扱いではありません。採用の可否と時期は当方が判断し、不採用は违约ではありません。第三者の権利を侵害しないことを保証してください。悪意ある内容は削除することがあります。

consent.disclaimer.body.59
zh=第三十八章 第三方主张、投诉与转达\n\n第二百二十条（转达义务）若我们收到与您使用本功能相关的第三方投诉、权利主张或监管问询，在法律允许的范围内，我们可能将相关内容转达给您，以便您作出回应。\n\n第二百二十一条（配合处理）收到转达后，您应在合理期限内作出说明或采取必要措施。拒不配合可能被视为违约，我们有权据此中止向您提供本功能。\n\n第二百二十二条（我们不代为抗辩）我们不承担代您应对第三方主张的义务，也不为您提供法律意见。是否抗辩、如何抗辩以及是否和解，由您自行决定。\n\n第二百二十三条（直接投诉）第三方也可以直接向您主张权利。若您收到相关主张，请自行评估并寻求专业意见，不必等待我们的转达。\n\n第二百二十四条（信息提供的边界）除法律要求外，我们不会向第三方提供您的账号数据，因为我们不集中保存该等数据。我们能够提供的通常限于公开的项目记录。\n\n第二百二十五条（我们的独立权利）若第三方的行为损害了我们的合法权益（例如冒用项目名义、篡改分发渠道），我们有权独立主张权利，该等主张与您无关。\n\n第二百二十六条（主张的处理结果）第三方主张可能以协商、撤回、和解或诉讼方式结束。无论结果如何，我们不因此对您承担赔偿责任，法律另有规定的除外。\n\n第二百二十七条（错误投诉）若您认为投诉内容不实，请提供可核实的说明。我们不会介入您与第三方的实体争议，也不会对投诉的真实性作出判断。\n\n第二百二十八条（转达的记录）为便于追溯，我们可能保存与投诉相关的往来记录。该等记录按适用法律与最小必要原则处理。\n\n第二百二十九条（合规问询）若监管机构依法问询，我们将在法律允许的范围内配合，并尽可能提前告知可能的影响。
en=Chapter 38 Third-Party Claims, Complaints and Referral\n\nIf we receive complaints, rights claims or regulatory inquiries relating to your use, we may refer them to you where the law allows so you can respond. You should explain or act within a reasonable period; refusing to cooperate may be treated as a breach and justify suspension. We do not defend claims on your behalf or provide legal advice; whether and how to defend or settle is your decision. Third parties may also contact you directly. Except where legally required we do not provide your account data, since we do not store it centrally; what we can provide is generally limited to public project records. We may independently protect our own rights, such as against misuse of the project's name or tampered distribution channels.
ja=第38章 第三者の主張・苦情・転送\n\n本機能の利用に関連する苦情、権利主張、規制当局の照会を受けた場合、法令の許す範囲で内容を利用者へ転送し、対応の機会を提供することがあります。合理的期間内に説明または措置を行ってください。協力が得られない場合、违约として本機能の提供を中止することがあります。当方は利用者に代わって主張を防御せず、法的助言も行いません。防御や和解の可否は利用者が判断してください。第三者が直接連絡する場合もあります。法令上の要請を除き、アカウントデータは集中保存していないため提供できず、提供可能な情報は通常、公開されたプロジェクト記録に限られます。

consent.disclaimer.body.60
zh=第三十九章 服务恢复与灾难应对\n\n第二百三十条（恢复目标）我们的目标是尽快恢复本功能的可用性，但不承诺任何具体的恢复时间或可用性指标。本功能不属于关键基础设施，也不适用于对连续性有严格要求的场景。\n\n第二百三十一条（数据恢复的范围）我们不保存您的账号数据副本，因此无法在数据丢失时为您恢复账户信息、令牌或版本标记。恢复工作主要针对功能可用性与分发渠道。\n\n第二百三十二条（重大故障的处置）发生重大故障时，我们可能优先恢复启动与验证的基础能力，再逐步恢复下载相关能力。恢复顺序由我们根据影响面决定。\n\n第二百三十三条（用户侧的应对）故障期间，您可改用游戏权利方提供的官方渠道继续游戏。已安装的版本通常不受影响，可继续通过 PMCL 启动（需满足账户类型要求）。\n\n第二百三十四条（服务终止的区别）灾难应对针对可恢复的故障；若项目整体终止，则适用第十五章与第二十二章关于终止与承继的约定。\n\n第二百三十五条（演练与改进）我们可能在合适的时候进行流程演练与改进，但不保证向您披露演练细节，以免带来新的安全风险。\n\n第二百三十六条（不可抗力）因不可抗力导致的长时间中断，依第十四章处理。我们不因此承担违约责任，但会在可行范围内说明情况。\n\n第二百三十七条（第三方故障）第三方服务的大面积故障可能导致本功能不可用。该等情形不属于我们的可控范围，我们仅在能力范围内提供替代方案或说明。\n\n第二百三十八条（信息发布）故障与恢复进展可能通过启动器公告或项目页面发布。信息可能滞后或不完整，请以最终恢复状态为准。\n\n第二百三十九条（恢复后的校验）恢复后，本功能可能要求您重新登录或重新验证，以确认会话与账户状态仍然有效。
en=Chapter 39 Service Recovery and Disaster Response\n\nWe aim to restore availability quickly but promise no specific recovery time or availability target; the Feature is not critical infrastructure and is unsuitable for strict continuity requirements. We keep no copies of your account data, so we cannot restore account information, tokens or version markers after loss; recovery focuses on functionality and distribution channels. For major incidents we may restore launch and verification first, then downloads, in an order we choose based on impact. During outages you may use the rights holder's official channels; installed versions usually still launch if account requirements are met. Recovery is distinct from termination, which follows Chapters 15 and 22. Force majeure is handled under Chapter 14. After recovery you may need to sign in or verify again.
ja=第39章 サービス復旧と災害対応\n\n可用性の早期回復を目指しますが、具体的な復旧時間や可用性目標は約束しません。本機能は重要インフラではなく、厳格な継続性が求められる用途には適しません。アカウントデータの複製を保持しないため、データ喪失時にアカウント情報・トークン・マーカーを復元できず、復旧は機能と配布経路が対象です。重大障害では起動と認証を優先し、その後ダウンロードを復旧することがあり、順序は影響範囲に基づき当方が決定します。障害期間中は権利者の公式窓口を利用でき、インストール済みの版は条件を満たせば起動できます。復旧は終了とは異なり、終了は第15章と第22章に従います。不可抗力は第14章によります。

consent.authorization.body.42
zh=第二十七章 数据处理的记录与证明\n\n第一百五十条（记录的内容）本功能在本地记录同意版本、同意时间、撤回时间与验证结果。该等记录用于证明处理活动的合法性基础，以及在争议中说明当时的同意状态。\n\n第一百五十一条（记录的完整性）我们尽力保证记录准确，但本地记录可能因系统时间错误、数据损坏或人为修改而不完整或不准确，因此不构成对事实的绝对证明。\n\n第一百五十二条（记录的保存期限）同意记录保存至您清除数据目录；撤回记录在撤回后保留，用于证明授权已终止，直至数据目录被清除。\n\n第一百五十三条（记录的可导出）您可自行复制或截图保存相关记录；我们不提供专门的导出工具，也不对您自行导出的副本承担责任。\n\n第一百五十四条（第三方请求）若监管机构或司法机关依法要求提供处理记录，我们只能提供项目层面的公开记录，因为您的同意记录保存在您自己的设备上。\n\n第一百五十五条（记录的删除影响）删除记录后，重新使用本功能时需要重新阅读并确认协议；这不影响此前已经发生的处理的合法性。\n\n第一百五十六条（不用于画像）上述记录不用于用户画像、信用评估或任何形式的自动化决策，也不与第三方共享。\n\n第一百五十七条（审计的边界）我们不进行远程审计。若您自行开展内部合规审计，我们可提供本协议文本与项目层面的说明，但不提供您设备上的数据。
en=Chapter 27 Records and Evidence of Processing\n\nWe record locally the consent version, consent time, withdrawal time and verification outcome, used to evidence the lawful basis and the state of consent in a dispute. Records are kept as accurately as practicable but may be incomplete or inaccurate due to clock errors, corruption or tampering, and are not conclusive proof. Consent records persist until you clear the data directory; withdrawal records remain to evidence termination. You may copy or screenshot records yourself; we provide no export tool and accept no liability for your copies. For regulatory or judicial requests we can only provide public project-level records, since your consent records stay on your device. Deleting records requires re-reading and reconfirming before further use.
ja=第27章 処理の記録と証明\n\n同意の版、同意時刻、撤回時刻、認証結果を端末内に記録し、適法性の基礎と紛争時の同意状態の説明に用います。記録は正確性に努めますが、時刻の誤り、破損、改変により不完全・不正確となる場合があり、事実の絶対的証明にはなりません。同意記録はデータディレクトリの消去まで保存し、撤回記録は終了の証明として残ります。記録はご自身で複製・撮影でき、専用の書き出し機能は提供せず、複製物の責任も負いません。当局や司法からの要請には公開されたプロジェクト記録のみ提供でき、同意記録は端末内にあります。記録削除後は再度の確認が必要です。

consent.authorization.body.43
zh=第二十八章 与游戏权利方的关系\n\n第一百五十八条（无代理关系）我们与游戏权利方之间不存在代理、受托、合作或授权关系。本授权仅约束您与 PMCL 之间，不产生对游戏权利方的任何效力。\n\n第一百五十九条（不代其行事）我们不会以游戏权利方的名义处理您的账号、请求或投诉，也无权代表其作出承诺、给予折扣或变更条款。\n\n第一百六十条（其条款独立适用）您与游戏权利方之间的权利义务，由其服务条款与隐私政策调整。本协议不改变该等条款，也不减轻您在该等条款下的义务。\n\n第一百六十一条（其政策变化）若游戏权利方调整接口、政策或账户规则，可能导致本功能不可用。该等变化不属于我们的违约，我们会尽力适配或说明。\n\n第一百六十二条（其数据实践）游戏权利方对您账号数据的处理，依其隐私政策进行，不受本授权约束。我们无法控制该等处理，也无法代为行使您对其的权利。\n\n第一百六十三条（权利主张的路径）若您对游戏权利方的处理有异议，应直接向其提出；我们可提供公开渠道的信息，但不介入实体争议。\n\n第一百六十四条（我们不背书）本功能的存在不构成游戏权利方对 PMCL 的认可、推荐或背书；同理，我们也不对游戏权利方的商业行为作出评价。\n\n第一百六十五条（终止时的衔接）本授权终止后，您与游戏权利方之间的法律关系不受影响，您仍可依其条款使用已购买的游戏。
en=Chapter 28 Relationship with the Rights Holder\n\nThere is no agency, entrustment, cooperation or authorization between us and the rights holder; this authorization binds only you and PMCL. We do not act in their name on accounts, requests or complaints, and cannot make commitments, grant discounts or vary their terms. Your relationship with them is governed by their terms and privacy policy, which this Agreement neither changes nor relaxes. Changes to their interfaces, policies or account rules may disable the Feature without breach on our part. Their processing of account data follows their privacy policy and is outside this authorization. Disputes with them should be raised directly; we do not endorse them, nor do they endorse PMCL.
ja=第28章 ゲーム権利者との関係\n\n当方と権利者の間に代理・受託・提携・許諾関係はなく、本認証は利用者と PMCL の間のみを拘束します。当方は権利者の名義でアカウント・要求・苦情を処理せず、約束や割引、条件変更を行う権限もありません。利用者と権利者の関係は同社の規約とプライバシーポリシーに従い、本契約はそれを変更・緩和しません。同社のインターフェースや方針、アカウント規則の変更により本機能が利用できなくなる場合も、当方の违约ではありません。同社によるアカウントデータの処理は本認証の範囲外です。同社への異議は直接申し立ててください。

consent.authorization.body.44
zh=第二十九章 用户协助义务与合理配合\n\n第一百六十六条（配合的范围）为完成验证与启动，您需要保持设备可用、网络通畅、系统时间准确，并按提示完成登录。该等配合属于本功能正常运行的必要条件。\n\n第一百六十七条（信息提供）在提交问题或申诉时，您应提供真实、完整、可核实的信息。提供虚假信息可能导致处理延迟，或被认定为滥用渠道。\n\n第一百六十八条（合理期限）我们可能要求您在合理期限内补充材料或确认状态。逾期未回应的，我们可暂缓处理，直至收到您的回复。\n\n第一百六十九条（设备管理）您应自行管理设备上的软件环境，包括安全软件配置、系统更新与磁盘空间。因环境问题导致的功能异常，需由您自行排查。\n\n第一百七十条（不转移义务）本协议不免除您依适用法律或与第三方约定所负的义务。您不得以本功能的存在为由，主张减轻该等义务。\n\n第一百七十一条（配合的边界）我们不会要求您提供账号密码、支付凭据或与功能无关的个人信息；若遇到此类要求，请提高警惕并向我们反馈。\n\n第一百七十二条（协助的成本）您为配合本功能所支出的时间与费用（如网络流量、设备维护）由您自行承担，我们不另行补偿。\n\n第一百七十三条（拒绝配合的后果）若您拒绝必要的配合，可能导致验证失败或本功能不可用。该等后果不属于我们的违约。
en=Chapter 29 User Cooperation\n\nVerification and launching require an available device, working network, accurate system time and completing sign-in as prompted. When reporting issues or appealing, provide true, complete and verifiable information; false information may delay handling or be treated as abuse. We may ask you to supply materials or confirm status within a reasonable period, and may pause handling until you respond. You manage your software environment, including security settings, updates and disk space; environment problems are yours to diagnose. This Agreement does not relieve obligations owed under law or to third parties. We never ask for passwords or payment credentials; report any such request. Time and costs of cooperating are yours, and refusing necessary cooperation may disable the Feature.
ja=第29章 利用者の協力義務\n\n認証と起動には、利用可能な端末、正常な通信、正確なシステム時刻、指示に従ったサインインが必要です。問題報告や申立てでは真実で完全かつ検証可能な情報を提供してください。虚偽の情報は処理の遅延や濫用とみなされる場合があります。合理的期間内の追加資料や状況確認を求めることがあり、回答がない間は処理を保留することがあります。セキュリティ設定、更新、空き容量を含むソフト環境は利用者が管理し、環境に起因する不具合は利用者が切り分けてください。本契約は法令や第三者に対する義務を免除しません。パスワードや支払い情報を求めることはなく、そのような要求には注意し通報してください。

