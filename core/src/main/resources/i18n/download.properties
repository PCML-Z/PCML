native.rustcraft.name
zh=RustCraft
en=RustCraft
ja=RustCraft

native.rustcraft.summary
zh=Rust 重写的 1.8.9 客户端。使用本机 1.8.9 的资源，并用环境变量 RUSTCRAFT_RENDER_BACKEND=vulkan 启动。
en=A Rust reimplementation of the 1.8.9 client. It uses the local 1.8.9 assets and starts with RUSTCRAFT_RENDER_BACKEND=vulkan.
ja=1.8.9 を Rust で再実装したクライアントです。このコンピューターの 1.8.9 資源を使い、RUSTCRAFT_RENDER_BACKEND=vulkan で起動します。

native.mc112.name
zh=Minecraft 1.12.2 Rust
en=Minecraft 1.12.2 Rust
ja=Minecraft 1.12.2 Rust

native.mc112.summary
zh=Rust 移植的 1.12.2 客户端。使用本机 1.12.2 的资源，并在 options.txt 里把渲染固定为 Vulkan。仓库没有发行包时，用本机的 Cargo 编译。
en=A Rust port of the 1.12.2 client. It uses the local 1.12.2 assets and pins Vulkan in options.txt. With no release package, it is built with the local Cargo.
ja=1.12.2 の Rust 移植です。このコンピューターの 1.12.2 資源を使い、options.txt で Vulkan に固定します。リリースが無いときは、この端末の Cargo でビルドします。

native.pomme.name
zh=Pomme
en=Pomme
ja=Pomme

native.pomme.summary
zh=Rust 编写的现代客户端。启动时使用本机已经安装的 Minecraft 26.2 资源，并按它自己的启动参数拉起。
en=A Rust client for modern versions. It starts with the Minecraft 26.2 assets already installed on this computer and the launch arguments the client expects.
ja=新しいバージョン向けの Rust クライアントです。この端末に入っている Minecraft 26.2 の資源と、クライアントが求める起動引数で起動します。

