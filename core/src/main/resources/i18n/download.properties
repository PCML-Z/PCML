zh=第八章 知识产权\n\n第三十九条（游戏内容权利）Minecraft 游戏本体、资源文件、音效、图像、商标、名称及其他内容所涉的著作权、商标权与其他权利，归 Mojang Studios、Microsoft 及其许可方所有。\n\n第四十条（PMCL 权利）PMCL 的源代码、界面设计、文档、图标与名称归其各自贡献者所有，并依随附的开源许可证授权使用。您对 PMCL 的使用应同时遵守该等许可证。\n\n第四十一条（商标使用）本协议不授予您任何商标、商号、标识或品牌名称的使用许可。您不得以容易引起混淆、误认或暗示官方关联的方式使用相关名称与标识。\n\n第四十二条（权利声明）您不得移除、遮蔽或篡改下载内容、PMCL 界面或文档中出现的版权声明、许可信息、来源标注与其他权利标识。\n\n第四十三条（反馈与建议）您向我们提出的功能建议、缺陷反馈或其他信息，我们不因此承担保密义务，但会在合理范围内尊重您的署名意愿。
en=Chapter 8 Intellectual Property\n\nArticle 39 (Game content) Copyright, trademark and other rights in the Minecraft game, assets, audio, images, marks and names belong to Mojang Studios, Microsoft and their licensors.\n\nArticle 40 (PMCL) The source code, interface design, documentation, icons and name of PMCL belong to their respective contributors and are licensed under the accompanying open-source licenses.\n\nArticle 41 (Trademarks) This Agreement grants no license to any trademark, trade name, logo or brand name. You may not use them in a way that causes confusion, misrepresentation or suggests official affiliation.\n\nArticle 42 (Notices) You may not remove, obscure or alter copyright notices, license information, source attribution or other rights notices in downloaded content, the PMCL interface or its documentation.\n\nArticle 43 (Feedback) Suggestions, bug reports and other information you send us carry no confidentiality obligation on our side, though we will respect your wish to be credited where reasonable.
ja=第8章 知的財産\n\n第39条（ゲーム内容）Minecraft のゲーム本体、アセット、音声、画像、商標、名称その他の権利は Mojang Studios、Microsoft およびその許諾者に帰属します。\n\n第40条（PMCL）PMCL のソースコード、UI デザイン、文書、アイコン、名称は各貢献者に帰属し、添付のオープンソースライセンスに従って利用されます。\n\n第41条（商標）商標・商号・ロゴ・ブランド名の使用許諾は与えません。混同や誤認、公式との関係を示唆する使用は禁止します。\n\n第42条（権利表示）ダウンロード内容、PMCL の画面、文書に含まれる著作権表示、ライセンス情報、出所表示その他の権利表示を削除・隠蔽・改変してはなりません。\n\n第43条（提案）ご提案や不具合報告などに保密義務は生じませんが、合理的な範囲でクレジットの希望を尊重します。

consent.disclaimer.body.10
zh=第九章 第三方服务\n\n第四十四条（微软与 Mojang 服务）账户登录与所有权查询依赖 Microsoft 与 Mojang 提供的在线服务。该等服务的可用性、准确性、费率与政策由其自行决定，我们无法控制也无法保证。\n\n第四十五条（分发渠道）下载内容的传输可能依赖游戏权利方指定的分发渠道、内容分发网络或镜像站点。该等渠道的中断、限速、内容变更、地址失效与我们无关。\n\n第四十六条（第三方条款）您在使用第三方服务时，应同时遵守其服务条款、隐私政策与可接受使用政策。就第三方服务本身而言，第三方条款与本协议冲突的，以第三方条款为准。\n\n第四十七条（服务中断）因第三方服务调整、封禁、收费、停止运营或接口变更，导致本功能全部或部分不可用的，我们不承担违约责任，但会尽合理努力告知情况。\n\n第四十八条（无担保的第三方链接）本功能可能包含指向第三方页面的链接。我们不对该等页面的内容、安全性或可用性负责。
en=Chapter 9 Third-Party Services\n\nArticle 44 (Microsoft and Mojang) Sign-in and ownership queries rely on online services provided by Microsoft and Mojang. Their availability, accuracy, fees and policies are theirs to decide; we neither control nor guarantee them.\n\nArticle 45 (Distribution channels) Content may be delivered through channels, content delivery networks or mirrors designated by the rights holder. Their outages, throttling, content changes or broken URLs are outside our control.\n\nArticle 46 (Third-party terms) When using third-party services you must also comply with their terms, privacy policies and acceptable-use policies. For those services, their terms prevail over this Agreement.\n\nArticle 47 (Outages) If a third party's adjustments, bans, fees, shutdown or interface changes make the Feature wholly or partly unavailable, we bear no liability, though we will make reasonable efforts to inform you.\n\nArticle 48 (External links) The Feature may link to third-party pages. We are not responsible for their content, security or availability.
ja=第9章 第三者サービス\n\n第44条（Microsoft・Mojang）サインインと所有権照会は Microsoft と Mojang のオンラインサービスに依存します。可用性・正確性・料金・方針は各社が決定し、当方は制御も保証もできません。\n\n第45条（配布経路）内容の配信は権利者指定の経路、CDN、ミラーに依存することがあります。その中断・帯域制限・内容変更・URL 失効は当方の関与外です。\n\n第46条（第三者の条件）第三者サービスの利用時は、その利用規約・プライバシーポリシー・利用ポリシーにも従う必要があります。当該サービスについては第三者の条件が優先します。\n\n第47条（停止時）第三者の方針変更・遮断・有料化・終了・API 変更により本機能が全部または一部利用できなくなっても、当方は債務不履行責任を負いませんが、合理的に状況をお知らせします。\n\n第48条（外部リンク）本機能には第三者のページへのリンクが含まれることがあります。内容・安全性・可用性について当方は責任を負いません。

