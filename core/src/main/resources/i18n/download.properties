native.classicube.summary
zh=Minecraft Classic 的 C 客户端，自带材质，不使用 Java 版资源。没有对应发行包时用 Make 编译。
en=A C client for Minecraft Classic. It ships its own textures and does not use Java Edition assets. Without a matching package it is built with Make.
ja=Minecraft Classic の C クライアントです。独自のテクスチャを同梱し、Java 版の資源は使いません。対応パッケージが無いときは Make でビルドします。

