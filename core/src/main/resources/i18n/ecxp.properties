ja=アプリはまだありません

ecxp.empty_hint
zh=选择一个 .ecxp 安装包，或一个带 pmcl-app.json 的文件夹。
en=Pick an .ecxp package, or a folder that contains pmcl-app.json.
ja=.ecxp パッケージ、または pmcl-app.json を含むフォルダーを選んでください。

