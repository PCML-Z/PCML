ecxp.permissions_all
zh=完整的启动器权限：账号、启动和结束游戏、实例、版本、模组、存档、设置、文件、网络，以及管理插件。
en=Full launcher access: accounts, starting and stopping games, instances, versions, mods, worlds, settings, files, network, and plugin management.
ja=ランチャーのすべての権限：アカウント、ゲームの起動と終了、インスタンス、バージョン、Mod、ワールド、設定、ファイル、ネットワーク、プラグイン管理。

ecxp.trust_hint
zh=应用以你的身份在本机运行，只安装你信任的来源。
en=The app runs on this computer as you. Only install apps from sources you trust.
ja=アプリはこのコンピューター上であなたとして動作します。信頼できる提供元のものだけをインストールしてください。

