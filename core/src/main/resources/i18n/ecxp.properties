# ecxp
# 一条文案四行：键、zh、en、ja。换行写成 \n，反斜杠写成 \\

ecxp.subtitle
zh=用 .NET 10 或 .NET 11 写的工具，在自己的窗口里打开，可以直接操作启动器。
en=Tools built with .NET 10 or .NET 11. Each opens in its own window and can control the launcher.
ja=.NET 10 または .NET 11 で作られたツールです。専用ウィンドウで開き、ランチャーを直接操作できます。

ecxp.install
zh=安装应用
en=Install app
ja=アプリをインストール

