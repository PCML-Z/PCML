ecxp.error.invalid_package
zh=这不是有效的 ECXP 安装包。
en=This is not a valid ECXP package.
ja=有効な ECXP パッケージではありません。

ecxp.error.missing_manifest
zh=安装包里没有 pmcl-app.json。
en=The package has no pmcl-app.json.
ja=パッケージに pmcl-app.json がありません。

ecxp.error.invalid_id
zh=pmcl-app.json 里的 id 不合规：只能用小写字母、数字、点和短横线，以字母开头。
en=The id in pmcl-app.json is invalid. Use lowercase letters, digits, dots, and dashes, starting with a letter.
ja=pmcl-app.json の id が不正です。英小文字・数字・ドット・ハイフンのみ使え、先頭は英字にしてください。

ecxp.error.invalid_framework
zh=不支持的 framework「{0}」。请用 net10.0 或 net11.0。
en=Unsupported framework "{0}". Use net10.0 or net11.0.
ja=未対応の framework「{0}」です。net10.0 か net11.0 を使ってください。

ecxp.error.invalid_entry
zh=入口或图标路径不合规，必须是安装包里的相对路径。
en=The entry or icon path is invalid. It must be a relative path inside the package.
ja=エントリまたはアイコンのパスが不正です。パッケージ内の相対パスにしてください。

ecxp.error.invalid_permission
zh=未知权限「{0}」。
en=Unknown permission "{0}".
ja=不明な権限「{0}」です。

ecxp.error.missing_entry
zh=安装包里找不到入口文件 {0}。
en=The entry file {0} is missing from the package.
ja=パッケージにエントリファイル {0} がありません。

ecxp.error.too_large
zh=安装包太大了（上限 512 MB、2 万个文件）。
en=The package is too large (limit 512 MB and 20,000 files).
ja=パッケージが大きすぎます（上限 512 MB・2 万ファイル）。

ecxp.error.unknown_app
zh=找不到这个应用，可能已经被卸载。
en=App not found. It may have been uninstalled.
ja=アプリが見つかりません。アンインストールされた可能性があります。

ecxp.error.missing_dotnet
zh=没有找到 dotnet。请先安装 .NET 10 或 .NET 11。
en=dotnet was not found. Install .NET 10 or .NET 11 first.
ja=dotnet が見つかりません。先に .NET 10 または .NET 11 をインストールしてください。

ecxp.error.missing_runtime
zh=这个应用需要 .NET {0} 运行时，本机还没有装。
en=This app needs the .NET {0} runtime, which is not installed.
ja=このアプリには .NET {0} ランタイムが必要ですが、インストールされていません。

ecxp.error.launch_failed
zh=应用没能启动：{0}
en=The app failed to start: {0}
ja=アプリを起動できませんでした：{0}
