mp.connectx_hint
zh=ConnectX 需要配置客户端二进制和服务器地址（点击右上角设置按钮）
en=ConnectX requires configuring the client binary and server address (click the settings button in the top right)
ja=ConnectX はクライアントバイナリとサーバーアドレスの設定が必要です（右上の設定ボタンをクリック）

mp.terracotta_hint
zh=Terracotta 是 HMCL 同款陶瓦联机实现，房间码互通，首次使用需下载约 8-14MB 二进制。
en=Terracotta is the same Terracotta implementation as HMCL with interoperable room codes. First use requires downloading ~8-14MB binary.
ja=Terracotta は HMCL と同等の陶瓦聯機実装で、ルームコード互換です。初回使用時に約 8-14MB のバイナリをダウンロードします。

mp.share_room_code_hint
zh=把房间码发给朋友，他在 PMCL 联机页粘贴后点「加入房间」即可。
en=Share the room code with your friend. They paste it on the PMCL multiplayer page and click "Join Room".
ja=ルームコードを友人に共有します。友人は PMCL マルチプレイページに貼り付けて「ルームに参加」をクリックします。

mp.direct_connect_hint
zh=在 Minecraft 多人游戏 → 「直接连接」中输入此地址即可加入房主。
en=Enter this address in Minecraft Multiplayer → "Direct Connect" to join the host.
ja=Minecraft マルチプレイ → 「直接接続」でこのアドレスを入力してホストに参加します。

mp.virtual_ip_hint
zh=房客用「直接连接」输入此 IP:端口（端口是房主游戏内「对局域网开放」时显示的端口）
en=Guests use "Direct Connect" with this IP:port (the port shown when the host selects "Open to LAN" in-game)
ja=ゲストは「直接接続」でこの IP:ポートを入力します（ポートはホストがゲーム内で「LANに公開」を選んだ時に表示されるポートです）

