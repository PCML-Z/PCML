mp.usage.terracotta.host.1
zh=1. 点击「创建房间」，首次会自动下载 Terracotta 官方二进制（约 8-14MB）
en=1. Click "Create Room". The official Terracotta binary (~8-14MB) will be downloaded automatically on first use.
ja=1. 「ルーム作成」をクリック。初回は Terracotta 公式バイナリ（約 8-14MB）が自動ダウンロードされます。

mp.usage.terracotta.host.2
zh=2. 房间创建后会得到房间码（U/XXXX-XXXX-XXXX-XXXX）
en=2. After creating the room, you will get a room code (U/XXXX-XXXX-XXXX-XXXX).
ja=2. ルーム作成後、ルームコード（U/XXXX-XXXX-XXXX-XXXX）が取得できます。

mp.usage.terracotta.host.3
zh=3. 进入单人世界 → ESC 菜单 → 「对局域网开放」
en=3. Enter a single-player world → ESC menu → "Open to LAN"
ja=3. シングルプレイワールドに入る → ESC メニュー → 「LANに公開」

mp.usage.terracotta.guest.1
zh=1. 粘贴房主发来的房间码 → 点击「加入房间」
en=1. Paste the host's room code → click "Join Room".
ja=1. ホストのルームコードを貼り付け → 「ルームに参加」をクリック。

mp.usage.terracotta.guest.2
zh=2. 加入成功后 PMCL 会显示本地 MC 连接地址（如 127.0.0.1:25565）
en=2. After joining, PMCL will show the local MC connection address (e.g. 127.0.0.1:25565).
ja=2. 参加成功後、PMCL はローカル MC 接続アドレス（例: 127.0.0.1:25565）を表示します。

mp.usage.terracotta.guest.3
zh=3. 启动 Minecraft → 多人游戏 → 「直接连接」→ 输入该地址
en=3. Launch Minecraft → Multiplayer → "Direct Connect" → enter that address.
ja=3. Minecraft を起動 → マルチプレイ → 「直接接続」→ そのアドレスを入力。

mp.usage.terracotta.note
zh=Terracotta 陶瓦联机 by Burning_TNT，基于 EasyTier P2P。与 HMCL / PCL CE 房间码互通。
en=Terracotta multiplayer by Burning_TNT, based on EasyTier P2P. Room codes are interoperable with HMCL / PCL CE.
ja=Terracotta マルチプレイ by Burning_TNT、EasyTier P2P ベース。HMCL / PCL CE とルームコード互換。

mp.usage.connectx.1
zh=1. 房主点击「创建房间」，ConnectX 会连接服务器并创建房间。
en=1. Host clicks "Create Room". ConnectX connects to the server and creates a room.
ja=1. ホストが「ルーム作成」をクリック、ConnectX がサーバーに接続してルームを作成します。

mp.usage.connectx.2
zh=2. 房主复制邀请码发给朋友。
en=2. Host copies the invitation code and sends it to friends.
ja=2. ホストは招待コードをコピーして友人に送信します。

mp.usage.connectx.3
zh=3. 房客粘贴邀请码后点击「加入房间」。
en=3. Guest pastes the invitation code and clicks "Join Room".
ja=3. ゲストは招待コードを貼り付けて「ルームに参加」をクリックします。

mp.usage.connectx.4
zh=4. 房主进入单人世界 → 菜单 → 「对局域网开放」
en=4. Host enters a single-player world → menu → "Open to LAN"
ja=4. ホストはシングルプレイワールドに入る → メニュー → 「LANに公開」

mp.usage.connectx.5
zh=5. 房客：多人游戏 → 「直接连接」→ 输入 房主虚拟IP:端口
en=5. Guest: Multiplayer → "Direct Connect" → enter host's virtual IP:port
ja=5. ゲスト: マルチプレイ → 「直接接続」→ ホストの仮想 IP:ポートを入力

mp.usage.connectx.note
zh=提示：ConnectX 基于 ZeroTier P2P，支持中继模式。需先在设置中配置服务器和客户端。
en=Tip: ConnectX is based on ZeroTier P2P and supports relay mode. Configure the server and client in settings first.
ja=ヒント: ConnectX は ZeroTier P2P ベースで、リレーモードをサポートします。事前に設定でサーバーとクライアントを構成してください。

mp.usage.easytier.1
zh=1. 房主点击「创建房间」，等待 EasyTier 启动并分配虚拟 IP。
en=1. Host clicks "Create Room" and waits for EasyTier to start and assign a virtual IP.
ja=1. ホストが「ルーム作成」をクリック、EasyTier の起動と仮想 IP の割り当てを待ちます。

mp.usage.easytier.2
zh=2. 房主复制邀请码发给朋友。
en=2. Host copies the invitation code and sends it to friends.
ja=2. ホストは招待コードをコピーして友人に送信します。

mp.usage.easytier.3
zh=3. 房客粘贴邀请码后点击「加入房间」，等待双方都显示「已连接」。
en=3. Guest pastes the invitation code, clicks "Join Room", and waits until both sides show "Connected".
ja=3. ゲストは招待コードを貼り付けて「ルームに参加」をクリック、双方に「接続済み」と表示されるのを待ちます。

mp.usage.easytier.4
zh=4. 房主进入单人世界 → 菜单 → 「对局域网开放」，游戏会显示端口号（如 12345）
en=4. Host enters a single-player world → menu → "Open to LAN". The game will show a port number (e.g. 12345).
ja=4. ホストはシングルプレイワールドに入る → メニュー → 「LANに公開」。ゲームにポート番号（例: 12345）が表示されます。

mp.usage.easytier.5
zh=5. 房客：多人游戏 → 「直接连接」→ 输入 房主虚拟IP:端口（如 10.144.144.10:12345）
en=5. Guest: Multiplayer → "Direct Connect" → enter host's virtual IP:port (e.g. 10.144.144.10:12345)
ja=5. ゲスト: マルチプレイ → 「直接接続」→ ホストの仮想 IP:ポートを入力（例: 10.144.144.10:12345）

mp.usage.easytier.warning
zh=⚠ 重要：不要用「多人游戏」列表自动扫描！虚拟网络不转发 LAN 广播，列表里看不到房间，必须用「直接连接」手动输入 IP:端口。
en=⚠ Important: Do not use the "Multiplayer" list auto-scan! Virtual networks do not forward LAN broadcasts, so rooms won't appear in the list. You must use "Direct Connect" and enter the IP:port manually.
ja=⚠ 重要:「マルチプレイ」リストの自動スキャンは使わないでください！仮想ネットワークは LAN ブロードキャストを転送しないため、リストにルームが表示されません。「直接接続」で IP:ポートを手動入力してください。

mp.usage.easytier.note
zh=提示：官方公共节点 public.easytier.cn 已停用。使用 EasyTier 前请在联机设置填写自建/第三方共享节点；无节点时请改用「陶瓦联机」。macOS/Linux 创建虚拟网卡通常需要 sudo。双方需都显示「已连接」才能联机。
en=Tip: The official public node public.easytier.cn is discontinued. Configure a self-hosted/third-party shared node in multiplayer settings, or switch to Terracotta. Creating a TUN usually needs sudo on macOS/Linux. Both sides must show "Connected".
ja=ヒント: 公式公開ノード public.easytier.cn は停止しています。EasyTier 利用前に設定で自前/第三者ノードを記入するか、「陶瓦聯機」を使ってください。macOS/Linux の仮想 NIC 作成には通常 sudo が必要です。双方が「接続済み」になる必要があります。

mp.easytier_peer
zh=EasyTier 共享节点
en=EasyTier shared peer
ja=EasyTier 共有ノード

mp.easytier_peer_hint
zh=格式如 tcp://主机:11010。官方 public.easytier.cn 已失效；留空将尝试内置节点（通常会失败）。
en=e.g. tcp://host:11010. Official public.easytier.cn is dead; leave empty to try built-in peers (usually fails).
ja=例: tcp://host:11010。公式 public.easytier.cn は無効です。空欄だと内蔵ノードを試し、通常は失敗します。

mp.connectx_about
zh=说明：ConnectX 是基于 ZeroTier SDK 的 P2P 联机方案。需要自行编译 ConnectX.ClientConsole 并部署 ConnectX.Server。项目地址：github.com/Corona-Studio/ConnectX
en=Note: ConnectX is a P2P multiplayer solution based on the ZeroTier SDK. You need to compile ConnectX.ClientConsole yourself and deploy ConnectX.Server. Project: github.com/Corona-Studio/ConnectX
ja=説明: ConnectX は ZeroTier SDK ベースの P2P マルチプレイソリューションです。ConnectX.ClientConsole を自身でコンパイルし、ConnectX.Server をデプロイする必要があります。プロジェクト: github.com/Corona-Studio/ConnectX

