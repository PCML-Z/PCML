mp.redstone_create_tip
zh=先在游戏里对局域网开放。游戏正在运行时会用日志里的端口；否则用联机设置里的本机端口。
en=Open the world to LAN first. If the game is running, PMCL uses the port from the log; otherwise it uses the local port in multiplayer settings.
ja=先にワールドをLANへ公開してください。ゲーム実行中はログのポート、それ以外はマルチプレイ設定のローカルポートを使います。

mp.redstone_idle_hint
zh=创建房间后把公网地址发给朋友，对方在游戏里直接连接。加入时粘贴对方发来的地址。
en=After you create a room, send the public address to friends so they can connect directly in game. To join, paste the address they sent.
ja=ルーム作成後、公開アドレスを友人に送り、ゲーム内から直接接続してもらいます。参加するときは受け取ったアドレスを貼り付けます。

mp.redstone_share_hint
zh=把这个地址发给朋友。对方在 Minecraft 的「直接连接」里输入即可，不必安装模组，也不必进入同一个局域网。
en=Send this address to friends. They type it into Minecraft Direct Connect. No mod and no shared LAN are required.
ja=このアドレスを友人に送ってください。相手は Minecraft の「直接接続」に入力します。Mod も同じ LAN も不要です。

mp.placeholder.redstone
zh=粘贴公网地址，例如 122.51.108.96:12345
en=Paste a public address, for example 122.51.108.96:12345
ja=公開アドレスを貼り付け（例: 122.51.108.96:12345）

mp.state.requesting_tunnel
zh=正在申请隧道…
en=Requesting a tunnel…
ja=トンネルを申請中…

mp.redstone_relay
zh=中继服务器
en=Relay
ja=リレー

mp.redstone_relay_hint
zh=默认官方节点 122.51.108.96。控制端口 3000，数据端口 7000。也可以换成你自己的红石联机中继。
en=The default relay is 122.51.108.96. Control port 3000, tunnel port 7000. You can switch to your own Redstone Online relay.
ja=既定のリレーは 122.51.108.96 です。制御ポート 3000、トンネルポート 7000。自分のリレーにも切り替えられます。

mp.redstone_local_port
zh=本机 Minecraft 端口
en=Local Minecraft port
ja=ローカルの Minecraft ポート

mp.redstone_local_port_hint
zh=对局域网开放之后，日志里那一行端口。专用服务器通常是 25565。
en=The port printed in the log after you open to LAN. A dedicated server usually uses 25565.
ja=LAN公開後にログへ出るポートです。専用サーバーは通常 25565 です。

mp.redstone_max_players
zh=同时连接上限
en=Connection limit
ja=同時接続の上限

mp.redstone_max_players_hint
zh=1 到 50。每有一个空位，就会向中继保持一条隧道。
en=From 1 to 50. Each slot keeps one tunnel connection to the relay.
ja=1 から 50。空き枠ごとにリレーへトンネルを 1 本維持します。

mp.redstone_bad_port
zh=本机端口要在 1 到 65535 之间
en=The local port must be between 1 and 65535
ja=ローカルポートは 1 から 65535 の間にしてください

mp.redstone_bad_max
zh=同时连接上限要在 1 到 50 之间
en=The connection limit must be between 1 and 50
ja=同時接続の上限は 1 から 50 の間にしてください

mp.usage.redstone.host.1
zh=在联机设置里确认中继和本机端口。
en=Check the relay and the local port in multiplayer settings.
ja=マルチプレイ設定でリレーとローカルポートを確認します。

mp.usage.redstone.host.2
zh=打开要联机的世界，在暂停菜单里对局域网开放。
en=Open the world you want to share and choose Open to LAN in the pause menu.
ja=共有するワールドを開き、一時停止メニューから LAN に公開します。

mp.usage.redstone.host.3
zh=回到 PMCL 点创建房间。成功后把公网地址发给朋友。
en=Return to PMCL and create a room. Then send the public address to friends.
ja=PMCL に戻ってルームを作成し、公開アドレスを友人に送ります。

mp.usage.redstone.guest.1
zh=把房主发来的公网地址粘贴到这里，点加入。下次启动游戏会直接连这个地址，也可以在游戏里手动连接。
en=Paste the host's public address here and join. The next launch connects to it, or you can connect manually in game.
ja=ホストの公開アドレスを貼り付けて参加します。次回起動時にそのアドレスへ接続します。ゲーム内から手動で接続しても構いません。

mp.usage.redstone.note
zh=玩家流量会经过你填写的中继。请只发布自己的世界或服务器。房客不需要安装模组。
en=Player traffic goes through the relay you set. Only publish a world or server you own. Guests do not need a mod.
ja=プレイヤーの通信は設定したリレーを通ります。自分のワールドかサーバーだけを公開してください。参加者に Mod は不要です。
