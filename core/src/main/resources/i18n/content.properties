content.offline_skin.title
zh=离线皮肤
en=Offline Skins
ja=オフラインスキン

content.offline_skin.hint
zh=皮肤保存在启动器目录。填好玩家名后，可以写入当前版本或实例的游戏目录，由 CustomSkinLoader 的 LocalSkin 读取。该版本需要安装 CustomSkinLoader，游戏里才会显示这些皮肤。应用到离线账号会记下当前这张皮肤。
en=Skins are stored in the launcher directory. After a player name is set, they can be written into the selected version or instance for CustomSkinLoader LocalSkin. That version needs CustomSkinLoader for the skin to appear in game. Applying a skin stores it on the current offline account.
ja=スキンはランチャーのディレクトリに保存されます。プレイヤー名を入れてから、選択中のバージョンまたはインスタンスへ書き込めます。CustomSkinLoader の LocalSkin が読みます。ゲーム内で表示するには、そのバージョンに CustomSkinLoader が必要です。適用すると現在のオフラインアカウントに記録されます。

