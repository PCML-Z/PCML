content.memory.title
zh=内存占用
en=Memory
ja=メモリ

content.memory.hint
zh=每秒刷新。大数字是操作系统看到的物理内存。启动器还会标出 Java 堆；游戏能读到 -Xmx 时会标出堆上限。
en=Refreshes every second. The large numbers are physical memory reported by the operating system. The launcher also shows its Java heap. A game shows its heap limit when -Xmx can be read.
ja=1秒ごとに更新します。大きい数字は OS が見ている物理メモリです。ランチャーは Java ヒープも表示し、ゲームは -Xmx が読めるときヒープ上限を表示します。

