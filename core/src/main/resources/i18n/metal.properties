metal.warning
zh=MetalRender 为第三方实验性 mod，可能存在兼容性问题。如遇崩溃请在设置中关闭。
en=MetalRender is a third-party experimental mod. May cause compatibility issues. Disable in settings if crashing.
ja=MetalRender はサードパーティの実験的 mod です。互換性の問題が発生する可能性があります。クラッシュする場合は設定で無効化してください。
