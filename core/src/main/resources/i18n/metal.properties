# metal
# 一条文案四行：键、zh、en、ja。换行写成 \n，反斜杠写成 \\

metal.title
zh=Metal 渲染加速
en=Metal Rendering
ja=Metal レンダリング

metal.description
zh=使用 Apple Metal API 替换 OpenGL 渲染后端，提升 macOS 上的游戏帧率。仅支持 Apple Silicon (M1+) + Fabric + Sodium。请先选中已安装 Fabric 的兼容版本再开启。
en=Replaces OpenGL with Apple Metal API for better FPS on macOS. Requires Apple Silicon (M1+) + Fabric + Sodium. Select a compatible Fabric instance first.
ja=OpenGL を Apple Metal API に置き換え、macOS でより高い FPS を実現します。Apple Silicon (M1+) + Fabric + Sodium が必要です。互換性のある Fabric バージョンを先に選択してください。

metal.enable
zh=启用 Metal 渲染
en=Enable Metal Rendering
ja=Metal レンダリングを有効化

