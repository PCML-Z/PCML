about.license.conflict_banner
zh=本软件用的是自定义非商业许可证，不是 GPL / MIT / Apache。GPL、LGPL 不允许再加「不得商用」这类限制。下面按条标了可能的冲突。许可证第 8.4 条写「以第三方许可证为准、只限该组件」，这挡不住 GPL 对组合作品的要求。
en=PMCL uses a custom non-commercial license, not GPL, MIT, or Apache. GPL/LGPL forbid extra restrictions such as “non-commercial only”. Possible conflicts are marked below. License §8.4 says the third-party license wins within that component — that does not waive GPL obligations for a combined work.
ja=本ソフトは独自の非商用ライセンスであり、GPL / MIT / Apache ではない。GPL・LGPL は「非商用のみ」などの追加制限を禁じる。下記は起こり得る衝突。ライセンス第 8.4 条の「第三者ライセンスが当該コンポーネントの範囲で優先」は、結合著作物に対する GPL の要求を打ち消さない。

about.license.conflict_label
