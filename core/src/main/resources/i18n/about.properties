zh=注意
en=Note
ja=注意

about.license.conflict.java
zh=GPL-2.0 + Classpath Exception。当独立模块链接时一般可与其他许可证共存。若把 JDK 源码并进不可分割的单一作品、或改完后不再保持模块边界，Classpath Exception 可能失效，从而与 Apache 2.0 依赖及本许可证冲突。Apache 2.0 与 GPL-2.0 本身不兼容，全靠 Classpath Exception 隔离。
en=GPL-2.0 + Classpath Exception. Linking as a separate module is usually fine. If JDK sources are merged into one inseparable work, or module boundaries are dropped after modification, the Classpath Exception may not apply — conflicting with Apache 2.0 dependencies and this license. Apache 2.0 is incompatible with GPL-2.0; isolation depends on the Classpath Exception.
ja=GPL-2.0 + Classpath Exception。独立モジュールとしてリンクする分には通常共存できる。JDK ソースを不可分の単一作品に取り込んだり、改変後にモジュール境界を失ったりすると Classpath Exception が効かなくなり、Apache 2.0 依存および本ライセンスと衝突し得る。Apache 2.0 と GPL-2.0 は非互換で、隔離は Classpath Exception に依存する。

about.license.conflict.javafx
zh=GPL-2.0 + Classpath Exception。独立模块使用通常可共存。打进 fat JAR、模块边界不清时，存在与 Apache 2.0 组件及本许可证冲突的风险。
en=GPL-2.0 + Classpath Exception. Fine as a separate module. Bundling into a fat JAR that blurs module boundaries risks conflict with Apache 2.0 components and this license.
ja=GPL-2.0 + Classpath Exception。独立モジュールなら通常問題ない。fat JAR にまとめモジュール境界が曖昧になると、Apache 2.0 コンポーネントおよび本ライセンスと衝突するリスクがある。

about.license.conflict.ffmpeg
zh=经 JavaCV/ByteDeco 预编译包引入，常见构建带 --enable-gpl。若实际链接的是 GPL 版 FFmpeg，组合作品须按 GPL 兼容条款分发；本许可证的非商业限制是 GPL 不允许的额外限制。只有分发可替换的 LGPL 构建并履行再链接义务时，才可能避开。
en=Pulled in via JavaCV/ByteDeco prebuilds, which often use --enable-gpl. If the linked FFmpeg is GPL, the combined work must be distributed under GPL-compatible terms; this license’s non-commercial limit is an extra restriction GPL forbids. Avoidable only with a replaceable LGPL build and relinking obligations met.
ja=JavaCV/ByteDeco のプレビルド経由。よく --enable-gpl 付き。リンク先が GPL 版 FFmpeg なら結合著作物は GPL 互換条件で配布する必要があり、本ライセンスの非商用制限は GPL が禁じる追加制限。置換可能な LGPL ビルドを配布し再リンク義務を果たす場合に限り回避し得る。

about.license.conflict.javacv
zh=常见授权为 GPL-2.0（或带 Classpath Exception）。若无 Classpath Exception，或与 GPL 版 FFmpeg 绑在一起，可能迫使组合作品遵循 GPL，与本许可证的非商业条款冲突。
en=Typically GPL-2.0 (sometimes with Classpath Exception). Without the Exception, or if bound to GPL FFmpeg, the combined work may have to follow GPL, conflicting with this license’s non-commercial terms.
ja=多くは GPL-2.0（Classpath Exception 付きの場合あり）。Exception が無い、または GPL 版 FFmpeg と一体だと、結合著作物が GPL に従う必要があり、本ライセンスの非商用条項と衝突し得る。

about.license.conflict.easytier
zh=LGPL-3.0（不是 Apache 2.0）。LGPL-3 要求保留对该库的替换/再链接权利，且不得用额外条款限制对该库的 GPL/LGPL 权利。EasyTier 虽以独立进程运行，若把其二进制算进「本软件」并套用非商业限制，即构成冲突。须单独保留 LGPL-3.0、提供源码或书面要约，并允许用户替换该二进制。
en=LGPL-3.0 (not Apache 2.0). LGPL-3 requires the right to replace/relink the library and forbids extra limits on GPL/LGPL rights in that library. EasyTier runs as a separate process, but treating its binary as part of “this software” under the non-commercial terms is a conflict. Keep LGPL-3.0 on that binary, provide source or a written offer, and allow replacement.
ja=LGPL-3.0（Apache 2.0 ではない）。LGPL-3 は当該ライブラリの置換・再リンクを認め、その GPL/LGPL 権利への追加制限を禁じる。別プロセスでも、バイナリを「本ソフト」に含めて非商用制限を掛ければ衝突。LGPL-3.0 を単独で残し、ソースまたは書面の提供、バイナリ置換を認める必要がある。

