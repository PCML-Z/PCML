# agreement
# 一条文案四行：键、zh、en、ja。换行写成 \n，反斜杠写成 \\

agreement.title
zh=欢迎使用 PMCL
en=Welcome to PMCL
ja=PMCL へようこそ

agreement.subtitle
zh=在开始使用之前，请您仔细阅读并同意以下协议。\n这些协议明确了您与开发者之间的权利与义务。
en=Before you start, please carefully read and agree to the following agreements.\nThese agreements define the rights and obligations between you and the developer.
ja=使い始める前に、以下の規約をよく読んで同意してください。\nこれらの規約はあなたと開発者間の権利と義務を定めます。

agreement.user_agreement_title
zh=PMCL 用户协议
en=PMCL User Agreement
ja=PMCL ユーザー規約

agreement.user_agreement_desc
zh=规定了您使用本软件的权利、义务及行为规范
en=Specifies your rights, obligations, and conduct rules when using this software
ja=本ソフトウェア使用時の権利、義務、行動規範を規定

agreement.disclaimer_title
zh=PMCL 免责协议
en=PMCL Disclaimer
