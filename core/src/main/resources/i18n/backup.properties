backup.restore_body
zh=文件会写回原来的位置。被覆盖或删除的当前文件会先做成一份「还原前」快照，还可以再恢复回来。
en=Files are written back where they were. Anything overwritten or removed is kept in a "before restore" snapshot.
ja=ファイルは元の場所へ書き戻します。上書きまたは削除される現在のファイルは、先に「復元前」スナップショットへ残します。

