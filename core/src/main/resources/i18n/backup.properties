# backup
# 一条文案四行：键、zh、en、ja。换行写成 \n，反斜杠写成 \\

backup.title
zh=时间机器
en=Time Machine
ja=タイムマシン

backup.hint
zh=按时间保留世界、模组、配置、资源包和光影。没改过的文件只存一份。账号、令牌和密钥不会备份。启动器设置里可能有代理密码，默认不包含。
en=Keeps worlds, mods, configs, resource packs and shaders over time. Unchanged files are stored once. Accounts, tokens and keys are never included. Launcher settings can contain proxy passwords and stay off unless you turn them on.
ja=ワールド、Mod、設定、リソースパック、シェーダーを時系列で残します。変わっていないファイルは1回だけ保存します。アカウント、トークン、鍵はバックアップしません。ランチャー設定にはプロキシパスワードが含まれることがあるため、初期状態では対象外です。

