settings.predictive_launch_desc
zh=基于贝叶斯概率模型按时段和使用习惯预测最可能的版本，进入启动页时后台预热该版本的启动资源（构建 LaunchProfile + JVM 页缓存）。点击启动匹配版本时跳过资源校验阶段加速启动，启动其他版本则自动清空预热。不启动 MC 进程，不弹游戏窗口
en=Predicts the most likely version using a Bayesian model based on time and usage habits, preloads launch resources in background when entering the launch page (builds LaunchProfile + JVM page cache). Launching the matched version skips resource validation to accelerate startup, launching other versions auto-clears the preload. Does not start MC process or show game window
