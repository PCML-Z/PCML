zh=关闭 macOS 低电量模式，游戏退出后尝试恢复
en=Disables macOS low power mode; attempts to restore on game exit
ja=macOS 低電力モードを無効化、ゲーム終了後に復元を試行

settings.perf.l3_system_power_warning
zh=开启后每次启动会弹 macOS 管理员密码框（MainKt 脚本授权）。不需要可保持关闭；点「不允许」会自动关闭本选项
