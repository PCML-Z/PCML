zh=macOS: taskpolicy -P high + renice -20；Windows: REALTIME；Linux: renice -20
en=macOS: taskpolicy -P high + renice -20; Windows: REALTIME; Linux: renice -20
ja=macOS: taskpolicy -P high + renice -20; Windows: REALTIME; Linux: renice -20

settings.perf.l2_crazy_priority_warning
zh=拉到系统调度优先级极限。开启后每次启动会弹 macOS 管理员密码框；点「不允许」会自动关闭本选项。Windows REALTIME 可能导致鼠标键盘卡顿
