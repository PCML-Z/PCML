ja=L2 プロセスレベル調整

settings.perf.l2_process_desc
zh=macOS: taskpolicy 提升 QoS + caffeinate 防休眠；Windows/Linux: 提优先级
en=macOS: taskpolicy boosts QoS + caffeinate prevents sleep; Windows/Linux: raises priority
ja=macOS: taskpolicy で QoS 向上 + caffeinate でスリープ防止; Windows/Linux: 優先度を上げる

