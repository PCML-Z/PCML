settings.ime_agent
zh=附加 Java Agent 修复输入法
en=Attach a Java agent to fix input methods
ja=Java Agent で入力メソッドを修復

settings.ime_agent_desc
zh=启动游戏时附加输入法 Agent。游戏自带的 GLFW 若有输入法接口，就打开系统输入法，并把候选框放在窗口底部。没有该接口时自动跳过。全屏下候选框仍可能被挡住。
en=Attaches an input-method agent when the game starts. If the bundled GLFW exposes an IME interface, the system input method is enabled and the candidate window is placed at the bottom of the game window. Otherwise it is skipped. Fullscreen can still hide the candidate window.
ja=ゲーム起動時に入力メソッド Agent を追加します。同梱の GLFW に IME インターフェースがあれば、システムの入力メソッドを有効にし、候補窓をウィンドウ下部に置きます。無ければ自動でスキップします。全画面では候補窓が隠れることがあります。

settings.automation.hint
zh=Kotlin 和 Java 由启动器编译，在单独进程里运行。C、C++、Go 追求效率时使用，发行版不附带这三种编译器，请自行编译成可执行文件后再选择。环境变量有 PMCL_EVENT、PMCL_VERSION_ID、PMCL_GAME_DIR、PMCL_EXIT_CODE、PMCL_WORK_DIR。
en=Kotlin and Java are compiled by the launcher and run in a separate process. Use C, C++, or Go when you want the extra speed: release builds do not ship those compilers, so compile the executable yourself and select it. Environment variables: PMCL_EVENT, PMCL_VERSION_ID, PMCL_GAME_DIR, PMCL_EXIT_CODE, PMCL_WORK_DIR.
ja=Kotlin と Java はランチャーがコンパイルし、別プロセスで実行します。C、C++、Go は速度が必要なとき用です。配布版にこれらのコンパイラは含まれないので、自分でコンパイルした実行ファイルを選んでください。環境変数は PMCL_EVENT、PMCL_VERSION_ID、PMCL_GAME_DIR、PMCL_EXIT_CODE、PMCL_WORK_DIR です。

