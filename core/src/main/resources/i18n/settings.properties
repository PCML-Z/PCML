en=This option needs macOS administrator privileges. After enabling, launching the game will show a system password prompt (script started by MainKt). Cancel if you don't want that.
ja=このオプションには macOS 管理者権限が必要です。有効化すると、ゲーム起動時にシステムがパスワード入力を求めます（MainKt が起動したスクリプト）。毎回パスワードを入力したくない場合はキャンセルしてください。

