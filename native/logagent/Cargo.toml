[package]
name = "pmcllogagent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Axolotl LogAgent diagnostic engine built into PMCL"

[lib]
name = "pmcllogagent"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2.2"
